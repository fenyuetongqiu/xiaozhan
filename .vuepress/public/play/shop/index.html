<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>深夜便利店与大肥鱼</title>
<style>
  :root{
    --ink:#eaf2ff;
    --box:rgba(10,18,34,.82);
    --line:rgba(150,200,255,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#05070d;color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    overflow:hidden;user-select:none;
  }
  #stage{position:relative;width:100%;height:100%;display:flex;
    align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .bg{position:absolute;inset:0;transition:opacity .9s ease}
  .bg.street{background:radial-gradient(120% 80% at 50% 0%, #16233d 0%, #0a1020 45%, #04060c 100%)}
  .bg.store{background:radial-gradient(110% 70% at 50% 10%, #23384f 0%, #101a2b 55%, #05080f 100%)}
  .bg.home{background:radial-gradient(100% 70% at 50% 20%, #2a2137 0%, #150f1e 55%, #060408 100%)}
  .bg.dawn{background:radial-gradient(120% 80% at 50% 0%, #6a5a7d 0%, #2b2a44 40%, #0b0c18 100%)}

  #rain{position:absolute;inset:-20%;pointer-events:none;opacity:.5;
    background-image:repeating-linear-gradient(105deg, rgba(180,215,255,.20) 0 1px, transparent 1px 7px);
    animation:rain .55s linear infinite;transition:opacity 1.2s}
  @keyframes rain{from{transform:translate3d(0,0,0)}to{transform:translate3d(-24px,60px,0)}}
  #rain.off{opacity:0}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.75) 100%)}

  #spriteWrap{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);
    height:56vh;max-height:560px;display:flex;align-items:flex-end;justify-content:center;
    transition:opacity .35s ease, transform .35s ease;
    filter:drop-shadow(0 18px 40px rgba(0,10,30,.65))}
  #sprite{height:100%;max-width:88vw;object-fit:contain;animation:bob 3.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #spriteWrap.hide{opacity:0;transform:translateX(-50%) translateY(16px)}

  #box{position:absolute;left:50%;bottom:3.2vh;transform:translateX(-50%);
    width:min(1040px,94vw);background:var(--box);border:1px solid var(--line);
    border-radius:16px;padding:18px 22px 22px;backdrop-filter:blur(10px);
    box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06)}
  #name{position:absolute;top:-15px;left:22px;padding:3px 14px;border-radius:999px;
    font-size:14px;letter-spacing:.08em;
    background:linear-gradient(180deg,#25406a,#16273f);
    border:1px solid var(--line);color:#cfe6ff}
  #text{min-height:4.6em;line-height:1.85;font-size:clamp(15px,1.45vw,19px);white-space:pre-wrap}
  #hint{position:absolute;right:20px;bottom:10px;font-size:12px;color:#7d93b5}
  #hint span{animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:.95}}

  #aff{position:absolute;top:18px;left:20px;font-size:13px;color:#a9c6ea;
    background:rgba(8,14,26,.6);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px)}
  #toast{position:absolute;top:56px;left:20px;font-size:13px;color:#ffd9a0;
    opacity:0;transform:translateY(-6px);transition:.35s}
  #toast.on{opacity:1;transform:translateY(0)}

  #choices{position:absolute;left:50%;bottom:calc(3.2vh + 158px);transform:translateX(-50%);
    width:min(880px,92vw);display:none;flex-direction:column;gap:10px;z-index:5}
  #choices.on{display:flex}
  .choice{text-align:left;padding:13px 18px;border-radius:12px;cursor:pointer;
    font-size:clamp(14px,1.35vw,17px);color:#eaf4ff;
    background:linear-gradient(180deg, rgba(30,48,76,.92), rgba(16,26,44,.92));
    border:1px solid rgba(140,190,255,.28);transition:.18s;font-family:inherit}
  .choice:hover{transform:translateX(6px);border-color:rgba(150,210,255,.75);
    box-shadow:0 8px 26px rgba(80,160,255,.18)}
  .choice b{color:#8fd0ff;margin-right:8px}

  /* 存档 / 读档 */
  #tools{position:absolute;top:16px;right:20px;display:flex;gap:8px;z-index:15}
  .tbtn{font-family:inherit;font-size:13px;color:#cfe6ff;cursor:pointer;
    background:rgba(8,14,26,.66);border:1px solid var(--line);border-radius:999px;
    padding:7px 16px;backdrop-filter:blur(6px);transition:.18s}
  .tbtn:hover{background:rgba(34,58,94,.9);transform:translateY(-1px)}
  #savePanel .slots{display:flex;flex-direction:column;gap:12px;width:min(560px,90vw)}
  .slot{display:flex;align-items:center;justify-content:space-between;gap:14px;
    text-align:left;padding:14px 18px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg, rgba(30,48,76,.92), rgba(16,26,44,.92));
    border:1px solid rgba(140,190,255,.28);transition:.18s;font-family:inherit;color:#eaf4ff}
  .slot:hover{border-color:rgba(150,210,255,.75);transform:translateY(-1px)}
  .slot .meta{font-size:12px;color:#8ba8c9;margin-top:4px}
  .slot.empty{opacity:.55}
  .slot .t{font-size:12px;color:#7d93b5;white-space:nowrap}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 90% at 50% 40%, rgba(12,20,38,.72), rgba(3,5,10,.94));
    backdrop-filter:blur(3px);z-index:20;text-align:center;padding:24px}
  .overlay.hide{display:none}
  h1{font-size:clamp(26px,4.2vw,46px);margin:0;letter-spacing:.06em;
    text-shadow:0 0 26px rgba(120,190,255,.45)}
  .sub{color:#9ebadb;font-size:clamp(13px,1.4vw,16px);line-height:1.9;max-width:640px}
  .btn{font-family:inherit;font-size:17px;padding:12px 42px;border-radius:999px;cursor:pointer;
    color:#06121f;font-weight:700;letter-spacing:.1em;
    background:linear-gradient(180deg,#a7dcff,#63b6f5);border:none;
    box-shadow:0 10px 34px rgba(90,175,255,.4);transition:.2s}
  .btn:hover{transform:translateY(-2px) scale(1.02)}
  .badge{font-size:12px;color:#88a5c8}
  #endTitle{font-size:clamp(22px,3.4vw,38px);font-weight:800;letter-spacing:.05em}
  #endStat{color:#a9c6ea;font-size:15px;line-height:2;max-width:660px;white-space:pre-wrap}
  .cleared{color:#7de2b0}
</style>
</head>
<body>
<div id="stage">
  <div class="bg street" id="bg"></div>
  <div id="rain"></div>
  <div id="vignette"></div>

  <div id="spriteWrap" class="hide"><img id="sprite" alt="大肥鱼" /></div>

  <div id="aff">好感度 <b id="affNum">0</b></div>
  <div id="toast"></div>

  <div id="tools">
    <button class="tbtn" id="saveBtn">存档</button>
    <button class="tbtn" id="loadBtn">读档</button>
  </div>

  <div class="overlay hide" id="savePanel">
    <div class="sub" id="saveTitle">存档</div>
    <div class="slots" id="saveSlots"></div>
    <div class="badge" id="saveTip"></div>
    <button class="btn" id="saveClose">返 回</button>
  </div>

  <div id="box">
    <div id="name">旁白</div>
    <div id="text"></div>
    <div id="hint"><span>点击 / 空格 继续</span></div>
  </div>

  <div id="choices"></div>

  <div class="overlay" id="title">
    <h1>深夜便利店与大肥鱼</h1>
    <div class="sub">
      雨下得像有人在天上拧拖把。<br>
      晚上十一点四十，你在便利店门口，捡到一只湿透的鲸鱼女仆。
    </div>
    <button class="btn" id="startBtn">开 始</button>
    <div class="badge" id="clearedBadge"></div>
  </div>

  <div class="overlay hide" id="ending">
    <div id="endTitle"></div>
    <div id="endStat"></div>
    <div class="badge" id="endNew"></div>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>

<script>
(function(){

    {lab:'start'},
    {bg:'street', s:'', n:'旁白', t:'晚上十一点四十。\n加班第不知道多少天，你从便利店出来，伞刚撑开就被风掀翻了。'},
    {bg:'street', s:'', n:'旁白', t:'雨里裹着便利店暖黄的灯。\n门口的台阶上，蹲着一团蓝色的东西。'},

    {s:'normal', n:'你', t:'（她说话带着奇怪的口音，像刚学会不久。尾巴在身后不自觉地拍了一下地砖。）'},

    {c:[
      {l:'把伞递过去', a:2, go:'A'},
      {l:'假装没看见，先走开', a:0, go:'B'},
      {l:'蹲下来，多看她一眼', a:1, go:'C'}
    ]},

    {lab:'A'},
    {s:'shock', n:'蓝发少女', t:'——诶？\n给、给我的吗？'},

    {s:'smile', n:'你', t:'我跑两步就到家了。你看起来更需要。'},
    {s:'wink', n:'蓝发少女', t:'那……那我记住你了。\n我叫大肥鱼。'},
    {s:'normal', n:'旁白', t:'她把伞举过头顶，像举起一面旗。'},
    {go:'store'},

    {lab:'B'},
    {s:'sad', n:'旁白', t:'你走出几步。身后的雨声里，传来一声很小的「对不起」。'},

    {s:'normal', n:'你', t:'（脚步停住。）'},

    {go:'store'},

    {lab:'C'},
    {s:'panic', n:'蓝发少女', t:'（被你盯着看，整只鱼都僵住了，尾巴尖在发抖。）'},

    {s:'shock', n:'蓝发少女', t:'……那你是想干嘛？'},
    {go:'store'},

    {lab:'store'},
    {bg:'store', s:'', n:'旁白', t:'便利店的自动门开了。\n暖气和关东煮的味道一起涌出来。'},
    {s:'normal', n:'你', t:'进来吧。先吃点热的，不然要感冒。'},

    {s:'think', n:'你', t:'（这问题有点难回答。）'},
    {s:'normal', n:'店员', t:'一共——\n（看了一眼她湿漉漉的鳍耳朵，把后半句咽了回去。）'},

    {c:[

    {s:'smile', n:'你', t:'慢点，没人跟你抢。'},
    {s:'shy', n:'大肥鱼', t:'人类真好。\n会给陌生的鱼买吃的。'},
    {go:'talk'},

    {lab:'E'},
    {s:'eat', n:'大肥鱼', t:'热、热的……\n从喉咙一直暖到尾巴尖。'},
    {s:'smile', n:'你', t:'萝卜要不要？'},

    {lab:'F'},
    {s:'normal', n:'你', t:'一杯热的，谢谢。'},

    {go:'close'},

    {s:'sad', n:'大肥鱼', t:'……你不问吗？'},

    {go:'close'},

    {go:'home'},

    {bg:'home', s:'', n:'旁白', t:'你家的客厅很小，暖气片嗡嗡响。'},

    {s:'normal', n:'你', t:'可以。'},
    {s:'sad', n:'大肥鱼', t:'可是我不会做饭，不会用洗衣机，\n连「欢迎回来」都说不好。'},
    {s:'smile', n:'你', t:'那就慢慢学。'},
    {s:'beg', n:'大肥鱼', t:'（她把脸埋进膝盖，声音闷闷的。）'},
    {s:'shy', n:'大肥鱼', t:'……那我留下了。'},
    {go:'dawn'},

    {lab:'R'},
    {s:'normal', n:'旁白', t:'你把外套披在她肩上。\n她没回头，只是把外套抓紧了一点。'},
    {s:'normal', n:'大肥鱼', t:'……暖的。'},
    {s:'sleep', n:'旁白', t:'过了很久，她的呼吸变慢了。\n你就坐在地板上，听着雨，一直到天边发白。'},
    {go:'dawn'},

    {lab:'dawn'},
    {bg:'dawn', s:'normal', n:'旁白', t:'雨停了。\n阳光从窗帘缝里挤进来，把地板照成浅浅的橘色。'},
    {s:'sleep', n:'旁白', t:'她靠在沙发上睡着了，尾巴卷成一个小小的圈。'},

    {c:[
      {l:'去做早饭', a:2, go:'T'},
      {l:'留张字条，先出门', a:0, go:'U'},
      {l:'轻轻叫醒她', a:1, go:'V'}
    ]},

    {lab:'T'},
    {s:'happy', n:'大肥鱼', t:'（被香味吵醒）\n……这是什么味道？'},
    {s:'smile', n:'你', t:'煎蛋。坐好，吃饭。'},
    {s:'eat', n:'大肥鱼', t:'我开动了——'},
    {s:'smile', n:'旁白', t:'她吃得比昨天认真多了。\n连盘子都想舔干净。'},
    {go:'final'},

    {lab:'U'},
    {s:'sad', n:'旁白', t:'你在便签上写：「冰箱里有牛奶，门锁记得反锁。」\n然后轻轻带上了门。'},
    {s:'normal', n:'旁白', t:'走到楼下，你回头看了一眼窗户。\n窗帘动了一下。'},
    {go:'final'},

    {lab:'V'},
    {s:'sleep', n:'你', t:'……喂，天亮了。'},
    {s:'panic', n:'大肥鱼', t:'唔哇——！\n我、我没睡过头吧？'},
    {s:'smile', n:'你', t:'没有。刚好。'},
    {s:'shy', n:'大肥鱼', t:'那就好……\n早上好。'},
    {go:'final'},

    {lab:'final'},
    {bg:'dawn', s:'normal', n:'旁白', t:'——然后，那一天还是来了。'},
    {s:'normal', n:'旁白', t:'傍晚，你下班回来。\n客厅的窗开着，风把窗帘吹得很高。'},
    {s:'sad', n:'旁白', t:'沙发上叠着那件 T 恤，叠得很整齐。\n旁边压着一把伞。'},
    {end:true}
  ];

  const ENDINGS = [
    { min:12, id:'true', title:'TRUE END · 留灯',
      stat:'好感度 %A · 从那天起，你家的门口总是亮着一盏灯。\n她说，那是给「想回来的人」看的。' },
    { min:8, id:'good', title:'GOOD END · 常客',
      stat:'好感度 %A · 一个月后，便利店多了一个新店员。\n她学会的第一句完整中文是「欢迎回来」。' },
    { min:4, id:'normal', title:'NORMAL END · 明天的便利店',
      stat:'好感度 %A · 第二天你还是照常去便利店。\n只是门口再没有那团蓝色的影子。' },
    { min:-999, id:'bad', title:'BAD END · 雨停之后',
      stat:'好感度 %A · 雨停了，人也就散了。\n你把那把伞放回柜子最里面，很久没有再拿出来。' }
  ];

  const el = id => document.getElementById(id);
  const bgEl = el('bg'), spriteEl = el('sprite'), spriteWrap = el('spriteWrap');
  const nameEl = el('name'), textEl = el('text'), hintEl = el('hint');
  const choicesEl = el('choices'), rainEl = el('rain');
  const affNum = el('affNum'), toastEl = el('toast');
  const titleEl = el('title'), endEl = el('ending');

  const SPRITES = {
    normal:'assets/normal.png', smile:'assets/smile.png', shy:'assets/shy.png',
    sad:'assets/sad.png', shock:'assets/shock.png', sleep:'assets/sleep.png',
    bowl:'assets/bowl.png', dead:'assets/dead.png', wave:'assets/wave.png',
    goodbye:'assets/goodbye.png', wink:'assets/wink.png', angry:'assets/angry.png',
    panic:'assets/panic.png', eat:'assets/eat.png', tired:'assets/tired.png',
    salute:'assets/salute.png', beg:'assets/beg.png', think:'assets/think.png',
    happy:'assets/happy.png', refuse:'assets/refuse.png'
  };

  const labels = {};
  S.forEach((n, i) => { if (n.lab) labels[n.lab] = i; });

  let idx = 0, aff = 0, typing = null, cursor = 0, full = '', ended = false, curSprite = '';

  function setBg(name){
    if (!name || bgEl.dataset.cur === name) return;
    bgEl.dataset.cur = name;
    bgEl.className = 'bg ' + name;
    rainEl.classList.toggle('off', name === 'home' || name === 'dawn');
  }

  function setSprite(key){
    if (key === undefined) return;
    if (key === ''){ spriteWrap.classList.add('hide'); curSprite = ''; return; }
    const src = SPRITES[key] || SPRITES.normal;
    if (curSprite !== src){ spriteEl.src = src; curSprite = src; }
    spriteWrap.classList.remove('hide');
  }

  function addAff(d){
    if (!d) return;
    aff += d;
    affNum.textContent = aff;
    toastEl.textContent = (d > 0 ? '好感度 +' + d : '好感度 ' + d);
    toastEl.classList.add('on');
    clearTimeout(addAff._t);
    addAff._t = setTimeout(() => toastEl.classList.remove('on'), 1400);
  }

  function typeText(str){
    full = str || ''; cursor = 0;
    textEl.textContent = '';
    clearInterval(typing);
    typing = setInterval(() => {
      cursor += 1;
      textEl.textContent = full.slice(0, cursor);
      if (cursor >= full.length){ clearInterval(typing); typing = null; }
    }, 24);
  }

  function skipTyping(){
    if (typing){ clearInterval(typing); typing = null; }
    textEl.textContent = full;
    cursor = full.length;
  }

  function showChoices(list){
    choicesEl.innerHTML = '';
    list.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.innerHTML = '<b>' + (i + 1) + '</b>' + c.l;
      b.addEventListener('click', ev => {
        ev.stopPropagation();
        choicesEl.classList.remove('on');
        addAff(c.a || 0);
        idx = labels[c.go] + 1;
        render();
      });
      choicesEl.appendChild(b);
    });
    choicesEl.classList.add('on');
    hintEl.style.visibility = 'hidden';
  }

  function showEnding(){
    ended = true;
    const pick = ENDINGS.find(e => aff >= e.min);
    el('endTitle').textContent = pick.title;
    el('endStat').textContent = pick.stat.replace('%A', aff);
    let got = [];
    try { got = JSON.parse(localStorage.getItem('dfy_endings') || '[]'); } catch(e){ got = []; }
    const isNew = got.indexOf(pick.id) === -1;
    if (isNew){
      got.push(pick.id);
      try { localStorage.setItem('dfy_endings', JSON.stringify(got)); } catch(e){}
    }
    el('endNew').textContent = isNew ? '✦ 新结局已解锁（' + got.length + '/4）' : '';
    endEl.classList.remove('hide');
  }

  function render(){
    if (idx >= S.length){ showEnding(); return; }
    const node = S[idx];
    if (node.lab){ idx++; return render(); }
    if (node.end){ showEnding(); return; }
    if (node.c){
      hintEl.style.visibility = 'hidden';
      showChoices(node.c);
      return;
    }
    hintEl.style.visibility = 'visible';
    choicesEl.classList.remove('on');
    setBg(node.bg);
    setSprite(node.s);
    nameEl.textContent = node.n || '旁白';
    nameEl.style.visibility = (node.n === '' ? 'hidden' : 'visible');
    typeText(node.t || '');
  }

  function advance(){
    if (ended) return;
    if (!savePanel.classList.contains('hide')) return;
    if (choicesEl.classList.contains('on')) return;
    if (typing || cursor < full.length){ skipTyping(); return; }
    idx += 1;
    render();
  }

  function startGame(){
    idx = labels['start']; aff = 0; ended = false; curSprite = '';
    affNum.textContent = '0';
    titleEl.classList.add('hide');
    endEl.classList.add('hide');
    spriteWrap.classList.add('hide');
    bgEl.dataset.cur = '';
    setBg('street');
    render();
  }

  el('startBtn').addEventListener('click', e => { e.stopPropagation(); startGame(); });
  el('againBtn').addEventListener('click', e => { e.stopPropagation(); startGame(); });
  el('stage').addEventListener('click', advance);
  document.addEventListener('keydown', e => {
    if (!titleEl.classList.contains('hide')){
      if (e.key === 'Enter' || e.key === ' ') startGame();
      return;
    }
    if (!endEl.classList.contains('hide')){
      if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') startGame();
      return;
    }
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advance(); return; }
    if (!savePanel.classList.contains('hide')){ if (e.key === 'Escape'){ savePanel.classList.add('hide'); } return; }
    if (e.key === 'r' || e.key === 'R'){ startGame(); return; }
    if (e.key === 'k'){ if (!ended) openSave('save'); return; }
    if (e.key === 'l'){ openSave('load'); return; }
    if (choicesEl.classList.contains('on')){
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 3){
        const b = choicesEl.querySelectorAll('.choice')[n - 1];
        if (b) b.click();
      }
    }
  });

  try {
    const got = JSON.parse(localStorage.getItem('dfy_endings') || '[]');
    const names = { true:'留灯', good:'常客', normal:'明天的便利店', bad:'雨停之后' };
    if (got.length){
      el('clearedBadge').innerHTML = '<span class="cleared">已解锁 ' + got.length + '/4：</span>'
        + got.map(g => names[g] || g).join('、');
    }
  } catch(e){}

  /* ---------- 存档 / 读档 ---------- */
  const SAVE_KEY = 'dfy_saves';
  const savePanel = el('savePanel'), slotsEl = el('saveSlots');
  let saveMode = 'save';

  function readSaves(){
    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch(e){ return {}; }
  }
  function writeSaves(o){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch(e){}
  }
  function openSave(mode){
    saveMode = mode;
    el('saveTitle').textContent = (mode === 'save' ? '存 档' : '读 档');
    const saves = readSaves();
    slotsEl.innerHTML = '';
    [1, 2, 3].forEach(function(n){
      const s = saves[n];
      const b = document.createElement('button');
      b.className = 'slot' + (s ? '' : ' empty');
      b.innerHTML = '<div><div>存档位 ' + n + (s ? '' : ' · 空') + '</div>'
        + '<div class="meta">' + (s ? (s.snip || '') : '还没有记录') + '</div></div>'
        + '<div class="t">' + (s ? (s.time || '') : '') + '</div>';
      b.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (saveMode === 'save') doSave(n); else doLoad(n);
      });
      slotsEl.appendChild(b);
    });
    savePanel.classList.remove('hide');
  }
  function doSave(n){
    const saves = readSaves();
    const node = S[idx] || {};
    saves[n] = {
      idx: idx, aff: aff,
      snip: String(node.t || '').replace(/\n/g, ' ').slice(0, 18),
      time: new Date().toLocaleString('zh-CN', { hour12: false }).slice(5)
    };
    writeSaves(saves);
    savePanel.classList.add('hide');
    el('saveTip').textContent = '';
  }
  function doLoad(n){
    const s = readSaves()[n];
    if (!s){
      el('saveTip').textContent = '这个存档位是空的';
      return;
    }
    idx = s.idx; aff = s.aff || 0; ended = false;
    affNum.textContent = aff;
    titleEl.classList.add('hide');
    endEl.classList.add('hide');
    choicesEl.classList.remove('on');
    bgEl.dataset.cur = '';
    spriteWrap.classList.add('hide');
    curSprite = '';
    savePanel.classList.add('hide');
    render();
  }

  savePanel.addEventListener('click', function(e){ e.stopPropagation(); });
  el('saveBtn').addEventListener('click', function(e){
    e.stopPropagation();
    if (ended || !titleEl.classList.contains('hide')) return;
    openSave('save');
  });
  el('loadBtn').addEventListener('click', function(e){
    e.stopPropagation();
    openSave('load');
  });
  el('saveClose').addEventListener('click', function(e){
    e.stopPropagation();
    savePanel.classList.add('hide');
  });

  window.__game = { get aff(){ return aff; }, get idx(){ return idx; }, start: startGame, advance };
})();
</script>
</body>
</html>
