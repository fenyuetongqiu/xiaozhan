  // ---------- 碰撞 & 场地 ----------
  function stepDrag(u, dt) {
    // 结束/断线时把这一趟真扣了多少记进调试字段（以前 dmg 永远是 0，看着像没伤害）
    if (lastHook && u.drag && u.drag.src) lastHook.dmg = Math.round(u.drag.dealt || 0);
    const g = u.drag;
    if (!g || !g.pts || !g.pts.length) { u.drag = null; return; }
    if (g.src && !g.src.alive) { u.drag = null; return; }   // 甩钩的人倒了：线断，别再扣血
    g.tm = (g.tm || 0) + dt;
    if (g.i >= g.pts.length) g.i = g.pts.length - 1;
    // 钩子是在墙线上弹回来的，记录的路径点经常正好压在墙线上（球半径够不到那里）→
    // 先把目标点夹进场地内，再允许一帧连吃好几个挨得很近的点；
    // 否则球会顶着墙原地抖、g.i 永远不推进，人卡在墙边血却一直掉（这就是「卡墙」）
    const AB = arenaBox();
    const rx0 = AB.x0 + u.r, rx1 = Math.max(rx0, AB.x1 - u.r);
    const ry0 = AB.y0 + u.r, ry1 = Math.max(ry0, AB.y1 - u.r);
    const step = g.sp * dt;
    let finished = false;
    for (let guard = 0; guard < 14 && g.i >= 0; guard++) {
      const raw = g.pts[g.i];
      const tx = clamp(raw.x, rx0, rx1), ty = clamp(raw.y, ry0, ry1);
      const dx = tx - u.x, dy = ty - u.y;
      const d = Math.hypot(dx, dy);
      if (d <= step + 3) {
        u.x = tx; u.y = ty;
        g.i--;
        if (g.i < 0) finished = true;
      } else {
        u.x += (dx / d) * step;
        u.y += (dy / d) * step;
        break;
      }
    }

    // 一小口一小口掉血：总数还是按距离算好的，只是排队慢慢扣，看得见 -1 -1
    const goal = finished ? g.total : g.total * Math.min(1, g.T > 0 ? g.tm / g.T : 1);
    while (u.alive && g.dealt < goal) {
      const per = Math.min(g.chunk, goal - g.dealt);
      applyDamage(u, per, g.src, true, true);   // 第 5 个参数：这是技能的伤害（记技能命中用）
      g.dealt += per;
      g.shown = (g.shown || 0) + per;
      if (g.shown >= 0.5) {
        const show = Math.round(g.shown * 2) / 2;
        g.shown -= show;
        addFloat(u.x + rand(-12, 12), u.y - u.r - 6, '-' + show, '#2e8b8b', .55, .72);
      }
      checkDeath(u);
    }

    if (finished || g.tm >= g.T + 0.05) {
      u.drag = null;
      u.stunT = Math.max(u.stunT, 0.3);
      trails.push({ pts: g.pts, t: 0, life: 0.9 });
      addParts(u.x, u.y, '#2e8b8b', 10);
      addFloat(u.x, u.y - u.r - 56, finished ? '拖完了' : '收线', '#2e8b8b', .8, .85);
    }
  }

  function applyShrink() {
    const b = arenaBox();
    for (const u of (units)) {
      if (!u || !u.alive) continue;
      u.x = clamp(u.x, b.x0 + u.r, Math.max(b.x0 + u.r, b.x1 - u.r));
      u.y = clamp(u.y, b.y0 + u.r, Math.max(b.y0 + u.r, b.y1 - u.r));
    }
  }

  function resolveCollision() {
    if (!A || !B || !A.alive || !B.alive) return;
    if (A.drag || B.drag) return;
    const d = dist(A, B);
    const minD = A.r + B.r + 6;
    if (d < minD && d > 0.001) {
      // 按质量分配推挤：越轻的球被挤得越远
      const mA = massOf(A), mB = massOf(B);
      const pushA = (minD - d) * (mB / (mA + mB));
      const pushB = (minD - d) * (mA / (mA + mB));
      const nx = (B.x - A.x) / d, ny = (B.y - A.y) / d;
      A.x -= nx * pushA; A.y -= ny * pushA;
      B.x += nx * pushB; B.y += ny * pushB;
      A.x = clamp(A.x, 60, W - 60); A.y = clamp(A.y, 130, H - 70);
      B.x = clamp(B.x, 60, W - 60); B.y = clamp(B.y, 130, H - 70);
    }
  }

  // 缩圈：20 秒后开始收，越收越快；躲不掉的时候自然就打起来了
  // 团队局（3v3 / 2v2）节奏更慢：缩圈晚、缩得慢、加时掉血推到 120 秒
  const teamMatch = () => teamBig();
  function arenaBox() {
    const start = teamMatch() ? 30 : 16;
    const dur = teamMatch() ? 72 : 36;
    const t = Math.max(0, Math.min(1, (battleTime - start) / dur));
    const padX = t * 330, padY = t * 250;
    return { x0: padX, x1: W - padX, y0: padY, y1: H - padY, t };
  }
  function stepArena(dt) {
    // 打太久就一起掉血，别无限磨（3v3 要到 120 秒）
    const bleedAt = teamMatch() ? 120 : 30;
    if (battleTime > bleedAt) {
      const ramp = Math.min(1, (battleTime - bleedAt) / 30);
      for (const u of units) {
        if (!u || !u.alive) continue;
        applyDamage(u, u.maxHp * (0.015 + ramp * 0.015) * dt, null, true);
        if (u.hp <= 0) { u.hp = 0; checkDeath(u); }
      }
    }
  }

  // ---------- 子弹 ----------
  function stepShots(dt) {
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      // 鱼钩残留：主人没了就把线一起收掉，别留一条孤儿线在场上
      if (s.kind === 'hookChain' && (!s.owner || !s.owner.alive)) { shots.splice(i, 1); continue; }
      const px0 = s.x, py0 = s.y;   // 上一帧位置：高速弹做扫过判定用
      s.t += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;

      // 药瓶：不看碰撞，飞够时间就地炸开（回血 / 中毒）
      if (s.light) { lightTick(s, dt); if (s.t >= s.life) shots.splice(i, 1); continue; }
      if (s.lamp) {
        if (s.t >= (s.flight || 0.3)) {
          lampLight(s.owner, s.tx, s.ty, s.rad, s.hold, 2.6, 3);
          addFloat(s.tx, s.ty - 24, '提灯', '#b8860b', .7, .9);
          shots.splice(i, 1);
        }
        continue;
      }
      if (s.parcel) {
      if (s.t >= s.flight) { s.x = s.tx; s.y = s.ty; s.vx = 0; s.vy = 0; }
      if (s.t >= s.flight + (s.fuse || 0.45)) { try { parcelBurst(s); } catch (e) { } shots.splice(i, 1); }
      continue;
    }
    if (s.potion) {
        if (s.t >= (s.flight || 0.3)) {
          try { potionBurst(s); } catch (e) {}
          shots.splice(i, 1);
        }
        continue;
      }

      // 箭雨的箭：撞墙弹一次（弹完 life 再给一点，够它飞第二段）
      if (s.ricochet > 0) {
        const AB = arenaBox();
    const wl = AB.x0, wr = AB.x1, wt = AB.y0, wb = AB.y1;
        let bd = false;
        if (s.x < wl && s.vx < 0) { s.x = wl; s.vx = -s.vx; bd = true; }
        if (s.x > wr && s.vx > 0) { s.x = wr; s.vx = -s.vx; bd = true; }
        if (s.y < wt && s.vy < 0) { s.y = wt; s.vy = -s.vy; bd = true; }
        if (s.y > wb && s.vy > 0) { s.y = wb; s.vy = -s.vy; bd = true; }
        if (bd) {
          s.ricochet--;
          s.life += 0.6;
          addParts(s.x, s.y, '#7a5c2f', 4);
          addRing(s.x, s.y, '#7a5c2f', 3, 12, .25);
        }
      }

      // 子弹贴近某个单位却没打中 —— 记一次「被躲开」（只在我打 AI 的局记）
      if (s.owner && aiRec(s.owner) && s.kind !== 'hookChain') {
        for (const du of units) {
          if (!du || !du.alive || du === s.owner || du.side === s.owner.side) continue;
          if (du.kind === 'melee') continue;   // 近战不参与躲弹率
          const dd2 = (s.x - du.x) * (s.x - du.x) + (s.y - du.y) * (s.y - du.y);
          const rr2 = (du.r + 26) * (du.r + 26);
          if (dd2 > rr2) continue;
          if (dd2 < du.r * du.r * 0.86) continue;
          s._nmSet = s._nmSet || new Set();
          if (!s._nmSet.has(du)) {
            s._nmSet.add(du);
            try {
              const rec2 = (AILEARN[du.key] = AILEARN[du.key] || {});
              // 以前这里错传了 rec2（记录对象，不是单位），aiRec 永远判不出来 → p1 局一次都没记过
              if (aiRec(du)) rec2._nearN = (rec2._nearN || 0) + 1;
            } catch (e) {}
          }
        }
      }

      if (s.kind === 'hookChain') {
        if (s.retract) {
          // 收线：顺着原来那条路径倒回去吃点，线一路变短，路上碰到人就算钩中
          const own = s.owner;
          if (!own || !own.alive) { shots.splice(i, 1); continue; }
          let remain = (s.retSp || 900) * dt;

            if (seg <= 0.001) { s.pts.pop(); s.x = prev.x; s.y = prev.y; continue; }

              remain -= seg;
              s.pts.pop();
              s.x = prev.x; s.y = prev.y;
            } else {
              const f = (seg - remain) / seg;   // 从 tail 往 prev 走 remain
              remain = 0;
              s.x = prev.x + (tail.x - prev.x) * f;

    const wallL = ABh.x0, wallR = ABh.x1, wallT = ABh.y0, wallB = ABh.y1;

      if (h.type === 'poison') {

          if (u.alive && Math.hypot(u.x - h.x, u.y - h.y) < h.r) {
            u.poisT = Math.max(u.poisT || 0, 0.5);
            if (Math.random() < dt * 3) addFloat(u.x + rand(-8, 8), u.y - u.r - 12, '毒', '#5b8a3a', .8, .8);
            applyDamage(u, 7 * dt, null, true);
          }
        }
      } else if (h.type === 'belt') {
        for (const u of (typeof units !== 'undefined' ? units : [])) {
          if (!u.alive) continue;
          if (Math.hypot(u.x - h.x, u.y - h.y) < h.r) { u.x += 96 * dt * (h.d || 1); }
        }
      } else if (h.type === 'bounce') {
        for (const sh of shots) {
          if (sh._bn) continue;
          if (Math.hypot(sh.x - h.x, sh.y - h.y) < h.r) {
            const dx = sh.x - h.x, dy = sh.y - h.y, ln = Math.hypot(dx, dy) || 1;
            const nx = dx / ln, ny = dy / ln;
            const dot = sh.vx * nx + sh.vy * ny;
            sh.vx -= 2 * dot * nx; sh.vy -= 2 * dot * ny;
            sh._bn = 1; sh.ric = (sh.ric || 0) + 1;
            addRing(h.x, h.y, '#7f8fa6', 8, 26, 0.25);
          }
        }
      } else if (h.type === 'portal') {
        h.cd = Math.max(0, (h.cd || 0) - dt);
        for (const u of (typeof units !== 'undefined' ? units : [])) {
          if (!u.alive || h.cd > 0 || u._tpT > 0) continue;
          if (Math.hypot(u.x - h.x, u.y - h.y) < h.r) {
            const other = hazards.find((o) => o.type === 'portal' && o !== h && o.pair !== h.pair);
            const o = hazards.filter((q) => q.type === 'portal' && q !== h)[0];
            if (o) {
              addRing(u.x, u.y, '#8f7bd8', 10, 40, 0.4);
              u.x = o.x + (u.x - h.x) * 0.4; u.y = o.y + (u.y - h.y) * 0.4;
              addRing(u.x, u.y, '#8f7bd8', 10, 40, 0.4);
              u._tpT = 0.8; h.cd = 0.7; o.cd = 0.7;
            }
          }
        }
      }
    }
    for (const u of (typeof units !== 'undefined' ? units : [])) if (u._tpT > 0) u._tpT -= dt;
    sayStep(dt);
    stateSayT += dt;
    if (stateSayT > 4.6) { stateSayT = 0; try { stateSay(); } catch (e) {} }
  }

  function drawHazards() {
    if (!hazards.length) return;
    ctx.save();
    for (const h of hazards) {
      const pw = 0.6 + Math.sin((h.t || 0) * 2.2) * 0.12;
      if (h.type === 'poison') {
        ctx.fillStyle = 'rgba(120,170,90,0.20)'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(120,170,90,0.55)'; ctx.lineWidth = 2; ctx.stroke();
        for (let i = 0; i < 5; i++) {
          const a = h.t * 0.9 + i * 1.26, rr = h.r * (0.25 + 0.18 * i);
          ctx.fillStyle = 'rgba(150,200,110,0.28)';
          ctx.beginPath(); ctx.arc(h.x + Math.cos(a) * rr, h.y + Math.sin(a) * rr, 5, 0, 6.2832); ctx.fill();
        }
      } else if (h.type === 'belt') {
        ctx.fillStyle = 'rgba(90,140,190,0.14)'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(90,140,190,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.stroke();
        ctx.strokeStyle = 'rgba(90,140,190,0.55)'; ctx.lineWidth = 3;
        for (let i = -2; i <= 2; i++) {
          const yy = h.y + i * 16, x0 = h.x - h.r * 0.7 * (h.d || 1), x1 = h.x + h.r * 0.7 * (h.d || 1);
          ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
        }
      } else if (h.type === 'bounce') {
        ctx.fillStyle = 'rgba(120,135,160,0.16)'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(110,125,150,0.75)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.stroke();
        ctx.strokeStyle = 'rgba(110,125,150,0.35)'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r - 7, h.t * 0.8, h.t * 0.8 + 2.2); ctx.stroke();
      } else if (h.type === 'portal') {
        ctx.strokeStyle = 'rgba(143,123,216,' + (0.55 + Math.sin(h.t * 3) * 0.15) + ')';
        ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.stroke();
        ctx.strokeStyle = 'rgba(143,123,216,0.3)'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(h.x, h.y, h.r - 6, -h.t * 1.6, -h.t * 1.6 + 2.6); ctx.stroke();
        ctx.fillStyle = 'rgba(143,123,216,0.10)'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r - 4, 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawWeather() {
    if (weather.type === 'clear') return;
    ctx.save();
    if (weather.type === 'rain') {
      ctx.strokeStyle = 'rgba(120,150,190,0.28)'; ctx.lineWidth = 1.2;
      for (let i = 0; i < 46; i++) {
        const x = (i * 137 + (t2ms() * 0.42) % W) % W;
        const y = (i * 211 + (t2ms() * 0.9) % H) % H;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 16); ctx.stroke();
      }
    } else if (weather.type === 'wind') {
      ctx.strokeStyle = 'rgba(150,170,200,0.22)'; ctx.lineWidth = 1.4;
      for (let i = 0; i < 16; i++) {
        const y = (i * 61 + (t2ms() * 0.5) % H) % H;
        const x = (t2ms() * 0.6 + i * 97) % (W + 200) - 100;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60, y - 3); ctx.stroke();
      }
    } else if (weather.type === 'storm') {
      const a = 0.04 + (weather.t > 3.0 ? 0.12 : 0);
      ctx.fillStyle = 'rgba(110,120,190,' + a + ')'; ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  const SAY_ON = false;   // 用户要求保持关闭；代码保留随时能开
function drawSay() {
    if (!SAY_ON) return;          // 解说开关
    if (!sayTxt) return;
    if (sayT <= 0) return;                                 // 淡完就收，不再留残影
    const fade = Math.min(1, sayT / SAY_FADE);
    ctx.save();
    ctx.globalAlpha = fade;
    const txt = sayTxt;
    ctx.font = '800 27px ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(txt).width;
    const padL = 62, padR = 26, h = 44;
    const w = tw + padL + padR;
    const x = W / 2 - w / 2, y = H - 22 - h;
    // 阴影
    ctx.shadowColor = 'rgba(40,60,90,0.22)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.97)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 22); else ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    // 左边一条彩色竖标 + 「解说」小标
    ctx.fillStyle = '#3f6fb0';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, 46, h, [22, 0, 0, 22]); else ctx.rect(x, y, 46, h);
    ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 15px ui-sans-serif, system-ui, "PingFang SC", sans-serif';
    ctx.fillText('解说', x + 23, y + h / 2 + 1);
    ctx.strokeStyle = 'rgba(95,120,150,0.35)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 22); else ctx.rect(x, y, w, h);
    ctx.stroke();
    // 正文
    ctx.font = '800 24px ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei"';
    ctx.fillStyle = '#28323d';
    ctx.textAlign = 'left';
    ctx.fillText(txt, x + padL, y + h / 2 + 1);
    ctx.restore();
  }

  function t2ms() { return (typeof performance !== 'undefined' ? performance.now() : Date.now()); }

  function step(dt) {
    updateHazards(dt);
    if (parts.length > 300) parts.splice(0, parts.length - 300);   // 粒子上限，防止越积越糊
    if (mode !== 'fight') {
      // 待机时小球轻微呼吸
    } else {
      battleTime += dt;
      bingSettleAll();
      for (const u of units) { if (u && u.alive) sampleHist(u, dt); }
      if (teamBig()) {
        for (const u of units) {
          if (!u || !u.alive) continue;
          const hell = DIFFS[diffKey] && DIFFS[diffKey].smart >= 0.95;
          const f = hell ? focusFoe(u) : nearestFoe(u);
          if (f) act(u, f, dt);
        }
        // 开局齐射：同队两门以上等离子技能全好时，同一帧一起轰血最少的那个
        if (battleTime > 0.8 && battleTime < 8) {
          for (const side of ['A', 'B']) {
            const beams = units.filter((o) => o && o.alive && o.side === side && o.key === 'plasma');
            if (beams.length < 2) continue;
            if (beams.some((b) => b.volleyDone)) continue;
            if (!beams.every((b) => b.specialT <= 0.02)) continue;
            const foes2 = units.filter((o) => o && o.alive && o.side !== side)
              .sort((x, y) => (x.hp / x.maxHp) - (y.hp / y.maxHp));
            const tgt = foes2[0];
            if (!tgt) continue;
            for (const b of beams) {
              b.specialT = specialCD(b);
              b.volleyDone = true;
              addParts(b.x, b.y, b.color, 6);
              special(b, tgt);
              // 三门强制瞄同一个点，让光束真的叠在一起
              b.aimAng = Math.atan2(tgt.y - b.y, tgt.x - b.x);
            }
            addFloat(tgt.x, tgt.y - tgt.r - 96, '交叉火力 · ' + beams.length + ' 门齐射', '#3f6ea8', 1.6, 1.15);
            shake = Math.max(shake, 4);
          }
        }
      } else {
        act(A, B, dt);
        act(B, A, dt);
        // 召唤物（怨灵）不占「人」的名额，但要自己走自己打
        for (const u of units) if (u && u.pet && u.alive) act(u, null, dt);
      }
      resolveCollision();
      stepShots(dt);
      stepMines(dt);
      applyShrink();
      stepArena(dt);
      stepDelayed(dt);
    }

    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t -= dt; f.y += f.vy * dt; f.vy *= 0.96;
      if (f.t <= 0) floats.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (!p.noG) p.vy += 520 * dt;
      if (p.t > p.life) parts.splice(i, 1);
    }
    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].t += dt;
      if (trails[i].t > trails[i].life) trails.splice(i, 1);
    }
    for (let i = crowns.length - 1; i >= 0; i--) {
      crowns[i].t += dt;
      if (crowns[i].t > crowns[i].life) crowns.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt; r.r = r.r + (r.r1 - r.r) * Math.min(1, dt * 6);
      if (r.t > r.life) rings.splice(i, 1);
    }
    for (let i = whales.length - 1; i >= 0; i--) {
      whales[i].t += dt;
      if (whales[i].t > whales[i].life) whales.splice(i, 1);
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
      bolts[i].t += dt;
      if (bolts[i].t > bolts[i].life) bolts.splice(i, 1);
    }
    for (let i = beams.length - 1; i >= 0; i--) {
      beams[i].t += dt;
      if (beams[i].t > beams[i].life) beams.splice(i, 1);
    }
    for (let i = swings.length - 1; i >= 0; i--) {
      swings[i].t += dt;
      if (swings[i].t > swings[i].life) swings.splice(i, 1);
    }
    // 石像鬼「岩甲」：每 6 秒自动补 18 点护盾（上限 36）
    if (mode === 'fight') for (const gu of units) {
      if (!gu || !gu.alive || gu.key !== 'gargoyle') continue;
      gu.armorT = (gu.armorT || 0) + dt;
      if (gu.armorT < 6) continue;
      gu.armorT = 0;
      if ((gu.shield || 0) < 36) {
        gu.shield = Math.min(36, (gu.shield || 0) + 18);
        addRing(gu.x, gu.y, '#8b939c', gu.r * .6, gu.r * 1.6, .45);
        addFloat(gu.x, gu.y - gu.r - 44, '岩甲 +18', '#5b5b66', .85, .95);
      }
    }
    for (const du of units) { if (du) du.flash = Math.max(0, (du.flash || 0) - dt); }
    if (A) A.flash = Math.max(0, A.flash - dt);
    if (B) B.flash = Math.max(0, B.flash - dt);
    for (const du of units) { if (du && !du.alive) du.deathT += dt; }
    // 羁绊表：同队凑齐谁就触发（每帧重算，死了自动失效）
    if (teamBig()) {
      for (const sd of ['A', 'B']) {
        const alive = units.filter((o) => o && o.alive && o.side === sd);
        const keys = alive.map((o) => o.key);
        const cnt = (k) => keys.filter((x) => x === k).length;
        const bonds = new Set();
        const boosts = { dmg: 1, spd: 1, cd: 1, tough: 1, regen: 1 };
        for (const [id, nm, ka, kb, kind, v] of BOND_DEFS) {
          const need = (ka === kb) ? keys.filter((x) => x === ka).length >= 2 : (keys.includes(ka) && keys.includes(kb));
          if (!need) continue;
          bonds.add(id);
          if (kind in boosts) boosts[kind] *= v;
        }
        const NAMES = { bond_witch: '怨灵成群', bond_pendulum: '同频共振', bond_post: '双邮并投', bond_life: '同生共死', bond_ice: '冰雷交加', bond_poison: '毒奶双煞', bond_shot: '师徒连射', bond_triple: '拳旋合击', bond_rail: '车轨同行', bond_blood: '血族同源', bond_sacrifice: '血祭', bond_chain: '赌命连锁', bond_volt: '雷引' };
        for (const o of alive) {
          const prev = o.bonds || new Set();
          if (bonds.size && !o.bondToast && battleTime > 0.6) {
            const fresh = [...bonds].filter((b) => !prev.has(b));
            if (fresh.length) {
              o.bondToast = true;
              addFloat(o.x, o.y - o.r - 84, '羁绊 · ' + NAMES[fresh[0]], '#7a3f9e', 1.5, 1.2);
            }
          }
          o.bonds = bonds;
          o.bDmg = boosts.dmg; o.bCd = boosts.cd; o.bTough = boosts.tough; o.bRegen = boosts.regen;
        }
      }
    }
    // 羁绊「同生共死」：同队 ≥2 个护盾系（钢盾/石像鬼）→ 血量百分比互相拉平，护盾合伙用
    if (teamBig()) {
      for (const sd of ['A', 'B']) {
        const tanks = units.filter((o) => o && o.alive && o.side === sd && (o.key === 'shield' || o.key === 'gargoyle'));
        if (tanks.length < 2) continue;
        const avg = tanks.reduce((a2, o) => a2 + o.hp / o.maxHp, 0) / tanks.length;
        const pool = tanks.reduce((a2, o) => a2 + (o.shield || 0), 0);
        const capSum = tanks.reduce((a2, o) => a2 + (o.shieldMax || 0), 0) || 1;
        for (const o of tanks) {
          const want = avg * o.maxHp;
          o.hp += (want - o.hp) * Math.min(1, dt * 1.8);
          const share = pool * ((o.shieldMax || 0) / capSum);
          o.shield = Math.min(o.shieldMax || share, share);
        }
        if (!u_bondShown[sd] && battleTime > 1.2) {
          u_bondShown[sd] = true;
          const t0 = tanks[0];
          addFloat(t0.x, t0.y - t0.r - 74, '羁绊 · 同生共死', '#b3261e', 1.6, 1.25);
        }
      }
    }
    shake *= Math.pow(0.008, dt);   // 衰减更快一点，震一下就停
    punch *= Math.pow(0.008, dt);
    flashA *= Math.pow(0.02, dt);
  }

  function draw() {
    ctx.save();
    // 镜头顶一下：大伤害/击杀瞬间整体放大几个百分点再弹回去
    if (punch > 0.01) {
      const z = 1 + punch * 0.032;
      ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
    }
    const sk = shake * SHAKE_K;
    if (sk > 0.26) ctx.translate(rand(-sk * 0.55, sk * 0.55), rand(-sk * 0.55, sk * 0.55));

    // 场地：中间微微亮、四角压暗一点，白屏看着眼睛不累（同一尺寸只建一次渐变）
    const ak = W + ',' + H;
    if (ak !== arenaGradKey) {
      arenaGradKey = ak;
      arenaGrad = ctx.createRadialGradient(W / 2, H * 0.42, 30, W / 2, H * 0.5, Math.max(W, H) * 0.82);
      arenaGrad.addColorStop(0, '#eef2f6');
      arenaGrad.addColorStop(1, '#dbe2ea');
    }
    ctx.fillStyle = arenaGrad;
    ctx.fillRect(0, 0, W, H);

    // 场地边界线：墙在哪儿就画在哪儿，缩圈时整条边界跟着往中间收
    {
      const bx = arenaBox();
      ctx.save();
      ctx.strokeStyle = `rgba(70,95,125,${0.16 + bx.t * 0.5})`;
      ctx.lineWidth = 2 + bx.t * 4;
      ctx.setLineDash(bx.t > 0.01 ? [14, 10] : []);
      ctx.strokeRect(bx.x0, bx.y0, bx.x1 - bx.x0, bx.y1 - bx.y0);
      ctx.restore();
    }

    // 缩圈预告：还有几秒开始收 / 正在收
    if (mode === 'fight') {
      const startAt = teamBig() ? 30 : 16;
      const left = startAt - battleTime;
      const bx3 = arenaBox();
      const txt = left > 0.5 ? ('缩圈还有 ' + Math.ceil(left) + ' 秒')
        : (bx3.t >= 0.999 ? '缩圈到底' : '缩圈中 · 场地只剩 ' + Math.round((1 - bx3.t) * 100) + '%');
      ctx.save();
      ctx.font = '700 15px "Noto Sans SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const w3 = ctx.measureText(txt).width + 28;
      ctx.fillStyle = left > 0.5 ? 'rgba(255,255,255,.9)' : 'rgba(255,214,150,.94)';
      roundRect(W / 2 - w3 / 2, 12, w3, 30, 9);
      ctx.fill();
      ctx.strokeStyle = left > 0.5 ? 'rgba(70,95,125,.18)' : 'rgba(180,120,20,.35)';
      ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = left > 0.5 ? '#43505e' : '#7a4b00';
      ctx.fillText(txt, W / 2, 28);
      ctx.restore();
    }

    // 淡点阵
    ctx.fillStyle = 'rgba(60,80,100,.075)';
    for (let x = 40; x < W; x += 48) for (let y = 90; y < H; y += 48) ctx.fillRect(x, y, 2, 2);

    // 光环
    for (const r of rings) {
      const k = 1 - r.t / r.life;
      if (r.wave) {
        // 水波：压扁的椭圆 + 边缘正弦起伏
        ctx.strokeStyle = hexA(r.color, .55 * k);
        ctx.lineWidth = 2.6 * k + 1;
        ctx.beginPath();
        const N = 30;
        for (let i = 0; i <= N; i++) {
          const a = (i / N) * Math.PI * 2;
          const rr = r.r * (1 + Math.sin(a * 4 + r.t * 9) * 0.055);
          const px = r.x + Math.cos(a) * rr;
          const py = r.y + Math.sin(a) * rr * 0.72;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        continue;
      }
      ctx.strokeStyle = hexA(r.color, .45 * k);
      ctx.lineWidth = 3 * k + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
    }
    // 过载蓄力时的瞄准虚线：方向是按下那一刻锁死的，所以能躲
    for (const uu of units) {
      if (!uu || !uu.alive || !(uu.chargeUntil > battleTime)) continue;
      const ang = uu.aimAng || 0;
      ctx.save();
      ctx.globalAlpha = 0.30 + Math.abs(Math.sin(battleTime * 26)) * 0.18;
      ctx.strokeStyle = '#2f7fd6';
      ctx.lineWidth = 3;
      ctx.setLineDash([13, 11]);
      ctx.beginPath();
      ctx.moveTo(uu.x, uu.y);
      ctx.lineTo(uu.x + Math.cos(ang) * 1600, uu.y + Math.sin(ang) * 1600);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    // 鲸落：头朝下扎进水里，不是砸扁
    for (const w of whales) {
      const p = w.t / w.life;
      const fall = Math.min(1, p / 0.58);
      const sink = Math.max(0, p - 0.58) / 0.42;
      const drop = Math.pow(1 - fall, 1.5) * 320 + sink * 120;
      const sc = 0.6 + fall * 0.5 - sink * 0.18;
      const al = p < 0.62 ? 1 : Math.max(0, 1 - (p - 0.62) / 0.38);
      ctx.save();
      ctx.globalAlpha = al;
      ctx.translate(w.x, w.y - drop);
      ctx.rotate(-0.78 + Math.sin(p * 7) * 0.05);
      ctx.scale(sc, sc);
      // 下落速度线
      ctx.globalAlpha = al * 0.28;
      ctx.fillStyle = '#9fcdf0';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(-38 + i * 26, -84 - i * 26, 4 - i * 0.5, 30 - i * 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = al;
      if (whaleImg.complete && whaleImg.naturalWidth) {
        const ww = 176;
        const hh = ww * (whaleImg.naturalHeight / whaleImg.naturalWidth);
        ctx.shadowColor = 'rgba(31,79,134,.22)';
        ctx.shadowBlur = 16;
        ctx.drawImage(whaleImg, -ww / 2, -hh / 2, ww, hh);
        ctx.shadowBlur = 0;
      }
      ctx.restore();
      // 入水后被水面盖住的那一层
      if (p > 0.58) {
        const q = Math.min(1, (p - 0.58) / 0.42);
        ctx.save();
        ctx.globalAlpha = 0.5 + q * 0.3;
        ctx.fillStyle = 'rgba(150,208,242,.55)';
        ctx.beginPath();
        ctx.ellipse(w.x, w.y + 6, 120 + q * 26, 44 + q * 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.85 * (1 - q);
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.lineWidth = 5 * (1 - q) + 1;
        ctx.beginPath();
        ctx.ellipse(w.x, w.y + 6, 120 + q * 30, 44 + q * 12, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
    // 落水的水花冠：一圈往上溅开的水柱
    for (const c of crowns) {
      const p = c.t / c.life;
      const a = Math.max(0, 1 - p);
      if (a <= 0) continue;
      const R = 26 + p * 96;
      const h = 54 * (1 - p) + 16;
      ctx.save();
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = c.color;
      ctx.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        const ang = -Math.PI / 2 + (i - 3) * 0.36;
        const x0 = c.x + Math.cos(ang) * (R * 0.5);
        const y0 = c.y + 12 + Math.sin(ang) * 8;
        const x1 = c.x + Math.cos(ang) * (R * 0.5 + 10);
        const y1 = y0 - h * (0.6 + 0.4 * Math.cos((i - 3) * 0.5));
        ctx.lineWidth = 6 - p * 3;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(x0 + (x1 - x0) * 0.3, y0 - h * 0.75, x1, y1);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 等离子光束：外层蓝雾 + 中层亮蓝 + 白色光芯，头尾各炸一团
    for (const bm of beams) {
      const k = 1 - bm.t / bm.life;
      const grow = 1 + (1 - k) * 0.5;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(bm.x2, bm.y2);
      ctx.strokeStyle = hexA('#2f7fd6', .28 * k); ctx.lineWidth = bm.w * 2.1 * grow; ctx.stroke();
      ctx.strokeStyle = hexA(bm.color, .75 * k); ctx.lineWidth = bm.w * grow; ctx.stroke();
      ctx.strokeStyle = 'rgba(234,250,255,' + (.95 * k) + ')'; ctx.lineWidth = bm.w * 0.34; ctx.stroke();
      // 枪口那头的爆点
      const gr = ctx.createRadialGradient(bm.x, bm.y, 0, bm.x, bm.y, bm.w * 1.6);
      gr.addColorStop(0, 'rgba(255,255,255,' + (.9 * k) + ')');
      gr.addColorStop(.45, hexA('#6fd0ff', .6 * k));
      gr.addColorStop(1, 'rgba(47,127,214,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(bm.x, bm.y, bm.w * 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 闪电：先画一层宽的外发光，再盖一条白芯
    for (const bl of bolts) {
      const k = 1 - bl.t / bl.life;
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      bl.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.strokeStyle = hexA(bl.color, .55 * k); ctx.lineWidth = 9 * k + 2; ctx.stroke();
      ctx.strokeStyle = hexA(bl.color, .95 * k); ctx.lineWidth = 3.4 * k + 1; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (.85 * k) + ')'; ctx.lineWidth = 1.5 * k + .5; ctx.stroke();
      ctx.restore();
    }

    // 地雷
    for (const m of mines) {
      const armed = m.arm <= 0;
      const blink = armed && m.life < 2 && Math.sin(now() * 18) > 0;
      ctx.save();
      ctx.globalAlpha = armed ? (blink ? .35 : .95) : .45;
      ctx.fillStyle = '#5f7a3a';
      ctx.beginPath(); ctx.arc(m.x, m.y, armed ? m.r : m.r * .7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(40,50,25,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#eef2f5';
      ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 鱼钩飞的轨迹
    for (const s of shots) {
      if (s.kind !== 'hookChain' || !s.pts || s.pts.length < 2) continue;
      ctx.save();
      ctx.strokeStyle = 'rgba(46,139,139,.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let k = 1; k < s.pts.length; k++) ctx.lineTo(s.pts[k].x, s.pts[k].y);
      ctx.stroke();
      ctx.restore();
    }

    // 拖行留下的残影路径
    for (const tr of trails) {
      const k = 1 - tr.t / tr.life;
      if (!tr.pts || tr.pts.length < 2) continue;
      ctx.save();
      ctx.strokeStyle = 'rgba(46,139,139,' + (0.5 * k) + ')';
      ctx.lineWidth = 3 * k + 1;
      ctx.setLineDash([7, 7]);
      ctx.beginPath();
      ctx.moveTo(tr.pts[0].x, tr.pts[0].y);
      for (let q = 1; q < tr.pts.length; q++) ctx.lineTo(tr.pts[q].x, tr.pts[q].y);
      ctx.stroke();
      ctx.restore();
    }

    // 被拖行：把整条路径 + 绳子画出来
    for (const u of units) {
      if (!u || !u.drag || !u.drag.pts || !u.drag.pts.length) continue;
      const g = u.drag;
      ctx.save();
      ctx.strokeStyle = 'rgba(46,139,139,.7)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      const lastP = Math.max(0, Math.min(g.i, g.pts.length - 1));
      ctx.beginPath();
      ctx.moveTo(g.pts[lastP].x, g.pts[lastP].y);
      for (let k = lastP - 1; k >= 0; k--) ctx.lineTo(g.pts[k].x, g.pts[k].y);
      ctx.stroke();
      ctx.setLineDash([]);
      const hp2 = g.pts[Math.max(0, Math.min(g.i, g.pts.length - 1))];
      ctx.strokeStyle = '#2e8b8b';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(hp2.x, hp2.y); ctx.lineTo(u.x, u.y); ctx.stroke();
      ctx.fillStyle = '#2e8b8b';
      ctx.beginPath(); ctx.arc(hp2.x, hp2.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 子弹
    // 子弹：每个角色一个形状，全是直线飞（不追踪，能躲）
    for (const s of shots) {
      const ang = s.ang != null ? s.ang : Math.atan2(s.vy, s.vx);
      const st = s.style || s.kind;
      ctx.save();
      ctx.translate(s.x, s.y);
      if (st === 'hookChain') {
        ctx.fillStyle = '#2e8b8b';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#f4f7fa'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.rotate(ang);
        // 拖影：贴着飞行方向的残影，速度感来自这里
        if (st !== 'pill' && st !== 'rock') {
          const sp2 = Math.hypot(s.vx || 0, s.vy || 0) || 200;
          const len2 = Math.min(34, sp2 * 0.045);
          const g2 = ctx.createLinearGradient(-len2, 0, 2, 0);
          g2.addColorStop(0, 'rgba(60,70,80,0)');
          g2.addColorStop(1, 'rgba(60,70,80,.28)');
          ctx.strokeStyle = g2; ctx.lineWidth = 3.2;
          ctx.beginPath(); ctx.moveTo(-len2, 0); ctx.lineTo(2, 0); ctx.stroke();
        }
        switch (st) {
          case 'spear': {
            ctx.fillStyle = '#2e8b8b';
            ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(3, 3.5); ctx.lineTo(-10, 1.6); ctx.lineTo(-10, -1.6); ctx.lineTo(3, -3.5); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#f4f7fa'; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(4, 0); ctx.stroke();
            break;
          }
          case 'shard': {
            ctx.fillStyle = '#bfe9ff';
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, 4.5); ctx.lineTo(-3, 0); ctx.lineTo(-6, -4.5); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#3b6ea5';
            ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, 3); ctx.lineTo(-4, -3); ctx.closePath(); ctx.fill();
            break;
          }
          case 'sting': {
            ctx.strokeStyle = 'rgba(201,178,90,.7)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(5, 0); ctx.stroke();
            ctx.fillStyle = '#b3801f';
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(0, 3); ctx.lineTo(0, -3); ctx.closePath(); ctx.fill();
            break;
          }
          case 'beam': {
            // 等离子射线：一条发光的蓝杠 + 前端白点，后面拖着长残影
            const g = ctx.createLinearGradient(-26, 0, 16, 0);
            g.addColorStop(0, 'rgba(47,127,214,0)');
            g.addColorStop(0.5, 'rgba(111,208,255,.8)');
            g.addColorStop(1, '#eafaff');
            ctx.strokeStyle = 'rgba(47,127,214,.35)'; ctx.lineWidth = 10; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(10, 0); ctx.stroke();
            ctx.strokeStyle = g; ctx.lineWidth = 4.4;
            ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(13, 0); ctx.stroke();
            ctx.strokeStyle = 'rgba(234,250,255,.95)'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(12, 0); ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(13, 0, 3.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(111,208,255,.8)';
            ctx.beginPath(); ctx.arc(13, 0, 6.4, 0, Math.PI * 2); ctx.fill();
            break;
          }
          case 'arrow': {
            ctx.strokeStyle = '#7a5c2f'; ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(8, 0); ctx.stroke();
            ctx.fillStyle = '#7a5c2f';
            ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(6, 4); ctx.lineTo(6, -4); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#a3834a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-16, -4); ctx.moveTo(-12, 0); ctx.lineTo(-16, 4); ctx.stroke();
            break;
          }
          case 'wave': {
            const wob = Math.sin(s.t * 26) * 1.6;
            ctx.fillStyle = 'rgba(47,111,176,.28)';
            ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#5aa9e6';
            ctx.beginPath(); ctx.ellipse(0, wob, 11, 7, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#eaf6ff';
            ctx.beginPath(); ctx.arc(-3, -2 + wob, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(191,233,255,.6)';
            ctx.beginPath(); ctx.arc(7, wob * .5, 2.2, 0, Math.PI * 2); ctx.fill();
            break;
          }
          case 'train': {
            // 一节小车厢：圆角车身 + 两个车窗 + 车头灯
            const tw = 26, th = 14;
            ctx.save();
            ctx.translate(-6, 0);
            ctx.fillStyle = 'rgba(74,111,156,.25)';
            ctx.beginPath(); ctx.ellipse(0, 0, tw * .72, th, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e9eff7';
            ctx.strokeStyle = '#4a6f9c'; ctx.lineWidth = 2;
            ctx.beginPath();
            if (ctx.roundRect) { ctx.roundRect(-tw / 2, -th / 2, tw, th, 4); } else { ctx.rect(-tw / 2, -th / 2, tw, th); }
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#4a6f9c';
            ctx.fillRect(-tw / 2 + 4, -th / 2 + 3, 6, 5);
            ctx.fillRect(-tw / 2 + 13, -th / 2 + 3, 6, 5);
            ctx.fillStyle = '#ffd479';
            ctx.beginPath(); ctx.arc(tw / 2 - 1, 0, 2.6, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            break;
          }
          case 'pill': {
            const wb = Math.sin(s.t * 22) * 2.2;
            ctx.fillStyle = '#6aa06a';
            ctx.beginPath(); ctx.arc(0, wb, 6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#e8f3e8'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.moveTo(-4, wb); ctx.lineTo(4, wb); ctx.stroke();
            break;
          }
          case 'orb': {
            const gl = 6 + Math.sin(s.t * 30) * 1.2;
            ctx.fillStyle = 'rgba(168,150,255,.35)';
            ctx.beginPath(); ctx.arc(0, 0, gl + 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#b7a6ff';
            ctx.beginPath(); ctx.arc(0, 0, gl, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(239,233,255,.9)'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-13, -4); ctx.lineTo(-9, 3); ctx.lineTo(-4, -2); ctx.stroke();
            break;
          }
          case 'rock': {
            ctx.rotate(s.t * 6);
            ctx.fillStyle = '#5c6068';
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a2 = (i / 6) * Math.PI * 2, rad = i % 2 ? 5 : 7.5;
              ctx.lineTo(Math.cos(a2) * rad, Math.sin(a2) * rad);
            }
            ctx.closePath(); ctx.fill();
            break;
          }
          case 'dice': {
            ctx.rotate(s.t * 9);
            ctx.fillStyle = '#f4efe6';
            ctx.strokeStyle = '#a8442f'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.rect(-7, -7, 14, 14); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#a8442f';
            for (const pp of [[-3, -3], [3, 3]]) { ctx.beginPath(); ctx.arc(pp[0], pp[1], 1.8, 0, Math.PI * 2); ctx.fill(); }
            break;
          }
          case 'caltrop': {
            ctx.rotate(s.t * 7);
            ctx.fillStyle = '#5f7a3a';
            for (let i = 0; i < 4; i++) {
              ctx.rotate(Math.PI / 2);
              ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(3, -1); ctx.lineTo(-3, -1); ctx.closePath(); ctx.fill();
            }
            break;
          }
          case 'gear': {
            ctx.rotate(s.t * 8);
            ctx.strokeStyle = '#4a5f9f'; ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.stroke();
            for (let i = 0; i < 6; i++) {
              const a3 = (i / 6) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a3) * 6, Math.sin(a3) * 6);
              ctx.lineTo(Math.cos(a3) * 9.5, Math.sin(a3) * 9.5);
              ctx.stroke();
            }
            break;
          }
          case 'blade': {
            ctx.strokeStyle = 'rgba(194,85,47,.45)'; ctx.lineWidth = 7;
            ctx.beginPath(); ctx.arc(-2, 0, 8, -1.1, 1.1); ctx.stroke();
            ctx.strokeStyle = '#e08a5f'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(-2, 0, 8, -1.1, 1.1); ctx.stroke();
            break;
          }
          case 'punch': {
            ctx.fillStyle = '#2f4f8f';
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
            break;
          }
          case 'ram': {
            ctx.fillStyle = '#5b5b66';
            ctx.fillRect(-7, -7, 14, 14);
            ctx.strokeStyle = '#cfd6dd'; ctx.lineWidth = 2;
            ctx.strokeRect(-4, -4, 8, 8);
            break;
          }
          default: {
            ctx.fillStyle = '#3c4650';
            ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      ctx.restore();
    }

    // 近战挥击：每种武器扫出来的弧不一样
    for (const w of swings) {
      const k = 1 - w.t / w.life;
      const spread = w.style === 'punch' ? .5 : w.style === 'ram' ? .75 : 1.0;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = hexA(w.color, .8 * k);
      ctx.lineWidth = 3 + 6 * k;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r + 12, w.ang - spread, w.ang + spread);
      ctx.stroke();
      if (w.style === 'claw') {
        ctx.lineWidth = 2 + 3 * k;
        for (const off of [-.3, 0, .3]) {
          ctx.beginPath();
          ctx.arc(w.x, w.y, w.r + 6, w.ang + off - .14, w.ang + off + .14);
          ctx.stroke();
        }
      }
      if (w.style === 'blade') {
        ctx.strokeStyle = hexA('#e08a5f', .7 * k);
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r + 2, w.ang - spread * .6, w.ang + spread * .6);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 时间残影（回溯者留在地上的残像，踩到会吃伤害）
    for (const g of ghosts) {
      const k = 1 - g.t / g.life;
      ctx.save();
      ctx.globalAlpha = 0.14 + 0.2 * k;
      ctx.fillStyle = g.owner.color || '#4a5f9f';
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.35 + 0.45 * k;
      ctx.strokeStyle = g.owner.color || '#4a5f9f';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r + 3, 0, Math.PI * 2); ctx.stroke();
      // 转动的表针
      ctx.beginPath(); ctx.moveTo(g.x, g.y);
      ctx.lineTo(g.x + Math.cos(-g.t * 2.4) * g.r * .7, g.y + Math.sin(-g.t * 2.4) * g.r * .7);
      ctx.stroke();
      ctx.restore();
    }

    // 团队羁绊：队友之间拉一条淡虚线 + 羁绊名（蜂群／双钩／交叉火力…）
    if (teamBig()) {
      const SYN_COL = { bee: '#8bb13a', hook: '#2e8b8b', plasma: '#4d7fbf', ice: '#6fa8c8', shield: '#b08442', herb: '#5f9e5f', thunder: '#7a5fc0' };
      ctx.save();
      for (let i = 0; i < units.length; i++) {
        for (let j = i + 1; j < units.length; j++) {
          const a1 = units[i], b1 = units[j];
          if (!a1 || !b1 || !a1.alive || !b1.alive || a1.side !== b1.side) continue;
          const dd = Math.hypot(a1.x - b1.x, a1.y - b1.y);
          if (dd > 520) continue;
          const nm = synergyName(a1, b1);
          if (!nm) continue;
          const kd = bondKind(a1, b1);
          const col = kd === 'dmg' ? '#c0553f' : kd === 'cd' ? '#3f6fb0' : kd === 'tough' ? '#7b6a9e' : '#3f8f5a';
          ctx.globalAlpha = Math.max(0.38, 0.78 - dd / 1500);
          ctx.strokeStyle = col;
          ctx.lineWidth = 2.2;
          ctx.setLineDash([7, 6]);
          ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(b1.x, b1.y); ctx.stroke();
          ctx.setLineDash([]);
          const mx2 = (a1.x + b1.x) / 2, my2 = (a1.y + b1.y) / 2;
          ctx.globalAlpha = 0.95;
          ctx.font = '700 12px system-ui,sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = col;
          ctx.fillText(nm, mx2, my2 - 10);
          // 羁绊名：跟上面那行同一个字号、同一个透明度，紧贴下面
          const BK = { 'ice+thunder': '冰雷交加', 'bee+herb': '毒奶双煞', 'ranger+trapper': '师徒连射',
            'boxer+spinner': '拳旋合击', 'tele+train': '车轨同行', 'vamp+vamp': '血族同源',
            'herb+vamp': '血祭', 'shield+thunder': '雷引', 'gargoyle+thunder': '雷引',
            'gargoyle+shield': '同生共死', 'shield+shield': '同生共死', 'gargoyle+gargoyle': '同生共死' };
          const bnm = BK[[a1.key, b1.key].sort().join('+')];
          if (bnm) {

          const a = base + (i / n) * Math.PI * 2;
          ctx.save(); ctx.rotate(a); ctx.translate(0, -(r + 6));
          ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(2.6, 1); ctx.lineTo(-2.6, 1); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        break;
      }
      case 'chrono': {                                 // 表盘刻度 + 指针
        ctx.strokeStyle = hexA('#4a6d8c', .7); ctx.lineWidth = 2;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const r0 = r + 5, r1 = r + (i % 3 === 0 ? 11 : 8);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
          ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
          ctx.stroke();
        }
        ctx.strokeStyle = hexA('#c9932f', .9); ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(t * .9) * (r + 7), Math.sin(t * .9) * (r + 7)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(t * 3.2) * (r + 9), Math.sin(t * 3.2) * (r + 9)); ctx.stroke();
        break;
      }
      case 'plasma': {                                 // 环形电场 + 环绕的蓝电弧
        for (let i = 0; i < 3; i++) {
          const a0 = t * (1.2 + i * 0.5);
          ctx.strokeStyle = hexA(i === 1 ? '#bfe9ff' : '#2f7fd6', .75);
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(0, 0, r + 7 + i * 4, a0, a0 + 1.5);
          ctx.stroke();
        }
        for (let i = 0; i < 5; i++) {
          const a = t * 2.4 + i * (Math.PI * 2 / 5);
          const rr = r + 12 + Math.sin(t * 6 + i) * 3;
          ctx.fillStyle = hexA('#6fd0ff', .85);
          ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.9, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
    }
    ctx.restore();
  }

  function drawUnit(u) {
    if (!u.alive && u.deathT > 0.8) return;
    let r = u.r * (u.alive ? 1 : 1 + Math.min(1, u.deathT / 0.8) * 0.45);
    if (u.alive && mode === 'over') r *= 1 + 0.04 * Math.sin(now() * 5);
    ctx.save();
    if (!u.alive) ctx.globalAlpha = Math.max(0, 1 - u.deathT / 0.8);
    else if (u.mistT > 0) ctx.globalAlpha = 0.35;

    // 影子
    ctx.fillStyle = 'rgba(30,40,50,.12)';
    ctx.beginPath(); ctx.ellipse(u.x, u.y + r * 0.92, r * 0.78, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();

    // 等离子「过载」蓄力：枪口聚能，圈越收越紧、越收越亮
    if (u.key === 'plasma' && u.chargeUntil && battleTime < u.chargeUntil) {
      const p = 1 - (u.chargeUntil - battleTime) / 0.5;
      ctx.save();
      ctx.translate(u.x, u.y);
      const rr = r + 30 - p * 20;
      // 外圈脉动光晕
      const gl = ctx.createRadialGradient(0, 0, rr * .4, 0, 0, rr + 16);
      gl.addColorStop(0, 'rgba(47,127,214,0)');
      gl.addColorStop(.7, hexA('#6fd0ff', .28 + p * .3));
      gl.addColorStop(1, 'rgba(47,127,214,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(0, 0, rr + 16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = hexA('#bfe9ff', .45 + p * .55);
      ctx.lineWidth = 2 + p * 3.5;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = hexA('#ffffff', .5 + p * .5);
      ctx.lineWidth = 1 + p * 2;
      ctx.beginPath(); ctx.arc(0, 0, rr - 5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = hexA('#2f7fd6', .5 + p * .4);
      ctx.lineWidth = 5 + p * 4;
      ctx.beginPath(); ctx.arc(0, 0, rr - 7, -1.2 + p * 2, 0.6 + p * 2); ctx.stroke();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + battleTime * 6;
        const dd = rr + 6;
        ctx.fillStyle = hexA(i % 2 ? '#eafaff' : '#6fd0ff', .85);
        ctx.beginPath(); ctx.arc(Math.cos(a) * dd, Math.sin(a) * dd, 2 + p * 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // 本体（渐变按「半径+颜色」缓存，避免每帧新建对象——这是之前卡顿的大头）
    const gk = r + u.color;
    let g = bodyGradCache[gk];
    if (!g) {
      g = ctx.createRadialGradient(-r * .35, -r * .42, r * .12, 0, 0, r * 1.05);
      g.addColorStop(0, lighten(u.color, .28));
      g.addColorStop(1, u.color);
      bodyGradCache[gk] = g;
    }
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (u.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.82, u.flash * 3) + ')';
      ctx.beginPath(); ctx.arc(u.x, u.y, r, 0, Math.PI * 2); ctx.fill();
    }

    // 每个球自己的那圈身份装饰
    drawIdentity(u, r);

    // 血条环
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.arc(u.x, u.y, r - 3, 0, Math.PI * 2); ctx.stroke();
    // 盾环：有上限的按上限画满；吸血鬼那种不封顶的，环随盾量往上长（60 点为满圈基准）
    if (u.shieldMax > 0 || (u.shield || 0) > 0) {
      const sCap = u.shieldMax > 0 ? u.shieldMax : Math.max(60, (u.shield || 0) * 1.05);
      const sRatio = clamp((u.shield || 0) / sCap, 0, 1);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(120,132,146,.35)';
      ctx.beginPath(); ctx.arc(u.x, u.y, r + 4, 0, Math.PI * 2); ctx.stroke();
      if (sRatio > 0) {
        ctx.strokeStyle = 'rgba(150,163,178,.95)';
        ctx.beginPath(); ctx.arc(u.x, u.y, r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sRatio); ctx.stroke();
      }
    }
    const ratio = clamp(u.hp / u.maxHp, 0, 1);
    ctx.strokeStyle = ratio > .45 ? 'rgba(255,255,255,.95)' : 'rgba(255,220,120,.95)';
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(u.x, u.y, r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio); ctx.stroke();
    ctx.lineCap = 'butt';

    if (!u.alive) { ctx.restore(); return; }

    // 数字
    ctx.fillStyle = '#fff';
    ctx.font = '800 ' + Math.round(r * 0.62) + 'px "Noto Sans SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 先描一圈深色轮廓，浅色球（列车长、冰法、钢盾）上白字也看得清
    ctx.lineWidth = Math.max(2.4, r * 0.09);
    ctx.strokeStyle = 'rgba(22,32,44,.55)';
    ctx.lineJoin = 'round';
    ctx.strokeText(Math.max(0, Math.ceil(u.hp)), u.x, u.y + 1);
    ctx.fillText(Math.max(0, Math.ceil(u.hp)), u.x, u.y + 1);

    // 名字牌
    const teamMode = teamBig();
      const sameKey = A && B && A.key === B.key;
      const sideName = u.side === 'A' ? 'A队' : 'B队';
      const label = (sameKey || teamMode)
        ? ((u.name || u.tag) + ' · ' + (teamMode ? sideName : u.side))
        : (u.name || u.tag);
    ctx.font = '600 15px "Noto Sans SC","Microsoft YaHei",sans-serif';
    const tw = ctx.measureText(label).width;
    const bw = tw + 20, bh = 26;
    const tagOff = u.side === 'A' ? -Math.min(26, bw * 0.32) : Math.min(26, bw * 0.32);
    const bx = u.x - bw / 2 + tagOff, by0 = u.y - r - 34;
    // 两个球贴得太近时，右侧那个名字牌再往上抬一点，避免叠在一起
    const otherU = u.side === 'A' ? B : A;
    const tooClose = !!otherU && Math.hypot(otherU.x - u.x, otherU.y - u.y) < 180;
    const byy = by0 - (tooClose && u.side === 'B' ? 30 : 0);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#1d2126';
    ctx.lineWidth = 1.5;
    roundRect(bx, byy, bw, bh, 5);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2126';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + bw / 2, byy + bh / 2 + 1);

    // 技能冷却：两边都挂着，随时能看到对面大招还剩几秒
    if (!u.pet) {   // 怨灵没有技能，不给自己挂冷却条
      const cdLeft = Math.max(0, u.specialT || 0);
      // 技能好了就固定显示「就绪」，不再因为「捏着技能等时机」而一闪一闪
      const cdReady = cdLeft <= 0.05;
      const cdTxt = cdReady ? '技能 就绪' : '技能 ' + cdLeft.toFixed(1) + 's';
      ctx.font = '600 12px "Noto Sans SC","Microsoft YaHei",sans-serif';
      const cw = ctx.measureText(cdTxt).width + 14;
      const cx0 = bx + bw / 2 - cw / 2, cy0 = byy + bh + 5;
      const hi = cdReady;
      ctx.fillStyle = hi ? 'rgba(46,139,139,.94)' : 'rgba(255,255,255,.94)';
      ctx.strokeStyle = hi ? 'rgba(46,139,139,1)' : '#c9d2dc';
      ctx.lineWidth = 1;
      roundRect(cx0, cy0, cw, 19, 5);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = cdReady ? '#fff' : '#5b6672';
      ctx.fillText(cdTxt, cx0 + cw / 2, cy0 + 10);
    }

    // 状态标记
    let sy = u.y + r + 16;
    if (u.mistT > 0) { badge(u.x - 34, sy, '隐身', '#8c1b2b'); }
    if (u.slowT > 0) { badge(u.x + 4, sy, '减速', '#3b6ea5'); }
    if (u.stunT > 0) { badge(u.x - 34, sy - 26, '硬直', '#3c4650'); }
    if (u.poisonT > 0) { badge(u.x + 4, sy - 26, '中毒', '#6b8a2f'); }
    if (u.drag) { badge(u.x - 34, sy - 52, '被钩走', '#2e8b8b'); }

    ctx.restore();
  }

  function badge(x, y, text, color) {
    ctx.save();
    ctx.font = '600 12px "Noto Sans SC",sans-serif';
    const w = ctx.measureText(text).width + 12, h = 18;
    ctx.fillStyle = color;
    roundRect(x, y, w, h, 9); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + 6, y + h / 2 + 1);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function hexA(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function lighten(hex, amt) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const m = v => Math.round(v + (255 - v) * amt);
    return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
  }

  // ---------- 循环 ----------
  function loop(t) {
    try {
      // 切到后台就别烧 CPU 了
      if (document.hidden) { lastT = t; requestAnimationFrame(loop); return; }
      if (!lastT) lastT = t;
      const rawDt = Math.min((t - lastT) / 1000, 0.05);
      lastT = t;                       // ← 必须设，否则每帧都按封顶值 0.05 走 = 悄悄 3 倍速

      // 顿帧：大伤害/击杀那一下把世界冻住几十毫秒，画面照常画（这就是「打击感」的来源）
      if (hitStop > 0) {
        hitStop = Math.max(0, hitStop - rawDt);
        punch = Math.max(0, punch - rawDt * 3.6);
        flashA = Math.max(0, flashA - rawDt * 2.4);
        draw();
        drawSay();
        drawSay();
        updateSkillUI();
        requestAnimationFrame(loop);
        return;
      }

      let dt = paused ? 0 : rawDt * speedMul;

      acc += dt;
      // 固定步长但封顶：×2 时一帧别塞十几步，否则帧时间会一阵一阵抖
      let steps = 0;
      while (acc >= 1 / 120 && steps++ < 8) {
        step(1 / 120);
        acc -= 1 / 120;
      }
      if (acc > 1 / 120) acc = 0;
      draw();
      drawSay();
      updateSkillUI();
    } catch (err) {
      // 出错也不许卡死：记下来、重置一局、继续跑
      window.__lastErr = String(err && err.stack || err);
      acc = 0;
      try {
        const st = document.getElementById('stats');
        if (st) st.textContent = '刚才出了一次错（' + (err && err.message || 'unknown') + '），已自动重置';
        newMatchup(true);
      } catch (e2) { mode = 'over'; }
    }
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  const goBtn = document.getElementById('go');

  const pickA = document.getElementById('pickA');

  const teamSel = {};
  function buildTeamPickers(n) {
    const box = document.getElementById('teamRows');

    if (card && box.parentElement !== card) card.appendChild(box);
    box.innerHTML = '';
    for (const k in teamSel) delete teamSel[k];

        const mainIdx = Math.max(0, KEYS.indexOf(mainSel ? mainSel.value : ''));

        sel.style.backgroundColor = id[0] === 'A' ? '#fffbfb' : '#f9fdfd';

        sel.addEventListener('change', () => {

          shake = Math.max(shake, 2.4);
          dot.classList.remove('pop'); void dot.offsetWidth; dot.classList.add('pop');
          setTimeout(() => dot.classList.remove('pop'), 200);
        });
        teamSel[id] = sel;
        return [dot, sel];
      };
      const [dotA, selA] = mkSel('A' + i);
      const [dotB, selB] = mkSel('B' + i);
      const vs = document.createElement('span');
      vs.className = 'vc';
      vs.textContent = 'VS';
      row.appendChild(dotA); row.appendChild(selA);
      row.appendChild(vs);
      row.appendChild(dotB); row.appendChild(selB);
      box.appendChild(row);
    }
  }

  function teamKeys(side, n) {

  function syncPickers() {

  // 选角的小反馈：圆点变色、下拉框抖一下、场上那颗球弹一圈

  function pickChanged() {

  // 「随机角色」：抽一对不一样的；团队局连队友一起抽；正在打就直接开新的一局
  (function mountRandBtn() {

  const HOLD = params.get('hold');
  if (HOLD) { setInterval(() => { for (const k of HOLD.split(',')) keys[k] = true; }, 16); }
  if (DBG) { setInterval(() => { if (A) document.title = 'x' + Math.round(A.x) + ' k' + (keys['d'] ? 1 : 0) + ' c' + ctrlMode + (A.drag ? 'D' : '') + (A.stunT > 0 ? 'S' : ''); }, 100); }
  if (params.has('auto')) {
    setTimeout(startBattle, 120);
  }
  window.addEventListener('resize', () => { resize(); });
})();
</script>
</body>
