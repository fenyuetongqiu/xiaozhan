<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>小球成名之战</title>
<style>
  :root{
    --ink:#161a1f; --dim:#6a7480; --line:#e4e8ee; --bg:#f6f7f9; --card:#fff;
    --shadow:0 1px 2px rgba(16,24,40,.06);
    --shadow2:0 6px 18px rgba(16,24,40,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;color:var(--ink);
    background:
      radial-gradient(100% 60% at 50% -8%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg,#e9edf3 0%,#e3e8ef 52%,#dce2ea 100%);
    font-family:"Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    display:flex;justify-content:center;padding:6px 10px 10px;min-height:100vh;
  }
  #app{width:min(468px,100%);display:flex;flex-direction:column;gap:8px;margin:0 0 auto}
  .kicker{text-align:center;letter-spacing:.5em;font-size:11px;color:#9aa3ae;margin-bottom:2px}
  h1{margin:0;text-align:center;font-size:clamp(21px,6vw,28px);letter-spacing:.04em;font-weight:800}
  h1 .vs{font-size:.62em;color:#a9b1ba;margin:0 .55em;letter-spacing:0;font-weight:700}
  #stageWrap{position:relative;border-radius:16px;overflow:hidden;background:#e6ebf1;
    box-shadow:inset 0 0 0 1px rgba(16,24,40,.07),0 2px 10px rgba(16,24,40,.06)}
  canvas{display:block;width:100%;height:auto}
  #banner{
    position:absolute;left:50%;top:16px;transform:translateX(-50%);
    background:#fff;border-radius:12px;padding:9px 20px;
    font-size:clamp(17px,4.4vw,23px);font-weight:800;white-space:nowrap;
    box-shadow:0 8px 24px rgba(16,24,40,.16);transition:opacity .2s;
  }
  #banner.win{background:#1d2126;color:#fff}
  #banner.hide{opacity:0}
  .cdlist{display:none;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .cdlist.on{display:flex}
  .cdchip{font-size:12px;line-height:1.5;padding:2px 9px;border-radius:999px;border:1px solid #d8dde3;background:#fff;color:#43505c;white-space:nowrap}
  .cdchip.a{border-color:#bcd3f2;background:#f7faff}
  .cdchip.b{border-color:#f0c6c0;background:#fff9f8}
  .cdchip.rdy{background:#e9f7f4;border-color:#97cfc2;color:#11665a;font-weight:700}
  .cdchip.dead{opacity:.45;text-decoration:line-through}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .legend .side{border-top:1px solid var(--line);padding-top:6px}
  .legend .side b{display:block;font-size:13.5px;margin-bottom:4px;color:#2b333c}
  .legend .side ul{margin:0;padding-left:0;list-style:none;font-size:12.5px;color:#5b6673;line-height:1.65}
  .legend .side li::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
    background:#c3cad2;margin-right:7px;vertical-align:2px}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #go{white-space:nowrap;flex:1 1 130px;min-width:112px;background:#1d2126;color:#fff;border-color:transparent}
  button{
    flex:1;padding:11px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:15px;font-weight:700;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;
    box-shadow:var(--shadow);transition:transform .08s,box-shadow .15s,background .15s,border-color .15s;font-family:inherit;
  }
  button:hover{border-color:#cfd6de;box-shadow:0 4px 12px rgba(16,24,40,.08);transform:translateY(-1px)}
  button:active{transform:scale(.995);box-shadow:var(--shadow)}
  button::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.10),transparent 70%);
    transition:opacity .18s;
  }
  button:active::after{opacity:1}
  #go:hover{box-shadow:var(--shadow2)}
  button.small{flex:0 0 auto;padding:11px 14px;font-size:13px}
  #hint{font-size:11.5px;color:#8a939c;white-space:nowrap}
  .pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pick .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(0,0,0,.06);transition:background .18s,transform .18s}
  .pick .dot.pop{transform:scale(1.7)}
  .pick select{
    flex:1;min-width:0;padding:10px 30px 10px 12px;border:1px solid #d8dde3;border-radius:10px;
    background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:#111;cursor:pointer;text-align:center;
    box-shadow:0 1px 2px rgba(16,24,40,.05);appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#5b6470 50%),linear-gradient(135deg,#5b6470 50%,transparent 50%);
    background-position:calc(100% - 18px) 56%,calc(100% - 12px) 56%;
    background-size:6px 6px,6px 6px;background-repeat:no-repeat;
    transition:border-color .15s,box-shadow .15s,background-color .2s;
  }
  .pick select:hover{border-color:#b9c0c9;box-shadow:0 2px 6px rgba(16,24,40,.09)}
  .pick select:active{border-color:#9aa3ae}
  .pick select:focus{outline:none;border-color:#9aa3ae;box-shadow:0 0 0 3px rgba(60,70,80,.09)}
  #pickA{background-color:#fffbfb}
  #pickB{background-color:#f9fdfd}
  .pick select option{font-weight:700}
  .pick .vc{font-size:12px;font-weight:700;color:#8a939c;letter-spacing:.08em}
  .pick button{flex:0 0 auto;padding:9px 13px;font-size:13px}
  @keyframes shakeX{
    0%,100%{transform:translateX(0) rotate(0)}
    18%{transform:translateX(-5px) rotate(-1deg)}
    36%{transform:translateX(5px) rotate(1deg)}
    54%{transform:translateX(-3px)}
    72%{transform:translateX(2px)}
  }
  .shake{animation:shakeX .34s ease}
  .trainPanel{display:none;position:fixed;right:18px;top:64px;width:340px;max-height:70vh;overflow:auto;background:#fff;border:1px solid #d8dde3;border-radius:14px;box-shadow:0 12px 32px rgba(20,40,70,.14);padding:12px 14px;z-index:40;font-size:13px;line-height:1.65;color:#2b3540}
  .trainPanel.on{display:block}
  .trainPanel .tpHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:15px}
  .trainPanel .k{color:#6b7785}
  .trainPanel .row{margin:3px 0}
.trainPanel .tpch{display:inline-block;margin:0 10px 4px 0;color:#6b7785;font-size:13px}
.trainPanel .tpch b{color:#2f3b48}
.trainPanel .tpseed{color:#6b7785;font-size:12.5px;line-height:1.75}
.trainPanel .tplist{margin:2px 0 0}
.trainPanel .tpitem{display:flex;align-items:baseline;gap:8px;font-size:12.5px;line-height:1.9}
.trainPanel .tpitem .tk{flex:0 0 62px;color:#a9b4c0}
.trainPanel .tpitem .tv{flex:1;color:#4a5664}
.trainPanel .tpitem .tv b{color:#2f3b48}
.trainPanel .tpseed .tk{display:inline-block;min-width:34px;color:#98a4b2;margin-right:6px}
.trainPanel .tpline{border-top:1px dashed #e7edf3;margin:6px 0}
  .teamrows{display:none;flex-direction:column;gap:5px;margin:2px 0 0;box-sizing:border-box;flex:0 0 100%}
  .teamrows .trow{display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box}
  .teamrows .trow .lab{display:none}
  .teamrows .trow select{flex:1 1 0;min-width:0;width:auto}
  .teamrows .trow .vs{flex:0 0 auto;font-size:11px;color:#9aa4b1}
  .teamrows .trow{background:#f6f8fb}
  .teamrows.on{display:flex !important}
  .teamrows.on{display:flex}
  .teamrows .trow{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:0;padding:0;box-shadow:none}
  .teamrows .trow .lab{font-size:12px;color:#8a94a2;white-space:nowrap;flex:0 0 auto;min-width:38px}
  .teamrows select{flex:1 1 0;min-width:0;padding:6px 9px;border:1px solid #d8dde3;border-radius:9px;font-family:inherit;font-size:14px;font-weight:700;color:#111;text-align:center;cursor:pointer;background-color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05);appearance:none;-webkit-appearance:none}
  .teamrows .vc{color:#8a94a2;font-size:12px;flex:0 0 auto}
  /* 团队模式下：第一排跟队友行同一个样子 */
  .pick.teamlike{gap:7px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px;box-shadow:var(--shadow)}
  .pick.teamlike select{flex:1 1 0;min-width:0;padding:6px 9px;font-size:14px;font-weight:700;border-radius:9px;text-align:center;background-color:#fff}
  .pick.teamlike .vc{font-size:12px;font-weight:700}
  .tp{display:none;gap:6px;align-items:center}
  .tp.on{display:flex}
  .pick select{min-width:128px}
  .tp select{min-width:104px}
  .tp select{padding:9px 10px;border-radius:10px;border:1px solid #d8dde3;font:inherit;font-size:14px;background:#fff;color:#2b3540}
  .tp .lab{font-size:12px;color:#8a94a2;white-space:nowrap;flex:0 0 auto}
  .pick select{flex:0 0 auto}
  #rnd{white-space:nowrap;flex:0 0 auto}
  .teampick.on{display:flex}
  .teampick .lab{font-size:12px;color:#6b7785}
  .teampick select{padding:5px 8px;border-radius:8px;border:1px solid #d8dde3;font:inherit;font-size:12px;background:#fff;color:#2b3540}
  .modebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .modebar button{
    padding:8px 3px;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:9px;
    background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-family:inherit;
  }
  .modebar button.on{background:#1d2126;color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(16,24,40,.18)}
  .diffbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0}
  .diffbar span{font-size:11px;color:#9aa3ae;letter-spacing:.06em;white-space:nowrap}
  .difftip{flex-basis:100%;font-size:12px;color:#6b7785;margin:2px 0 0 4px;line-height:1.55;letter-spacing:.2px}
  .diffbar button{
    flex:1;padding:6px 2px;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font-family:inherit;
  }
  .diffbar button.on{background:#1d2126;color:#fff;border-color:transparent}
  .diffbar button[data-diff="hell"].on{background:#b3261e;border-color:transparent;box-shadow:0 4px 12px rgba(179,38,30,.25)}
  .bar .sk{min-width:72px;font-size:11px;line-height:1.15;padding:6px}
  .bar .sk.rdy{background:#1d2126;color:#fff;border-color:transparent}
  .bar .sk.cast{background:#1d2126;color:#fff;border-color:transparent;transform:scale(.94);transition:transform .1s}
  .bar .sk:disabled{opacity:.45;cursor:default}
  .keys{font-size:11px;color:#9aa3ae;text-align:center;min-height:14px}
  #stats{text-align:center;font-size:12px;color:#8a939c;min-height:16px}

  /* ===== 横屏两栏：左栏全是操作，右栏是场地 ===== */
  @media (min-width: 880px) and (orientation: landscape) {
    #app {
      width: min(1240px, 100%);
      display: grid;
      grid-template-columns: 352px minmax(0, 1fr);
      grid-template-rows: auto auto auto auto auto auto auto;
      column-gap: 18px;
      row-gap: 9px;
      align-items: start;
      justify-content: center;
    }
    #app > .pick       { grid-area: 1 / 1; }
    #app > .modebar    { grid-area: 2 / 1; }
    #app > .diffbar    { grid-area: 3 / 1; }
    #app > .legend     { grid-area: 4 / 1; }
    #app > .bar        { grid-area: 5 / 1; }
    #app > .keys       { grid-area: 6 / 1; }
    #app > #stats      { grid-area: 7 / 1; }
    #app > .kicker     { grid-area: 1 / 2; }
    #app > h1          { grid-area: 1 / 2 / 2 / 3; }
      #app > #stageWrap { grid-area: 2 / 2 / 8 / 3 !important; }
    #app > #stageWrap  { grid-area: 3 / 2 / 8 / 3; align-self: stretch; display: flex; align-items: flex-start; justify-content: center; }
      #app.teammode > #stageWrap { grid-area: 1 / 2 / 8 / 3 !important; }
      #app > .kicker { display: none; }
    #stageWrap canvas { width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 96px); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="kicker">成 名 之 战</div>
  <h1><span id="nA">吸血鬼</span><span class="vs">VS</span><span id="nB">鱼钩</span></h1>
  <div class="pick">
    <span class="dot" id="dotA"></span>
    <select id="pickA" aria-label="左边选手"></select>
    <span class="vc">VS</span>
    <span class="dot" id="dotB"></span>
    <select id="pickB" aria-label="右边选手"></select>
     </div>
  <div id="teamRows" class="teamrows"></div>
  <div class="modebar">
    <button type="button" data-mode="auto" class="on">电子斗蛐蛐</button>
    <button type="button" data-mode="autoLoop">自动连斗</button>
    <button type="button" data-mode="p1">我来打</button>
    <button type="button" data-mode="pvp">双人对打</button>
    <button type="button" data-mode="t3v3">3v3 团队</button>
      <button type="button" data-mode="t3v3loop">自动 3v3</button>
    <button type="button" data-mode="p2v2">2v2 双人打AI</button>
  </div>
  <div class="diffbar">
    <span>人机强度</span>
    <button type="button" data-diff="easy">简单</button>
    <button type="button" data-diff="normal" class="on">普通</button>
    <button type="button" data-diff="hard">困难</button>
    <button type="button" data-diff="hell">地狱</button>
    <div class="difftip" id="diffTip"></div>
  </div>

  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="banner">最后谁赢？</div>
  </div>
  <div class="legend">
    <div class="side"><b id="lA">吸血</b><ul id="ubA"></ul></div>
    <div class="side"><b id="lB">抛钩</b><ul id="ubB"></ul></div>
  </div>
  <div class="bar">
    <button id="go">开 战</button>
    <button type="button" id="skA" class="small sk" style="display:none">技能</button>
    <button type="button" id="skB" class="small sk" style="display:none">技能</button>
    <button id="fast" class="small" title="当前速度，点一下切换">1×</button>
      <button id="pause" class="small" title="暂停 / 继续（空格）">⏸</button>
      <button id="trainBtn" class="small" title="看看它们练得怎么样了">训练提升</button>
      <button id="bsBtn" class="small" title="自动积累的兵书">兵书</button>
      <button id="introBtn" class="small" title="所有角色的技能和亡语">角色介绍</button>
  </div>
  <div class="keys" id="keys"></div>
  <div id="stats"></div>
<div id="bsPanel" class="trainPanel">
  <div class="tpHead"><b>兵书</b><button id="bsExp" class="small">导出练度</button><button id="bsImp" class="small">导入练度</button><button id="bsClose" class="small">关闭</button></div>
  <div id="bsBody" class="tpBody"></div>
</div>
<div id="introPanel" class="trainPanel">
  <div class="tpHead"><b>角色介绍</b><button id="ipClose" class="small">关闭</button></div>
  <div id="ipBody" class="tpBody"></div>
</div>
<div id="trainPanel" class="trainPanel">
  <div class="tpHead"><b>训练提升</b><button id="tpClose" class="small">关闭</button></div>
  <div id="tpBody" class="tpBody"></div>
</div>
</div>

function makeDraggable(panel) {
  if (!panel || panel._drag) return;
  panel._drag = 1;
  let on = false, sx = 0, sy = 0, bx = 0, by = 0;
  const pin = () => {
    // 第一次拖之前，先把面板「钉」成 fixed + left/top，避免和原来的居中变换打架
    if (panel._pinned) return;
    const r = panel.getBoundingClientRect();
    panel.style.position = 'fixed';
    panel.style.left = r.left + 'px';
    panel.style.top = r.top + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.margin = '0';
    panel.style.transform = 'none';
    panel._pinned = 1;
  };
  panel.addEventListener('mousedown', (e) => {
    if (e.target.closest('button') || e.target.closest('select') || e.target.closest('input')) return;
    pin();
    on = true;
    sx = e.clientX; sy = e.clientY;
    bx = parseFloat(panel.style.left) || 0;
    by = parseFloat(panel.style.top) || 0;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!on) return;
    panel.style.left = (bx + e.clientX - sx) + 'px';
    panel.style.top = (by + e.clientY - sy) + 'px';
  });
  window.addEventListener('mouseup', () => { on = false; });
  panel.addEventListener('dblclick', (e) => {
    if (e.target.closest('button')) return;
    panel._pinned = 0;
    panel.style.position = ''; panel.style.left = ''; panel.style.top = '';
    panel.style.right = ''; panel.style.bottom = ''; panel.style.margin = '';
    panel.style.transform = '';
  });
}

        u.moving = 0;
        if (u.cdT <= 0) {
          u.cdT = u.cd;
          hurt(foe, 2, u, null, true);
          addSwing(u, foe);
          addParts(foe.x, foe.y, u.color, 3);
          u.backT = 0.3;
        }
      } else if (threatD < GUARD) {
        // 站位：挡在主人和敌人中间，保持一小段距离
        const ang = Math.atan2(foe.y - oy, foe.x - ox);
        const ring = Math.min(118, Math.max(44, threatD * (u.slot || 0.35)));
        tx = clamp(ox + Math.cos(ang) * ring, 20, W - 20);
        ty = clamp(oy + Math.sin(ang) * ring, 20, H - 20);
        go = true; rate = 1.05;
      }
    }
    if (!go) {
      // 没打起来的时候，隔着主人朝敌人那边站成一排（护驾的姿态）
      if (foe && own) {
        const ang3 = Math.atan2(foe.y - oy, foe.x - ox);
        tx = clamp(ox + Math.cos(ang3 + (u.seed % 1 - 0.5) * 0.5) * 74, 20, W - 20);
        ty = clamp(oy + Math.sin(ang3 + (u.seed % 1 - 0.5) * 0.5) * 74, 20, H - 20);
        go = Math.hypot(tx - u.x, ty - u.y) > 12;
        rate = 0.9;
      }
      if (!go) {
        if (homeD > 46) { tx = ox; ty = oy; go = true; rate = 0.8; }
        else { u.moving = 0; }        // 主人身边待命
      }
    }
    if (go) {
      const dx2 = tx - u.x, dy2 = ty - u.y, dd2 = Math.hypot(dx2, dy2);
      if (dd2 > 6) {
        const sp2 = u.speed * rate * (u.slowT > 0 ? 0.5 : 1);
        const nx = dx2 / dd2, ny = dy2 / dd2;
        const wig = Math.sin(now() * 2.2 + (u.seed || 0)) * 0.3;   // 侧着绕过去，不直撞
        u.x += (nx - ny * wig) * sp2 * dt;
        u.y += (ny + nx * wig) * sp2 * dt;
        u.moving = 1;
      } else u.moving = 0;
    }
    // 咬完往后缩一下
    if ((u.backT || 0) > 0) {
      u.backT -= dt;
      if (foe) {
        const a2 = Math.atan2(u.y - foe.y, u.x - foe.x);
        u.x += Math.cos(a2) * 95 * dt;
        u.y += Math.sin(a2) * 95 * dt;
      }
    }
    u.x = clamp(u.x, u.r + 8, W - u.r - 8);
    u.y = clamp(u.y, u.r + 8, H - u.r - 8);
  }

  // ---------- 女巫的药瓶：一半回血、一半下毒，落地按范围结算 ----------
  function witchPotion(u, foe, dmg) {

  // 人机什么时候该把鱼线收回来：拐够弯了、绕太长了、或者明显在往外飞（不再按死的秒数）
  function hookShouldReel(u, flying, foe) {
    try {
      const pl = pathLen(flying.pts || []);
      const head = (flying.pts && flying.pts.length) ? flying.pts[flying.pts.length - 1] : flying;
      const toF = Math.hypot(foe.x - head.x, foe.y - head.y) || 1;
      const sp = Math.hypot(flying.vx || 0, flying.vy || 0) || 1;
      const closing = ((flying.vx || 0) * (foe.x - head.x) + (flying.vy || 0) * (foe.y - head.y)) / (sp * toF);
      if ((flying.bounces || 0) >= 3) return true;        // 墙都撞了三下，再飞也是白飞
      if (pl > 1500) return true;                          // 绕太远，收回来重甩
      if (closing < -0.2 && toF > 420) return true;         // 明显在往外飞、离他越来越远
      return false;
    } catch (e) { return false; }
  }
  function potionBurst(s) {

  // ---------- 邮差的包裹：抛过去、落地引信 0.45 秒、炸开减速 ----------
  function postmanParcel(u, foe, dmg, spread) {

  // 战术嘴炮：每隔一会儿喊一句它们正在干嘛（包围 / 集火 / 拉开 …），只给观战看
  const BARKS_TANK = ['我顶着', '躲我后面', '先别上', '我扛'];          // 肉盾说的
  const BARKS_SOFT = ['给我点空间', '他残了，上', '我绕后', '换我输出'];  // 脆皮说的
  const BARKS_TEAM = ['包围他', '集火一个', '别贴脸', '拉开距离', '收人头', '散开点', '切后排'];
  let lastBarkT = -99, lastBarkTxt = '';
  // 单人局不喊话（2026-10-30 秋：'这发躲得掉' 这种废话没用），只保留组队时的战术沟通
  const GEN_MATH = ['d = √(Δx²+Δy²)', 't = d / v = 0.42s', 'v = √(vx²+vy²)', 'θ = atan2(Δy, Δx)', 'DPS = dmg / cd', 'x′ = x + v·t'];
  function barkNote(u, tag) {
    if (!(ctrlMode === 'auto' || ctrlMode === 'autoLoop' || ctrlMode === 't3v3' || ctrlMode === 'p2v2')) return;
    if ((u.barkT || 0) > 0) return;
    if (tag) {
      const tk = tag.indexOf('包') >= 0 ? 'surround' : tag.indexOf('集火') >= 0 ? 'focus'
        : tag.indexOf('等队友') >= 0 ? 'wait' : tag.indexOf('掩护') >= 0 ? 'cover'
        : tag.indexOf('墙') >= 0 ? 'wall' : null;
      if (tk) {
        AILEARN._tactics = AILEARN._tactics || {};
        AILEARN._tactics[tk] = (AILEARN._tactics[tk] || 0) + 1;
      }
    }
    u.barkT = 4.2 + Math.random() * 2.0;
    // 全队错峰：1.8 秒内只有一个人开口，同一句 5 秒内不重复
    if (battleTime - lastBarkT < 1.8) return;
    let txt = tag, col = '#7a5c2f';
    if (!txt) {
      const team = units.filter((o) => o && o.alive && o.side === u.side).length > 1;
      const lowAlly = units.some((o) => o && o.alive && o.side === u.side && o !== u && o.hp / o.maxHp < 0.45);
      const tanky = (u.k || 1) <= 0.9;
      const anyRanged = units.some((o) => o && o.alive && o.kind !== 'melee');
      if (!team) return;   // 单人局不喊
      const pool = lowAlly && tanky ? BARKS_TANK : (tanky ? BARKS_TANK : BARKS_SOFT);
      txt = pool[Math.floor(Math.random() * pool.length)];
      col = tanky ? '#7a5c2f' : (team ? '#6d4f8a' : '#7a5c2f');
    }
    if (txt === lastBarkTxt && battleTime - lastBarkT < 5) return;
    lastBarkT = battleTime; lastBarkTxt = txt;
    addFloat(u.x + rand(-8, 8), u.y - u.r - 56, txt, col, 1.35, 1.05);
  }

// 全局粒子系数：<1 就是整体减量（改这一个数就能统一调手感）

const PART_K = 0.72;


function addFloat(x, y, txt, color, life, scale, mono) {
    floats.push({ x, y, txt, color: color || '#1d2126', life: life || 0.9, t: life || 0.9, scale: scale || 1, vy: mono ? -18 : -34, mono: !!mono });
  }
  // 全局粒子密度：0.78 = 比之前少两成多，但别少到看不见
  const PART_MUL = 0.5;
  function addParts(x, y, color, n) {
    n = Math.max(1, Math.round(n * PART_K));
    n = Math.max(1, Math.round(n * PART_MUL));
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 220);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: rand(.3, .6), t: 0, color });
    }
    trimParts();
  }
  // 向外炸开的高速粒子：技能起手专用，飞得比普通粒子远、活得也久
  function addSpray(x, y, color, n, spd) {
    n = Math.max(1, Math.round(n * PART_K));
    n = Math.max(1, Math.round(n * PART_MUL));
    const s0 = spd || 300;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(s0 * 0.55, s0 * 1.45);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.45, .85), t: 0, color });
    }
    trimParts();
  }
  // 往里收的粒子：蓄力/聚能用，从一圈往中心吸，越吸越快
  function addImplode(cx, cy, color, n, radius, time) {
    n = Math.max(1, Math.round(n * PART_K));
    const R = radius || 90, T = time || 0.3;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), r0 = R * rand(0.75, 1.15);
      parts.push({
        x: cx + Math.cos(a) * r0, y: cy + Math.sin(a) * r0,
        vx: -Math.cos(a) * r0 / T, vy: -Math.sin(a) * r0 / T,
        life: T, t: 0, color, noG: true
      });
    }
    trimParts();
  }
  // 水花：像重物砸进水面，主束往上冲、两侧溅出细水珠
  function addSplash(x, y, color, n, power) {
    n = Math.max(1, Math.round(n * PART_K));
    n = Math.max(1, Math.round(n * PART_MUL));
    const P = power || 620;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rand(-0.58, 0.58);
      const sp = P * rand(0.55, 1.15);
      parts.push({ x: x + rand(-16, 16), y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.5, 1.0), t: 0, color });
    }
    trimParts();
  }
  // 沿着一条线撒火星：光束/贯穿类技能专用
  function addLineSparks(x1, y1, x2, y2, color, n, spd) {
    n = Math.max(1, Math.round(n * PART_K));
    const s0 = spd || 220;
    for (let i = 0; i < n; i++) {
      const p = Math.random();
      const a = rand(0, Math.PI * 2), sp = rand(s0 * .3, s0);
      parts.push({
        x: x1 + (x2 - x1) * p, y: y1 + (y2 - y1) * p,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rand(.25, .6), t: 0, color
      });
    }
    trimParts();
  }
  // 粒子总数封顶：再炫也不能把帧数拖死
  function trimParts() {
    if (parts.length > 480) parts.splice(0, parts.length - 480);

    const foes = units.filter((o) => o && o.alive && o.side !== u.side);
    if (!foes.length) return null;
    const near = nearestFoe(u);
    foes.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp));
    const tgt = foes[0];
    if (!near) return tgt;
    return dist(u, tgt) <= (u.range || 300) * 1.35 ? tgt : near;
  }
  function nearestFoe(u) {
    let best = null, bs = 1e9;
    for (const o of units) {
      if (!o || o === u || !o.alive || o.side === u.side) continue;
      const dd = Math.hypot(o.x - u.x, o.y - u.y);
      // 团队局：距离之外再按「血越少越优先」加权，队友自然集火同一个目标
      const teamBias = teamBig() ? (1 - o.hp / o.maxHp) * 260 : 0;
      const sc = dd - teamBias;
      if (sc < bs) { bs = sc; best = o; }
    }
    return best;
  }

    for (const o of units) {
      if (!o || o === u || !o.alive || o.side !== u.side) continue;
      const d2 = (o.x - u.x) ** 2 + (o.y - u.y) ** 2;
      if (d2 < bd) { bd = d2; best = o; }
    }
    return best;
  }

  // 纯数值的那些羁绊，玩家一眼看不见 —— 触发时飘一下名字，同一张羁绊 3 秒内不重复刷
  const BOND_NAME = {};

  function bondSay(u, id) {

  }

  function synergyName(a, b) {
    if (!a || !b) return '';
    for (const [id, nm, ka, kb] of BOND_DEFS) {
      if (ka === kb) continue;
      if ((a.key === ka && b.key === kb) || (a.key === kb && b.key === ka)) return nm;
    }
    if (a.key === b.key) {
      for (const [id, nm, ka, kb] of BOND_DEFS) if (ka === kb && a.key === ka) return nm;
    }
    return '';
  }
  function bondKind(a, b) {
    if (!a || !b) return '';
    for (const [id, nm, ka, kb, kind] of BOND_DEFS) {
      if (ka === kb) { if (a.key === ka && b.key === kb) return kind; continue; }
      if ((a.key === ka && b.key === kb) || (a.key === kb && b.key === ka)) return kind;
    }
    return '';
  }

  function teamLeft(side) {
    return units.filter((o) => o && o.alive && !o.pet && o.side === side).length;
  }

  function finishTeam(winSide) {
    if (ended) return;
    const alive = units.filter((o) => o && o.alive && o.side === winSide);
    finish(alive[0] || A, null);
    bannerEl.textContent = (winSide === 'A' ? 'A 队' : 'B 队') + ' 赢';
  }

  function checkDeath(u) {
    if (!u.alive) return;
    if (u.pet) {
      u.alive = false; u.hp = 0;
      addParts(u.x, u.y, u.color, 10);
      addRing(u.x, u.y, u.color, 2, u.r * 2.2, .32);
      return;
    }
    if (u.hp <= 0) {
      // 大肥鱼的「鲸鲸的守护」：每局挡一次致命伤
      if (u.key === 'fatfish' && !u.whaled) {
        u.whaled = true;
        u.hp = 25;
        u.alive = true;
        addFloat(u.x, u.y - u.r - 76, '鲸鲸的守护 · 不许死', '#2f6fb0', 1.2, 1.3);
        addRing(u.x, u.y, '#2f6fb0', u.r * .8, u.r * 3.4, .8);
        addRing(u.x, u.y, '#bfe9ff', u.r * .5, u.r * 2.4, .5);
        addSpray(u.x, u.y, '#bfe9ff', 32, 400);
        shake = Math.max(shake, 5);
        return;
      }
      // 赌徒的意志：0 血时赌一次命，每局 3 次机会
      // 骰 4-6 赢：回 40 血、对面赔一半；骰 1-3 输：扣一次机会、回 10 血硬撑；3 次用完才真死
      if (u.key === 'gambler' && (u.willTries || 0) < 3) {
        const foe = u.side === 'A' ? B : A;
        u.willTries = (u.willTries || 0) + 1;
        const roll = 1 + Math.floor(Math.random() * 6);
        const left = 3 - u.willTries;
        addFloat(u.x, u.y - u.r - 74, '赌徒的意志 · 骰 ' + roll + '（剩 ' + left + ' 次）', '#a8442f', 1.25, 1.35);
        addRing(u.x, u.y, '#a8442f', u.r * .7, u.r * 2.8, .7);
        if (roll >= 4) {
          u.hp = Math.min(u.maxHp, 40);
          u.alive = true;
          if (foe && foe.alive) {
            const cut = Math.max(1, Math.round(foe.hp * 0.5));
            applyDamage(foe, cut, u, false);
            addFloat(foe.x, foe.y - foe.r - 30, '赔一半', '#8c1b2b', 1.05, 1);
            checkDeath(foe);
          }
          addFloat(u.x, u.y - u.r - 30, '赌赢 · 回 40 血', '#c9932f', 1.05, 1.1);
      // ② 赌命连锁（赌徒 + 队友）：赢了全队跟着喝口汤
      if (teamBig()) {
        for (const o of units) {
          if (!o || !o.alive || o === u || o.side !== u.side) continue;
          heal(o, 15);
          addFloat(o.x, o.y - o.r - 40, '赌命连锁 +15', '#c9932f', 1.0, 1.0);
        }

        addFloat(u.x, u.y - u.r - 30, '赌输 · 3 次用完，真死', '#8c1b2b', 1.15, 1.1);

      u.hp = 0;

      u.deathT = 0;

      addParts(u.x, u.y, '#f4f7fa', 16);
      addSpray(u.x, u.y, u.color || '#3c4650', 58, 660);
      addSpray(u.x, u.y, hexA('#ffffff', .85), 24, 500);
      addImplode(u.x, u.y, hexA('#ffffff', .8), 26, u.r * 3.2, 0.3);
      addRing(u.x, u.y, u.color, u.r * .6, u.r * 2.6, .7);
      addRing(u.x, u.y, hexA('#ffffff', .7), u.r * .35, u.r * 1.7, .35);
      try { deathRattle(u); } catch (e) {}
      addRing(u.x, u.y, hexA(u.color || '#3c4650', .5), u.r * .8, u.r * 3.4, .5);
      addRing(u.x, u.y, hexA(u.color || '#3c4650', .35), u.r * 1.2, u.r * 5.2, .8);
      shake = Math.max(shake, 8.2);
      // 击杀顿帧 + 白闪 + 镜头顶一下
      hitStop = Math.max(hitStop, 0.1 / (speedMul || 1));
      flashA = Math.max(flashA, 0.62);
      punch = Math.max(punch, 1.15);
      const myMatch = matchId;
      setTimeout(() => {
        // 这期间已经重开了一局的话，这次死亡结算就直接作废
        if (myMatch !== matchId) return;
        if (mode === 'fight') {
          if (teamBig()) {
            if (teamLeft(u.side === 'A' ? 'B' : 'A') === 0) finishTeam(u.side === 'A' ? 'B' : 'A');
            else if (teamLeft(u.side) === 0) finishTeam(u.side === 'A' ? 'B' : 'A');
          } else finish(u.side === 'A' ? B : A, u);
        }
      }, 620 / (speedMul || 1));
    }
  }

  const tallyByKey = {};
  // ===== 对局记录：一局一记，攒在本地，跑几天自然有胜率表（不用一次烧一堆测试）=====
  const MATCH_KEY = 'ddj_matchlog';
  let MATCHES = [];
  try { const raw = localStorage.getItem(MATCH_KEY); if (raw) MATCHES = JSON.parse(raw) || []; } catch (e) { MATCHES = []; }
  // 老存档里混进过 ghost（怨灵被算成角色了），读回来就顺手洗掉
  MATCHES = MATCHES.map((m) => ({ ...m, a: (m.a || []).filter((k) => TYPES[k]), b: (m.b || []).filter((k) => TYPES[k]) }))
    .filter((m) => (m.a.length || m.b.length));
  // 回放功能撤掉了，把浏览器里占地方的老回放清掉
  try { localStorage.removeItem('ddj_replays'); } catch (e) { }
  function matchSave() { try { localStorage.setItem(MATCH_KEY, JSON.stringify(MATCHES)); } catch (e) { } }
  function matchLogAdd(winner) {
    try {
      const side = (x) => units.filter((o) => o && !o.pet && o.side === x).map((o) => o.key);
      MATCHES.push({ at: Date.now(), mode: ctrlMode, dur: +battleTime.toFixed(1), a: side('A'), b: side('B'), win: winner ? winner.side : 'draw', round: round });
      if (MATCHES.length > 300) MATCHES.splice(0, MATCHES.length - 300);
      matchSave();
    } catch (e) { }
  }
  window.__matchLog = () => MATCHES.slice();
  window.__matchSum = function () {
    const s = {};
    for (const m of MATCHES) {
      if (m.win !== 'A' && m.win !== 'B') continue;   // 同归于尽不算谁的胜场
      const winKeys = m.win === 'A' ? (m.a || []) : (m.b || []);
      const loseKeys = m.win === 'A' ? (m.b || []) : (m.a || []);
      for (const k of new Set(winKeys)) { (s[k] = s[k] || { w: 0, l: 0 }); s[k].w++; }
      for (const k of new Set(loseKeys)) { (s[k] = s[k] || { w: 0, l: 0 }); s[k].l++; }
    }
    const out = [];
    for (const k in s) out.push({ key: k, name: (TYPES[k] && TYPES[k].name) || k, w: s[k].w, l: s[k].l, n: s[k].w + s[k].l, rate: Math.round(s[k].w / Math.max(1, s[k].w + s[k].l) * 100) });
    out.sort((x, y) => y.n - x.n || y.rate - x.rate);
    return out;
  };
  window.__matchClear = function () { MATCHES = []; matchSave(); };
  function finish(winner, loser) {
    try {
      if (ctrlMode === 'p1') { if (winner && winner.side === 'A') AIMEM.win++; else AIMEM.lose++; }
      AIMEM.sMatches = (AIMEM.sMatches || 0) + (ctrlMode === 'p1' ? 1 : 0);
      memSave();
    } catch (e) {}
    // 结算时把鱼线全部收掉，避免下一局开局还挂着上把的线
    for (let i = shots.length - 1; i >= 0; i--) if (shots[i].kind === 'hookChain') shots.splice(i, 1);
    if (ended) return;
    ended = true;
    mode = 'over';
    // 同归于尽（2026-10-30 秋）：亡语/自爆把对面也带走、两边都没活人了，就不算谁赢
    const anyAlive = (sd) => units.some((o) => o && o.alive && !o.pet && o.side === sd);
    if (!anyAlive('A') && !anyAlive('B')) { winner = null; loser = null; }
    // 局终了，还挂着的兵法判定就地结掉（不然面板上会留一堆「成 0 败 0」）
    for (const u of units) { if (u && u.bfJudges) for (const j of u.bfJudges) j.at = -1; }
    bingSettleAll();
    // 一局一记，攒起来看胜率
    matchLogAdd(winner);
    // 打法也记账：这局谁用哪套打法赢了
    try {
      const wSide = winner && winner.side;
      if (wSide) {
        for (const x of units) {
          if (!x || !x.dok || !x.key) continue;
          const r = dokRec(x.key, x.dok);
          if (x.side === wSide) r.w++; else r.l++;
        }
        dokSave();
      }
    } catch (e) { }
    round++;
    // 收尾：把状态清干净，别让赢家顶着「隐身」半透明
    for (const u of units) {
      if (!u) continue;
      u.mistT = 0; u.slowT = 0; u.stunT = 0; u.poisonT = 0; u.poison = 0; u.backT = 0;
      u.burnT = 0; u.burn = 0;
      if (u.drag) u.drag = null;
    }
    shots = [];
    if (winner) winner.winPop = 0;
    bannerEl.textContent = winner ? winner.name + ' 赢' : '同归于尽';
    try {
      for (const b of BINGSHU) {
        let usedByWinner = false;
        for (const u2 of units) if (winner && u2 && u2.side === winner.side && u2._stratAcc && (u2._stratAcc[b.key] || 0) > 0) usedByWinner = true;
        if (usedByWinner) b.wins = (b.wins || 0) + 1;
      }
      bingshuSave();
    } catch (e) {}
    try {
      const autoBoth2 = (ctrlMode === 'auto' || ctrlMode === 'autoLoop') && winner && loser;
      if (autoBoth2 && !teamBig()) {
        const rowa = (AILEARN[winner.key] || {})[loser && loser.key];
        let msg = winner.name + ' 赢下这场。';
        if (rowa && rowa.n) {
          const avg = Math.round(rowa.d / rowa.n);
          msg += '它学到的是：打' + (loser ? loser.name : '对手') + ' 平均 ' + avg + 'px 才咬得上，累计 ' + rowa.n + ' 次命中。';
        } else {
          msg += '这个对位还没学到东西。';
        }
        feed.push({ txt: msg, col: '#3c7fa8', t: battleTime, side: winner.side });
        try { learnLogAdd(msg); } catch (e) {}
      }
    } catch (e) {}
    bannerEl.className = 'win';
    const goBtn = document.getElementById('go');
    goBtn.disabled = false;
    goBtn.textContent = '再来一场';
    const secs = battleTime.toFixed(1);
    document.getElementById('stats').textContent = '第 ' + round + ' 场 · 用时 ' + secs + ' 秒 · ' +
      (winner ? winner.name + ' 剩 ' + Math.ceil(winner.hp) + ' HP' : '同归于尽');
    if (winner) addParts(winner.x, winner.y, '#f0c34a', 30);
    else { addParts(W / 2, H / 2, '#f0c34a', 26); sayNow('同归于尽，谁也没站到最后'); }
    try {
      if (!winner) throw new Error('draw');
      const wRatio = winner.maxHp ? winner.hp / winner.maxHp : 0;
      const loseName = (loser && loser.name) ? loser.name : '对面';
      const pool = wRatio > 0.6
        ? ['拿下了，' + winner.name + '这把一点没慌', winner.name + '赢了，' + loseName + '完全没还上手']
        : wRatio > 0.25
        ? [winner.name + '赢了，' + loseName + '差一点就翻回来', '结束了，' + winner.name + '险胜']
        : ['赢麻了，' + winner.name + '就剩一口气还挺住了', winner.name + '这都能赢，' + loseName + '要气死'];
      sayNow(pool[Math.floor(Math.random() * pool.length)]);
    } catch (e) {}

    // 自动连斗：记一笔胜负，过一会儿自己换一组人接着打
    if (winner) tallyByKey[winner.key] = (tallyByKey[winner.key] || 0) + 1;
    if (t3auto && ctrlMode === 't3v3') {
      const keepSpeed = speedMul;
      setTimeout(() => {
        if (mode !== 'over' || ctrlMode !== 't3v3' || !t3auto) return;
        const ks = [...document.getElementById('pickA').options].map(o => o.value);
        const rnd = () => ks[Math.floor(Math.random() * ks.length)];
        const setSel = (el, v) => { if (el) { el.value = v; el.dispatchEvent(new Event('change')); } };
        setSel(document.getElementById('pickA'), rnd());
        setSel(document.getElementById('pickB'), rnd());
        const ts = [...document.querySelectorAll('#teamRows select')];
        if (ctrlMode !== 'p2v2') ts.forEach(el => setSel(el, rnd()));
        setup(document.getElementById('pickA').value, document.getElementById('pickB').value);
        mode = 'ready';
        startBattle();
        speedMul = keepSpeed; fastBtn.textContent = keepSpeed + '×';
      }, 1600);
    } else if (ctrlMode === 'autoLoop') {
      const keepSpeed = speedMul;
      setTimeout(() => {
        if (mode !== 'over' || ctrlMode !== 'autoLoop') return;
        newMatchup(true);
        mode = 'ready';                 // 先归位，免得 startBattle 又把旧的选择套回去
        startBattle();
        speedMul = keepSpeed; fastBtn.textContent = keepSpeed + '×';
        const top = Object.keys(tallyByKey)
          .sort((x, y) => tallyByKey[y] - tallyByKey[x])
          .slice(0, 4)
          .map(k => (TYPES[k] ? TYPES[k].name : k) + ' ' + tallyByKey[k])
          .join(' · ');

  // 训练观测：可躲率 = 能躲开的 / (能躲开的 + 挨到的)
  const DODGE_STAT = { t: 0, m: 0, near: 0, last: [] };
  window.__floats = () => floats.map((f) => f.txt);
  window.__dodge = () => {
    const d = DODGE_STAT;
    return { try: d.t, hit: d.m, graze: d.near, rate: d.t ? Math.round((1 - d.m / d.t) * 1000) / 10 : 0 };
  };

  window.__dodgeMiss = () => DODGE_STAT.last.slice();
  function pathLen(pts) {
    let L = 0;
    for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return L;
  }

  // ---------- 技能 ----------
  // ===== 可躲率：只算「本来会挨到」的弹，最后挨上了没 =====
  function settleDodge(s) {
    const list = s._dt;
    // 训练看板口径：分母 = 出生时就判定「会挨到」的弹（spawnShot 里算的），分子 = 最后真挨上的
    if (list && list.length) {
      for (const du of list) {
        if (!du || !du.key || du.pet) continue;
        const ax0 = s._sx, ay0 = s._sy, bx0 = s.x, by0 = s.y;
        const dx0 = bx0 - ax0, dy0 = by0 - ay0, L20 = dx0 * dx0 + dy0 * dy0 || 1;
        let t0 = ((du.x - ax0) * dx0 + (du.y - ay0) * dy0) / L20;
        t0 = Math.max(0, Math.min(1, t0));
        const dd0 = Math.hypot(du.x - (ax0 + dx0 * t0), du.y - (ay0 + dy0 * t0));
        DODGE_STAT.t++;
        if (dd0 < du.r + 8) {
        DODGE_STAT.m++;
        (DODGE_STAT.last || (DODGE_STAT.last = [])).push({ k: s.kind || '', rad: Math.round(s.rad || 0), sp: Math.round(Math.hypot(s.vx, s.vy)), t: Math.round((s._dgt || 0) * 100) / 100, me: du.key });
        if (DODGE_STAT.last.length > 30) DODGE_STAT.last.shift();
      } else if (dd0 < du.r + 34) DODGE_STAT.near++;
      }
    }
    if (!list || !list.length) return;
    const ax = s._sx, ay = s._sy, bx = s.x, by = s.y;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
    for (const u of list) {
      if (!u || !u.key) continue;
      let t = ((u.x - ax) * dx + (u.y - ay) * dy) / L2;
      t = Math.max(0, Math.min(1, t));
      const px = ax + dx * t, py = ay + dy * t;
      const dd = Math.hypot(u.x - px, u.y - py);
      const rec = (AILEARN[u.key] = AILEARN[u.key] || {});
      // 躲弹统计也只在「我打 AI」的局里记，而且只算 AI 挨的那一发（人机互殴不算，秋 2026-10-29）
      if (aiRec(u) && !u.pet) {
        rec._dTry = (rec._dTry || 0) + 1;
        if (dd < u.r + 8) rec._dMiss = (rec._dMiss || 0) + 1;
      }
    }
    s._dt = null;
  }

  function spawnShot(from, to, kind, dmg, speed, extra) {
    let ang = Math.atan2(to.y - from.y, to.x - from.x);
    // AI 手感（2026-10-30 秋：可躲率和技能命中率要也会波动）：每只球开局带一点瞄准偏差，时间上再慢慢摆

      if (from._aimDev === undefined) { from._aimDev = (Math.random() - 0.5) * 0.052; from._aimPh = Math.random() * 6.28; }
      ang += from._aimDev + Math.sin(battleTime * 0.85 + from._aimPh) * 0.017;
    }
    const sh = {
      x: from.x, y: from.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      owner: from, kind, style: STYLE[kind] || kind, ang, speed, dmg, life: 3, t: 0, ...(extra || {})
    };
    shots.push(sh);
    if (kind !== 'hookChain' && from && from.side && typeof shotThreat === 'function') {
      sh._sx = from.x; sh._sy = from.y; sh._dt = [];
      for (const u of units) {

        const th = shotThreat(sh, u, 1.6);
        // 口径：留出 0.12 秒反应时间；已经糊脸上的弹不算「能躲没躲开」（2026-10-30）

      }
      if (!sh._dt.length) sh._dt = null;
    }
  }

  const BING_BY_ID = {};

  function bingStart(u, def, foe) {

    const phases = def.phases.map((p) => ({ w: p[0] * mulW, t: p[1] * mulT, side: (p[2] && p[2].side) || 0, hold: !!(p[2] && p[2].hold), cast: !!(p[2] && p[2].cast) }));

    s.used++; s.last = battleTime;

    // 两计之间到底隔了多久（诊断用：看看会不会密到抽风）
    if (u.bfLastT != null) { const gap = battleTime - u.bfLastT; if (gap < BING_GAPMIN) BING_GAPMIN = gap; }
    u.bfLastT = battleTime;
    (u.bfCat || (u.bfCat = {}))[def.cat] = battleTime;   // 同类招的冷却从这次起算
    u.bfLast = battleTime;
    u.bfPlan = {
      id: def.id, cat: def.cat, phases: phases, i: 0, t: 0, castDone: false, foe: foe,
      wantCast: phases.some((ph) => ph.cast),
      base: { diff: (u.hp / u.maxHp) - (foe.hp / foe.maxHp), d: dist(u, foe), mine: friendCount(u), foeWall: bingWallGap(foe) },
    };
  }
  // 一计的胜负口径按类别分开：走位/撤退那类本来就不是为了掉血
  function bingWinCheck(u, j) {
    if (!u.alive) return false;
    const b = j.base || {};
    const foeNow = (j.foe && j.foe.alive) ? (j.foe.hp / j.foe.maxHp) : 0;
    const diff = (u.hp / u.maxHp) - foeNow;
    switch (j.cat) {
      case '撤退': return true;                        // 站着回来就是成了
      case '走位': return diff >= (b.diff || 0) - 0.06; // 没吃亏、阵型没乱
      case '逼墙': return (j.foe && j.foe.alive && bingWallGap(j.foe) + 12 < (b.foeWall == null ? 9999 : b.foeWall)) || diff > (b.diff || 0) + 0.02;
      case '诱敌': return diff > (b.diff || 0) + 0.02 || ((j.foe && j.foe.alive) ? dist(u, j.foe) : 0) < (b.d || 0) - 40;
      case '配合': return friendCount(u) >= (b.mine == null ? 1 : b.mine);
      case '技能': return j.wantCast ? !!j.cast : diff > (b.diff || 0) + 0.02;  // 要放技能的看放没放出来；不要放技能（惜技/断技）就看血差
      default: return diff > (b.diff || 0) + 0.02;      // 时机/心理：还是看血差
    }

  function bingStep(u, foe, dt, human) {
    if (human || !u || !u.alive || !foe || !foe.alive) return;
    // 瞬移球脱身真空期、以及正在用鱼钩拖人的那会儿，一律不插手
    if (u.key === 'tele' && (u.detachT || 0) > 0) { u.bfWant = null; u.bfSide = 0; u.bfHold = false; return; }
    if (foe.drag && foe.drag.src === u) { u.bfWant = null; u.bfSide = 0; u.bfHold = false; return; }
    u.bfCd = (u.bfCd || 0) - dt;
    const p = u.bfPlan;
    if (p) {
      const ph = p.phases[p.i];
      if (!ph) {
        u.bfPlan = null; u.bfWant = null; u.bfSide = 0; u.bfHold = false;
        // 判「成没成」要排队：4 秒之内可能又开下一计，不能互相顶掉
        const q = u.bfJudges || (u.bfJudges = []);
        q.push({ id: p.id, cat: p.cat, at: battleTime + BING_TUNE.judge, base: p.base, foe: p.foe, cast: !!p.everCast, wantCast: !!p.wantCast });
        if (q.length > 10) q.shift();
        u.bfCd = Math.max(BING_TUNE.min, u.bfFresh ? 0.6 : BING_TUNE.cd);
        return;
      }
      p.t += dt;
      u.bfWant = ph.w; u.bfSide = ph.side; u.bfHold = ph.hold;
      if (ph.cast && !p.castDone) { p.castDone = true; p.everCast = true; if (canSpecial(u) && skillInRange(u, foe)) u.forceCast = true; }
      // 阵法词要看得见：起手时给个飘字（只在纯 AI 局说；跟真人打不报兵法名）
      if (p.i === 0 && !p.said) {
        p.said = true;
        if (!bingQuiet()) addFloat(u.x, u.y - u.r - 62, '兵 · ' + BING_BY_ID[p.id].name, '#8a6525', 1.1, 0.9);
      }
      if (p.t >= ph.t) { p.i++; p.t = 0; p.castDone = false; }
      return;
    }
    u.bfWant = null; u.bfSide = 0; u.bfHold = false;
    if (u.bfCd > 0) return;
    if (u.stunT > 0 || (u.hp / u.maxHp) < 0.15) return;
    const c = bingCtx(u, foe);
    const cands = [];
    for (const def of BING_DEFS) {
      let ok = false;
      try { ok = !!def.cond(u, foe, c); } catch (e) { ok = false; }
      if (ok) { cands.push(def); BING_CONDN[def.id] = (BING_CONDN[def.id] || 0) + 1; }
    }
    if (!cands.length) return;

    const quiet = u.bfCat || (u.bfCat = {});

    const pool = fresh2.length ? fresh2 : cands;
    let pick = null;
    // 先补没上过场的（秋要的是「56 条都会用」，这条压过学习偏好）
    const fresh = pool.filter((d) => bingRec(d.id).used === 0);
    if (fresh.length) {
      // 还有没上过场的：优先上「错过就没了」的（p 高：开场抢、断技、卡刀这号）
      let bestP = -1;
      for (const d of fresh) if (d.p > bestP) { bestP = d.p; pick = d; }
      u.bfFresh = true;
    } else {
      // 都会用了，再按学出来的把握挑：练出过便宜的优先，久没用的补一点，防饿死
      // 但练兵阶段（还没练满的）优先补「练得最少」的那条，免得越不会越轮不到
      const need = BING_TUNE.need;
      const unpracticed = pool.filter((d) => (bingPrac(d.id, u.key) || 0) < need);
      if (unpracticed.length) {
        let bestP2 = 1e9;
        for (const d of unpracticed) {
          const n = bingPrac(d.id, u.key) || 0;
          if (n < bestP2) { bestP2 = n; pick = d; }
        }
      } else {
        let best = -1;
        for (const def of pool) {
          const s = bingRec(def.id);
          let score = bingRate(def.id, u.key);
          score += Math.min(0.12, Math.max(0, battleTime - s.last) / 900);
          if (score > best) { best = score; pick = def; }
        }
      }
    }
    if (pick) bingStart(u, pick, foe);
  }

  // 每秒都在结算：一计做完 4 秒了，按它自己的类别看算不算成
  function bingSettleAll() {
    for (const u of units) {
      const q = u && u.bfJudges;
      if (!q || !q.length) continue;
      for (let k = q.length - 1; k >= 0; k--) {
        const j = q[k];
        if (battleTime < j.at) continue;
        q.splice(k, 1);
        const s = bingRec(j.id);
        BING_JUDGED++;
        const won = bingWinCheck(u, j);
        if (won) s.ok++; else s.bad++;
        bingLearnAdd(j.id, u.key, won);
      }
    }
  }

        const hard = (2.6 + D.smart * 5.2) * (0.55 + urge * 1.25) * (1 + DUEL * 0.45) * (1 + grud * 0.55) * trade * (D.smart >= 0.9 ? 1.35 : 1);
        if (D.smart >= 0.9 && (u.mathT || 0) <= 0) {

        const dgx = u.x + (u.dgN === 0 ? -56 : u.dgN === 1 ? 52 : 0);

    }

    // 已经贴墙了：把朝墙的速度分量掐掉，只保留贴着墙滑的那部分

    if (wantS < 0 && (u.x < u.r + wallPad + 30 || u.x > W - u.r - wallPad - 30 || u.y < u.r + wallPad + 30 || u.y > H - u.r - wallPad - 30)) {

    }
    if (u.x < u.r + wallPad && mx < 0) mx = 0;

    if (u.y > H - u.r - wallPad && my > 0) my = 0;
    // ---- 团队协同：先保证不挤成一坨（所有难度），地狱再加兵法 ----
    if (teamBig() && !human) {
      for (const o of units) {
        if (!o || o === u || !o.alive || o.side !== u.side) continue;
        const ddx = u.x - o.x, ddy = u.y - o.y;

      }
      // 分工：肉盾压上、脆皮后撤、队友残血时血多的插到中间去挡
      const mates0 = units.filter((o) => o && o.alive && o.side === u.side);
      const tanky0 = (u.k || 1) <= 0.9;
      const myRatio = u.hp / u.maxHp;

      if (lowAlly && myRatio > lowAlly.hp / lowAlly.maxHp + 0.15) {

      } else if (tanky0) {

      } else if (myRatio < 0.5) {

      }
      if (D.smart >= 0.95) {
        // 包夹：同队按序号错开接近角，别全从正面挤
        const mates = units.filter((o) => o && o.alive && o.side === u.side);
        const idx = mates.indexOf(u);
        const branch = (idx % 2 === 0 ? 1 : -1) * (0.6 + 0.28 * Math.floor(idx / 2));
        mx += -diry * branch * 0.95;
        my += dirx * branch * 0.95;
        // 前后排分工：远程别贴脸，近战往前顶

        else if (u.kind === 'melee' && d > reach) { mx += dirx * 0.55; my += diry * 0.55; }
        // 换人扛：自己残了、队友还满，就往后缩
        const healthier = units.some((o) => o && o.alive && o.side === u.side && o !== u && o.hp > u.hp + 18);
        if (u.hp / u.maxHp < 0.42 && healthier) { mx -= dirx * 1.0; my -= diry * 1.0; }
      }
    }
    // 贴边就往中间走一点，别一直挤到角落
    const edge = Math.min((u.x - 80) / 110, (W - 80 - u.x) / 110, (u.y - 170) / 110, (H - 90 - u.y) / 110);
    if (edge < 1) {
      const pull = (1 - Math.max(0, edge)) * 1.5;

    }
    // ---- 身法（极限版）：16 个方向 + 原地各推演一遍，挑「未来 0.5 秒最安全」的走 ----
    if (D.smart > 0.3) {
      const HZ = 0.5;
      const fake = { x: u.x, y: u.y, r: u.r };
      const wantD = u.kind === 'melee' ? reach * 0.9 : u.range * 0.85;
      // 博弈：一直互相躲、谁也打不着，就慢慢加压逼他来打；通常几分钟内必然分出结果
      // 对面技能攒着的时候不许逼战——这时候往前压等于送人头
      const foeUltCharged = (foe.specialT || 0) <= 0.3 && canSpecial(foe);
      const aggro = aggroW * (foeUltCharged ? 0.25 : 1);
      // 24 个方向：够细，才钻得进两发子弹之间的缝

      const NANG = D.smart >= 0.95 ? 64 : (D.smart >= 0.85 ? 32 : (D.smart >= 0.6 ? 24 : 16));

      cands.push([0, 0]);
      // 决策惯性：上一步定了方向就保持一小会儿，否则会在两个差不多安全的方向上来回横跳
      const pd = u.pickDir, pm = (u.pickT > 0) ? 1 : 0.35;
      // 迫近威胁：0.55 秒内会咬到我的弹 → 这一帧只认「躲」这一件事
      let imminent = null;
      for (const s0 of shots) {
        if (s0.owner === u) continue;
        const g0x = u.x - s0.x, g0y = u.y - s0.y;
        if (g0x * g0x + g0y * g0y > 900 * 900) continue;
        const th0 = shotThreat(s0, u, 0.7);

    }

    if (u.cdT <= 0 && d <= reach && !(foeReflect && !human) && !teleRest && !u.bfHold && !(D.smart >= 0.9 && (u.evading || 0) > 0.2)) {
      u.cdT = u.cd * (human ? 1 : D.cd) * (u.hasteT > 0 ? 0.6 : 1) * (u.bCd || 1);
      u._atkTag = 0.12;                       // 普攻窗口：这 0.12 秒内、非技能造成的伤害算普攻命中
      if (aiRec(u)) { const rr = (AILEARN[u.key] = AILEARN[u.key] || {}); rr._nCast = (rr._nCast || 0) + 1; if ((rr._nHit || 0) > rr._nCast) rr._nHit = rr._nCast; }
      if (!human && (foe.range + foe.r - u.range - u.r) > 40) u.kiteT = 0.30;   // 手短的：挠一下就走

        const kb = human
          ? (u.side === 'A'
            ? (keys['a'] ? -1 : 0) + (keys['d'] ? 1 : 0)
            : (keys['arrowleft'] ? -1 : 0) + (keys['arrowright'] ? 1 : 0))
          : 0;
        const swing = kb * 1.15;             // 最多左右各挪 66°
        const base = Math.atan2(ay, ax) + swing;
        const nx2 = foe.x + Math.cos(base) * (foe.r + u.r + 4);
        const ny2 = foe.y + Math.sin(base) * (foe.r + u.r + 4);
        addRipple(u.x, u.y, 'pulse', '#3c7fa8');
        u.x = clamp(nx2, u.r + 10, W - u.r - 10);
        u.y = clamp(ny2, u.r + 10, H - u.r - 10);
        u.pickDir = null; u.pickT = 0; u.pickLock = 0;

        addRing(u.x, u.y, '#3c7fa8', u.r * 0.8, u.r * 1.5, 0.18);

        u.hits = (u.hits || 0) + 1;
        if (u.hits >= 40) {
          const ax2 = u.x - foe.x, ay2 = u.y - foe.y, al2 = Math.hypot(ax2, ay2) || 1;

          addRipple(u.x, u.y, 'pulse', '#3c7fa8');

          u.hits = 0;

      } else if (u.key === 'postman') {

              const ay = foe.y + (foe.vyEst || 0) * t1;

            ty = foe.y + (foe.vyEst || 0) * t1;
          } else {

            ty += (foe.vyEst || 0) * fl;
          }
          tx = clamp(tx, foe.r + 6, W - foe.r - 6);
          ty = clamp(ty, foe.r + 6, H - foe.r - 6);
        }
        spawnShot(u, { x: tx, y: ty }, u.key, dmg, SHOT_SPEED[u.key] || 620,
          u.key === 'plasma' ? { crit: isCrit, burn: 4 } : { crit: isCrit });
      }
    }

    // ---- 技能：不再有就放，先问一句「这一手现在值不值」 ----
    u.specialT -= dt;
    if (u.specialT <= 0) {
      if (human) {
        u.specialT = 0;
      u.mathT = Math.random() * 3;
      u.barkT = 1 + Math.random() * 5;            // 人控侧：技能攒好了，等你自己点
      } else if (!canSpecial(u)) {
        u.specialT = 0.35;         // 鱼线还在飞：等它收回来，别白扣一次冷却
      } else {
        const foeR = foe.hp / foe.maxHp;
        const dNow = dist(u, foe);
        let use;
        const outOfReach = dNow > (u.range + u.r + foe.r * 0.9);
        if (u.forceCast && skillInRange(u, foe)) {
          u.forceCast = false; u.counterT = 1.2;
          use = true;                                   // 反制：对面抬手就打回去
        } else if (!human && outOfReach && skillInRange(u, foe) && skillWorth(u, foe)) {
          use = true;                                  // 普攻打不着，但技能够得着 → 纯技能输出
        } else if (skillTrust(u) < 0.35 && !(foe.stunT > 0.05 || foe.hp < foe.maxHp * 0.42)) {
          use = false;            // 自己技能命中率低 → 只等稳的：对面硬直 / 残血才出手
          if (!u.trustSayT || battleTime - u.trustSayT > 8) {
            u.trustSayT = battleTime;
            if (Math.random() < 0.4) say(u.name + ' 知道自己技能老空，先攒着');
          }
        } else if (Math.random() >= D.smart) {
          use = skillInRange(u, foe) || Math.random() < 0.3;   // 低难度爱乱放，但至少别对着空气
        } else {
          use = (skillWorth(u, foe) || (foeR < 0.35 && dNow < 340)
            || ((foe.stunT > 0.2 || foe.slowT > 0.25 || foe.drag) && dNow < u.range + 140))
            && skillInRange(u, foe)
            && !(foe.key === 'shield' && (foe.wallT || 0) > 0);
        }
        // 猜他要放技能 → 自己的大招先留着对拼，别提前倒空
        if (use && !human && u.holdUlt && foeR > 0.42 && !(foe.stunT > 0.35 || foe.drag)) use = false;
        if (use) {
          u.specialT = specialCD(u) * D.cd;
          u.holdT = 0;
          if (window.__castLog) window.__castLog.push({
            k: u.key, t: Math.round(now() * 10) / 10,
            hp: Math.round((u.hp / u.maxHp) * 100), d: Math.round(dNow)
          });
          if (!u.holdSkill && teamCastOk(u, foe)) { special(u, foe); u.kiteT = 0.35; }
          else { u.specialT = 0.3; u.holdT = 0; }
        } else if (!skillInRange(u, foe)) {
          u.holdT = Math.max(0, (u.holdT || 0) - 0.2);   // 够不着就继续憋
        } else if ((u.holdT = (u.holdT || 0) + 0.45) > (5.2 - D.smart * 2.4)) {
          // 憋太久了，找个空当放掉，别浪费整条冷却
          // 例外：拳击手的冲拳够不着就没必要放，继续追着人跑
          const boxTooFar = u.key === 'boxer' && dist(u, foe) > u.range + u.r + foe.r * 0.9 + 10;
          if (boxTooFar) { u.holdT = 0; u.specialT = 0.3; return; }
          u.holdT = 0;
          u.specialT = specialCD(u) * D.cd;
          if (window.__castLog) window.__castLog.push({ k: u.key, t: Math.round(now() * 10) / 10, hp: -1, d: Math.round(dist(u, foe)), force: 1 });
          if (!u.holdSkill && teamCastOk(u, foe)) special(u, foe);
          else { u.specialT = 0.3; u.holdT = 0; }
        } else {
          u.specialT = 0.4;                            // 再等一拍
        }
      }
    }
  }

  function specialCD(u) {
    switch (u.key) {
      case 'vamp': return 6.5;
      case 'hook': return 1.5;
      case 'boxer': return 3.6;
      case 'ice': return 6.0;
      case 'shield': return 12.0;
      case 'bee': return 5.0;
      case 'herb': return 6.5;
      case 'thunder': return 6.0;
      case 'gargoyle': return 7.0;
      case 'ranger': return 5.2;
      case 'spinner': return 4.6;
      case 'gambler': return 8.0;
      case 'trapper': return 6.5;
      case 'chrono': return 8.0;
      case 'plasma': return 11.0;
      case 'fatfish': return 8.5;
      // 瞬移球：没锚点先留锚（0.45 秒后就能再按，真空期留个 2.5 秒别一直插旗）；缠斗中按不出来（0.5 重试）；
      // 脱身真空期正是该回锚的时候，给 0.3 秒好让 AI 立刻用；闲时 7 秒
      case 'witch': return 13.0;
    case 'pendulum': return 10.0;
    case 'postman': return 9.5;
    case 'lamp': return 11.0;
    case 'shadow': return 9.0;
      case 'tele': return !u.anchor ? ((u.detachT || 0) > 0 ? 2.5 : 0.45) : ((u.hits || 0) > 0 ? 0.5 : ((u.detachT || 0) > 0 ? 0.3 : 7.0));
      default: return 6;
    }
  }

  function skillTrust(u) {
    try {
      const row = AILEARN[u.key] || {};
      const cs = row._sCast || 0, hs = row._sHit || 0;
      if (cs < 12) return 0.5;                 // 样本不够，按中性处理
      return Math.max(0.05, Math.min(1, hs / cs));
    } catch (e) { return 0.5; }
  }

  function canSpecial(u) {
    // 鱼钩同时只能存在一条线；线还在飞就先别放
    // 鱼钩的线是无限的，不会自己断；再抛时会把旧线收回，所以不拦
    return true;
  }

  // ---------- 人机博弈：这一手技能现在值不值得交 ----------
  function incomingThreat(u) {
    let n = 0, near = 999;
    for (const s of shots) {
      if (s.owner === u) continue;
      const dx = u.x - s.x, dy = u.y - s.y;
      const dd = Math.hypot(dx, dy);
      if (dd > 320) continue;
      if (dx * s.vx + dy * s.vy <= 0) continue;   // 背对着我飞走的，不算
      n++;
      if (dd < near) near = dd;
    }
    return { n, near };
  }

  // 预演一颗弹往后飞（含撞墙反弹），看它最近会从离我多近的地方过；不构成威胁就返回 null
  function shotThreat(s, u, horizon) {
    let x = s.x, y = s.y, vx = s.vx, vy = s.vy;
    let bounce = s.ricochet || 0;
    const hitR = u.r + 8, hitR2 = hitR * hitR;
    const ST = 1 / 26;                 // 步长放粗一点：每帧要算十几发，精度用不着那么高
    let best2 = Infinity, bestT = 0;
    for (let t = 0; t < horizon; t += ST) {
      x += vx * ST; y += vy * ST;
      let bd = false;
      if (x < 10 && vx < 0) { x = 10; vx = -vx; bd = true; }
      else if (x > W - 10 && vx > 0) { x = W - 10; vx = -vx; bd = true; }
      if (y < 10 && vy < 0) { y = 10; vy = -vy; bd = true; }
      else if (y > H - 10 && vy > 0) { y = H - 10; vy = -vy; bd = true; }
      if (bd) {
        if (bounce <= 0) break;        // 这发不反弹，撞墙就没了
        bounce--;
      }
      const dx = u.x - x, dy = u.y - y, dd2 = dx * dx + dy * dy;
      if (dd2 < best2) { best2 = dd2; bestT = t; }
      if (dd2 < hitR2) break;          // 已经算到会打中，别再往下推
    }
    const warn = hitR + 16;
    return best2 <= warn * warn ? { miss: Math.sqrt(best2), t: bestT } : null;
  }

  // 技能的实际作用距离：用来拦住「对着空气放大招」
  function skillInRange(u, foe) {
    const d = dist(u, foe);
    switch (u.key) {
      case 'gargoyle': return d < u.r * 4.4 + foe.r;
      case 'spinner':  return d < 240;
      case 'fatfish':  return d < 210;
      case 'train':    return d < 430;
      case 'ice':      return d < 310;
      case 'thunder':  return d < 330;
      case 'bee':      return d < 390;
      case 'ranger':   return d < 440;
      case 'plasma':   return d < 540;
      case 'boxer':    return d < 300;
      case 'gambler':  return d < 310;
      case 'herb':     return d < 330;
      case 'hook':     return true;
      case 'trapper':  return true;
      case 'chrono':   return true;
      case 'witch':    return d < 360;
    case 'pendulum': return d < 230;
    case 'postman':  return d < 340;
    case 'lamp':     return d < 330;
    case 'shadow':   return d < 260;
      case 'vamp':     return true;
      case 'shield':   return true;
      default:         return d < 320;
    }
  }

  // 团队施法节奏：队友 1.6 秒内会好就攒着一起开；能收人头或者对面已经残就立刻开
  function teamCastOk(u, foe) {
    if (!teamBig() || !foe) return true;
    const foes = units.filter((o) => o && o.alive && o.side !== u.side);
    const allies = units.filter((o) => o && o.alive && o.side === u.side && o !== u);
    if (foes.some((o) => o.hp / o.maxHp < 0.45)) return true;          // 现在开就能收
    const canFinish = foe.hp <= (u.atk * 3 + 24);
    if (canFinish) return true;                                        // 一发带走，别等
    // 队友 1.6 秒内就好 → 攒一波；但最多等 1.1 秒，免得三个人互相等成哑巴
    if (u.syncUsed) return true;   // 一局只攒一次，别三个人互相等成哑巴
    const soon = allies.filter((a) => a.specialT > 0.05 && a.specialT < 0.9);
    if (soon.length) {
      if (!u.syncStart) u.syncStart = now();
      if (now() - u.syncStart < 0.5) {
        if ((u.syncT || 0) <= 0) {
          u.syncT = 4.0;
          addFloat(u.x, u.y - u.r - 74, '等队友 · 攒一波', '#5a7a3f', 1.3, 1.02);
        }
        return false;
      }
    }
    u.syncStart = 0;
    u.syncUsed = 1;
    return true;
  }
  function skillWorth(u, foe) {
    // 对面盾墙反伤开着，远程一发就是给自己放血：等它过去再说
    if (u.key !== 'shield' && foe.key === 'shield' && (foe.wallT || 0) > 0) return false;
    // 远程角色贴脸放大招 = 全吃反弹，拉开再放
    if (u.range > 200 && dist(u, foe) < 130) return false;
    const d = dist(u, foe);
    const hpR = u.hp / u.maxHp;
    const foeR = foe.hp / foe.maxHp;
    const th = incomingThreat(u);
    const foeHot = foe.specialT <= 0.2;         // 对面技能马上要落我头上了
    const foeWeak = foeR < 0.35 || foe.stunT > 0.15 || foe.slowT > 0.3;
    switch (u.key) {
      case 'hook':
        // 鱼钩是拉人，线不够长就白扔：贴身时先拉开再说
        return d > 150 || foeWeak;
      case 'vamp':
        // 雾隐是保命牌，不是输出：被贴脸 / 对面技能好了 / 子弹到脸前才交
        return hpR < 0.55 || (foeHot && d < 260) || th.near < 90;
      case 'boxer':
        // 冲拳只能贴脸：够不着就别交，空挥白扣冷却
        return d < u.range + u.r + foe.r * 0.9 + 10;
      case 'ice':
        // 霜环必须贴身命中才减速，站远了纯倒数
        return d < u.r * 3.0 || (foeWeak && d < 130);
      case 'shield':
        // 盾墙是反伤骗招：等对面打上来才开，空放等于没开
        return th.n >= 1 || (foeHot && d < 150) || (hpR < 0.45 && d < 200);
      case 'bee':
        return d < 380 && d > 60;
      case 'ranger':
        // 箭雨扇形散得开：太近全从头飞到脚，太远只剩几支能摸到
        return d > 110 && d < 430;
      case 'thunder':
        // 落雷是硬直，对面在射程里就该劈
        return d < u.range + 80 || foeWeak;
      case 'gargoyle':
        return d < u.r * 3.2 + foe.r;
      case 'spinner':
        // 旋击是突进，够得着才突，不然突进送人头
        return d < 210;
      case 'gambler':
        // 期望值正，但 1-2 点会反噬：血少了就不赌
        return hpR > 0.4 && d < 300;
      case 'trapper':
        // 布雷是埋给人踩的：对面追上来或离得远才有意义
        return d > 110 || foe.kind === 'melee';
      case 'chrono':
        // 回档要「亏了才回」，血还满的时候就是浪费
        return hpR < 0.8 || (u.hist && u.hist.length > 8 &&
          u.hp < u.hist[u.hist.length - 8].hp - 12);
      case 'plasma':
        // 过载是射程内的重炮：对面进圈、自己血还够，就开
        return d < u.range + 60 && hpR > 0.22;
      case 'herb':
        // 灵雨别在满血时交；被中毒/减速压着的时候优先
        return hpR < 0.72 || (u.poisonT > 0.5 && hpR < 0.9) || (u.slowT > 0.5 && hpR < 0.85);
      default:
        return true;
    }
  }

  function meleeHit(u, foe, dmg, isCrit) {
    // 拳击手三连击
    if (u.key === 'boxer') {
      let total = 0;
      for (let i = 0; i < 3; i++) {
        const dd = Math.round(dmg * 0.85);
        total += dd;
        setTimeout(() => {
          if (!u.alive || !foe.alive) return;
          hurt(foe, dd, u);
          addParts(foe.x - 20, foe.y - 20, u.color, 3);
        }, i * 110);
      }
      if (Math.random() < 0.5) {
        setTimeout(() => { if (foe.alive) { foe.stunT = 0.5; addFloat(foe.x, foe.y - foe.r - 56, '硬直', '#3c4650', .8, .9); } }, 380);
      }
      addFloat(u.x, u.y - u.r - 56, '连击', '#2f4f8f', .7, .85);
      addSwing(u, foe);
      return;
    }
    const real = hurt(foe, dmg, u) || 0;
    addSwing(u, foe);
    u.backT = 0.34;
    addParts((u.x + foe.x) / 2, (u.y + foe.y) / 2, u.color, 5);
    shake = Math.max(shake, u.key === 'shield' ? 4 : 7);

    // 吸血鬼：打血照常回血；打盾只吸一半，而且吸来的是自己的护盾（不是血）
    const absorbed = foe.lastAbsorb || 0;
    if (u.key === 'vamp') {
      // 嗜血：血越少吸得越凶（满血 1.0 倍，残血最多 2.2 倍）
      const rage = 1 + (1 - u.hp / u.maxHp) * 1.2;
      if (real > 0) {
        const back = Math.round(real * rage);
        heal(u, back);
        // 血祭（吸血鬼 + 药师）：吸到的血分 35% 给药师
        if (teamBig()) for (const o of units) {
          if (o && o.alive && o !== u && o.side === u.side && o.key === 'herb') {
            heal(o, Math.round(back * 0.35));
            if (Math.random() < 0.3) addFloat(o.x, o.y - o.r - 40, '血祭 +' + Math.round(back * 0.35), '#8c1b2b', .8, .9);
          }
        }
        if (rage > 1.35) addFloat(u.x, u.y - u.r - 34, '嗜血 ×' + rage.toFixed(1), '#8c1b2b', .7, .8);
      }
      if (absorbed > 0) {
        const gain = Math.round(absorbed * 0.5);
        if (gain > 0) {
          u.shield = (u.shield || 0) + gain;      // 不封顶：吸多少攒多少
          addFloat(foe.x, foe.y + foe.r * .8, '吸盾 +' + gain, '#8c1b2b', .75, .9);
        }
      }
    }
    if (isCrit) addFloat(foe.x, foe.y - foe.r - 26, '暴击!', '#d9822b', .8, 1);
  }

  function special(u, foe) {
    // 谁放的什么技能，影子要抄
    u.lastSkillKey = u.key; u.lastSkillT = battleTime;
  try {
    // 出手/命中统计只记「AI 在 p1 局里放的技能」；真人自己放的不算（真人只会把命中率拉低）
    if (aiRec(u)) {
      const row = AILEARN[u.key] || (AILEARN[u.key] = {});
      row._sCast = (row._sCast || 0) + 1;
      // 有些技能本来就不打人（回血、挡刀、回档），不能算「没命中」——效果出来就算生效
      if (SKILL_SELF_BUFF[u.key]) { row._sHit = (row._sHit || 0) + 1; }
      if (row._sCast % 25 === 0) aiLearnSave();
    }
    u.castAt = battleTime; u.castHit = 0;
    mindCast(u);
    if (SKILL_SELF_BUFF[u.key]) u.castHit = 1;
  } catch (e) {}
    u.castTag = u.tag; u.castTagT = battleTime;
    // 只有「你在打」（不是 AI）才记样本：这个角色你习惯在多远放技能
    if (!u.isAI && foe) {
      const e = learn[u.key] || (learn[u.key] = { n: 0, dSum: 0 });
      e.n++; e.dSum += Math.hypot(foe.x - u.x, foe.y - u.y);
      try { localStorage.setItem('dfy_learn_v2', JSON.stringify(learn)); } catch (err) {}
    }   // 战报里显示「用【抛钩】击败」
    if (u.key === 'lamp') {
      // 照破：脚下点亮大灯
      u.specialT = specialCD(u);
      lampLight(u, u.x, u.y, 300, 6.0, 3.6, 4);
      // 光爆：照亮的一瞬间，圈里的对手各挨一下
      let burst = 0;
      for (const o of units) {
        if (!o || !o.alive || o.pet || o.side === u.side) continue;
        if (Math.hypot(o.x - u.x, o.y - u.y) > 300 + o.r) continue;
        hurt(o, 12, u, null, true);
        addParts(o.x, o.y, '#ffd870', 8);
        burst++;
      }
      addFloat(u.x, u.y - u.r - 30, burst ? '照破 · 光爆 ' + burst + ' 人' : '照破', '#b8860b', 1.1, 1.2);
      addRing(u.x, u.y, '#ffd870', u.r * .6, 300, .6);
      addParts(u.x, u.y, '#ffd870', 18);
      window.__lampBurst = (window.__lampBurst || 0) + burst;
      return;
    }
    if (u.key === 'shadow') {
      u.specialT = specialCD(u);
      const src = foe && foe.lastSkillKey;
      addParts(u.x, u.y, '#3b3f52', 16);
      if (src && src !== 'shadow' && src !== 'ghost' && TYPES[src]) {
        // 抄：把对方那个技能原样放一遍
        const save = u.key;
        u.key = src;
        try { special(u, foe); } catch (e) { }
        u.key = save;
        addFloat(u.x, u.y - u.r - 30, '抄 · ' + (TYPES[src].skill || TYPES[src].name), '#3b3f52', 1.1, 1.2);
        window.__copyN = (window.__copyN || 0) + 1;
      } else if (foe) {
        // 没得抄：突进强打
        const a = Math.atan2(foe.y - u.y, foe.x - u.x);
        u.x = clamp(foe.x - Math.cos(a) * (foe.r + u.r + 6), 20, W - 20);
        u.y = clamp(foe.y - Math.sin(a) * (foe.r + u.r + 6), 20, H - 20);
        hurt(foe, 6, u, null, true);
        addSwing(u, foe);
        addFloat(u.x, u.y - u.r - 26, '突进', '#3b3f52', .8, 1);
      }
      // 放完反向闪开
      if (foe) {
        const a2 = Math.atan2(u.y - foe.y, u.x - foe.x);
        u.x = clamp(u.x + Math.cos(a2) * 120, 20, W - 20);
        u.y = clamp(u.y + Math.sin(a2) * 120, 20, H - 20);
        addRing(u.x, u.y, '#3b3f52', 4, 40, .3);
      }
      return;
    }
    if (u.key === 'pendulum') {
      let mates = 0;
      for (const o of units) if (o && o.alive && !o.pet && o.side === u.side && o.key === 'pendulum') mates++;
      const bond = mates >= 2;
      const R = bond ? 190 : 160;
      const push = bond ? 170 : 150;
      addRing(u.x, u.y, '#a98fd6', u.r * .6, R, .5);
      addRipple(u.x, u.y, '#cbb7ee', 10, R, .5);
      later(0.07, () => { addRipple(u.x, u.y, '#cbb7ee', u.r * .8, R * 1.18, .4); });
      later(0.14, () => { addRipple(u.x, u.y, '#a98fd6', u.r * .9, R * 1.35, .42); });
      later(0.2, () => { addRing(u.x, u.y, '#e6dcff', R * .6, R * 1.25, .3); });
      shake = Math.max(shake, 9);
      hitStop = Math.max(hitStop, 0.1 / (speedMul || 1));
      punch = Math.max(punch, 1.3);
      window.__sweepN = (window.__sweepN || 0) + 1;
      for (const o of units) {
        if (!o || !o.alive || o.pet || o.side === u.side) continue;
        if (Math.hypot(o.x - u.x, o.y - u.y) > R + o.r) continue;
        hurt(o, 34, u, null, true);
        addSpray(o.x, o.y, '#a98fd6', 16, 320);
        addParts(o.x, o.y, '#ffffff', 6);
        const ang = Math.atan2(o.y - u.y, o.x - u.x);
        o.x = clamp(o.x + Math.cos(ang) * push, o.r + 6, W - o.r - 6);
        o.y = clamp(o.y + Math.sin(ang) * push, o.r + 6, H - o.r - 6);

        addFloat(o.x, o.y - o.r - 40, '横扫', '#7a5bb0', .9, 1);
      }
      if (bond) { bondSay(u, 'bond_pendulum'); window.__pendBond = (window.__pendBond || 0) + 1; }
      return;
    }
    if (u.key === 'postman') {
      postmanParcel(u, foe, Math.round(u.atk * (u.k || 1)), true);
      return;
    }
    if (u.key === 'witch') {
      let mates = 0;
      for (const o of units) if (o && o.alive && !o.pet && o.side === u.side && o.key === 'witch') mates++;
      const bond = mates >= 2;
      const n = 5 + (bond ? 1 : 0);
      for (let i = 0; i < n; i++) {
        const g = makeGhost(u);

    if (u.key === 'tele') {

        addFloat(u.x, u.y - u.r - 20, '还缠着呢，脱不了身', '#8c5a2b', .9, 1);
      } else {
        const ax = u.anchor.x, ay = u.anchor.y;

        if (teamBig()) {

            if (o && o.alive && o.side === u.side && o.key === 'train' && (o.trainStk || 0) < 6) {

    }
    // 起手（全角色统一，向雷公看齐）：三层光环 + 闪光 + 一圈向外炸开的粒子 + 轻微震屏
    addRing(u.x, u.y, u.color || '#3c4650', u.r * .55, u.r * 2.6, .5);

    addRing(u.x, u.y, 'rgba(255,255,255,.85)', u.r * .15, u.r * 1.1, .22);

    addSpray(u.x, u.y, '#ffffff', 18, 300);
    addImplode(u.x, u.y, u.color || '#3c4650', 26, u.r * 3.4, 0.28);

    punch = Math.max(punch, 0.55);
    shake = Math.max(shake, 3.9);
    // 技能键闪一下，手感和画面对得上
    const skEl = u.side === 'A' ? skA : skB;
    if (skEl) {
      skEl.classList.add('cast');
      setTimeout(() => skEl.classList.remove('cast'), 260);
    }

    // ================= 技能伤害速查（实际值，已经算过 k） =================
    //  吸血鬼·雾隐    无伤害｜1.5 秒内所有攻击判定为闪避
    //  鱼钩·抛钩      钩中不掉血｜拖回总伤 = (10 + 线长×0.015) × 倍率，不吃 k
    //                 线长 1000 ≈ 13 点，线长 4300 ≈ 86 点
    //  拳击手·冲拳    36 表面 × k0.45 = 16 点
    //  冰法师·霜环    34 × k0.36 = 12 点 + 减速3.5s + 冻结0.9s；顺带 6 根冰锥每根 3 点
    //                 被动霜爆 30 × k0.36 = 11 点
    //  钢盾·盾墙      无伤害｜6 秒内把吃到的伤害原样反弹
    //  毒蜂·群刺      三根，每根 9 × k0.313 = 3 点 + 中毒
    //  游侠·箭雨      15 支，每支 4 表面 × k0.5 = 2 点（全中 30）｜可撞墙反弹一次
    //  雷公·天罚      连劈三道，每道 22 × k0.32 = 7 点（共 21）+ 最后一道硬直 1 秒

    //  石像鬼·崩地    34 × k0.26 = 9 点 + 击退110 + 硬直0.8s；余震三下每下 2 点
    //  陀螺·旋风突进  24 表面 × k0.52 = 13 点 + 击退 100
    //  赌徒·梭哈      k=1 全吃：1-2 自伤12｜3-4 打22｜5 打36 + 击退46｜6 打52 + 回25血
    //  陷阱师·布雷    撒三颗，踩上一颗 45 点（固定伤害，不吃 k）
    //  回溯者·回档    无伤害｜自己血量/位置回到 10 秒前
    //  药师·灵雨      无伤害｜回 25 血 + 清减速/中毒/硬直
    // =====================================================================
    switch (u.key) {
      case 'vamp': {
        u.mistT = 2.2;
        addFloat(u.x, u.y - u.r - 62, '血鬼术·雾隐', '#8c1b2b', 1.1, 1);

      case 'hook': {
        // 抛钩：飞出去撞墙反弹，一路记着走过的路；碰到敌人就钩住，
        // 拽着它沿着这条路径倒着走回来，拖行期间一直掉血
        // 鱼钩只能有一条：线还在飞、或者还拖着人，都不许再抛（不提示，省得看着像限制条数）
        const mine = shots.filter(s2 => s2.owner === u && s2.kind === 'hookChain').length;
        const dragging = !!(foe.drag && foe.drag.src === u);
        if (dragging) break;
        const flying = shots.find(s2 => s2.owner === u && s2.kind === 'hookChain');
        // 主动收线：线还在飞就再按一次 Q，把它拽回来（回程一路都是判定）
        // 人机稍微等一会儿再收，不然线还没甩开就往回拽
        if (flying && !flying.retract && battleTime - (flying.bornAt || 0) >= 0.45 && (!u.isAI || hookShouldReel(u, flying, foe))) {
          flying.retract = 1; flying.vx = 0; flying.vy = 0;
          // 沿着走过的路倒着收回去，整条线 1 秒收完（线越长收得越快）
          flying.retSp = Math.max(120, pathLen(flying.pts) / 1.0);
          flying.retT = 0;
          addFloat(u.x, u.y - u.r - 56, '收线', '#2e8b8b', .9, 1);
          addRing(flying.x, flying.y, '#2e8b8b', 6, 46, .3);
          break;
        }
        if (mine < 1 && !dragging) {
          // 别直着糊脸：先往斜后方甩出去，撞一两下墙再绕回来
          const toFoe = Math.atan2(foe.y - u.y, foe.x - u.x);
          const sgn = Math.random() < 0.5 ? 1 : -1;
          const ang = toFoe + sgn * (Math.PI * 0.62 + Math.random() * Math.PI * 0.42);
          shots.push({
            x: u.x, y: u.y, vx: Math.cos(ang) * 640, vy: Math.sin(ang) * 640,
            owner: u, kind: 'hookChain', dmg: 16, life: teamBig() ? 5.5 : Infinity, t: 0,   // 多人局给线一个寿命，不然满屏都是线
            bornAt: battleTime,
            pts: [{ x: u.x, y: u.y }], bounces: 0, rec: 0

          addFloat(u.x, u.y - u.r - 56, '抛钩', '#2e8b8b', .9, 1);

      case 'boxer': {

        if (d > boxReach && d <= boxReach + 84) {

          u.y = clamp(u.y + uy * step, u.r + 6, H - u.r - 6);

          addFloat(u.x, u.y - u.r - 16, '拳打空了', '#8a939c', .7, .9);
          addParts(u.x + ux * 46, u.y + uy * 46, '#cfd6dc', 8);
          addSwing(u, foe);
          break;

        addFloat(u.x, u.y - u.r - 16, '冲拳', '#2f4f8f', .8, .95);
        hurt(foe, u.atk * 3.0, u);
        addParts(foe.x, foe.y, '#2f4f8f', 16);
        addRing(foe.x, foe.y, '#2f4f8f', 10, 62, .35);
        shake = Math.max(shake, 2.2);

      case 'ice': {

        addRing(u.x, u.y, '#3b6ea5', u.r * .8, u.r * 4.2, .8);
        addRing(u.x, u.y, '#9fd8ff', u.r * .4, u.r * 2.6, .6);
        addParts(u.x, u.y, '#bfe9ff', 22);
        shake = Math.max(shake, 3.3);
        const d = dist(u, foe);
        if (d < u.r * 4.2 + foe.r) {

          foe.slowT = 3.5;
          foe.stunT = Math.max(foe.stunT, 0.9);

          shots.push({
            x: u.x, y: u.y, vx: Math.cos(ang) * 620, vy: Math.sin(ang) * 620,

          });

        break;
      }
      case 'shield': {
        addFloat(u.x, u.y - u.r - 16, '盾墙 · 反弹所有伤害 6秒', '#5b5b66', .9, 1);
        u.wallT = 6;

      case 'bee': {

          });

        shake = Math.max(shake, 2.2);
        break;
      }
      case 'ranger': {
        // 箭雨：一大片散箭，单支伤害压低，撞墙还能弹一次
        addFloat(u.x, u.y - u.r - 16, '箭雨 ×15', '#7a5c2f', .9, 1);
        const base = Math.atan2(foe.y - u.y, foe.x - u.x);
        for (let i = 0; i < 15; i++) {
          const ang = base + (i - 7) * 0.048 + rand(-0.012, 0.012);
          const spd = 620 + rand(-40, 40);
          shots.push({
            x: u.x, y: u.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            owner: u, kind: 'ranger', style: 'arrow', ang, dmg: u.atk * 0.4, life: 2.8, t: 0, ricochet: 1, sk: 1
          });
        }
        break;
      }
      case 'thunder': {
        // 天罚：先抬手 0.45 秒——落点先亮个圈，对面挪开就能躲（必中技也得给人反应的机会）
        addFloat(u.x, u.y - u.r - 56, '天罚·抬手', '#6a4fa5', 1, 1.1);

        u.rainTagT = battleTime;
        u.rainTag = (u.rainTag || 0) + 1;
        boltTo(u, foe, '#6a4fa5');
        later(0.45, () => {

            later(i * 0.22, () => {
              if (!u.alive || !foe.alive) return;
              const off = Math.hypot(foe.x - tx0, foe.y - ty0);

            });

        });

      case 'plasma': {

        addFloat(u.x, u.y - u.r - 58, '过载·蓄能', '#2f7fd6', 1.05, 1.2);

        u.aimAng = Math.atan2(foe.y - u.y, foe.x - u.x);

          addRing(u.x, u.y, '#ffffff', u.r * .4, u.r * 2.4, .35);
          addRing(u.x, u.y, hexA('#2f7fd6', .5), u.r * 1.6, u.r * 6.4, .7);

          addLineSparks(u.x, u.y, u.x + Math.cos(aim) * 1200, u.y + Math.sin(aim) * 1200, '#bfe9ff', 46, 260);
          addLineSparks(u.x, u.y, u.x + Math.cos(aim) * 1200, u.y + Math.sin(aim) * 1200, '#ffffff', 20, 340);
          shake = Math.max(shake, 8.8);
          punch = Math.max(punch, 1.1);
          hitStop = Math.max(hitStop, 0.07 / (speedMul || 1));
          // 命中判定：对手离光束中线的距离 < 他半径 + 半束宽
          const nx = -Math.sin(aim), ny = Math.cos(aim);
          const off = Math.abs((foe.x - u.x) * nx + (foe.y - u.y) * ny);
          const fwd = (foe.x - u.x) * Math.cos(aim) + (foe.y - u.y) * Math.sin(aim);
          if (off < foe.r + beamW * 0.5 && fwd > 0) {
            window.__beam = window.__beam || { hit: 0, miss: 0 };
            window.__beam.hit++;
            hurt(foe, 38, u, null, true);   // raw：光束伤害固定 38，不再被 k 缩放
            foe.burn = Math.max(foe.burn || 0, 8);
            foe.burnT = Math.max(foe.burnT || 0, 4);
            foe.burnSrc = u;
            addSpray(foe.x, foe.y, '#eafaff', 34, 560);
            addRing(foe.x, foe.y, '#6fd0ff', foe.r * .4, foe.r * 3.4, .5);
            addFloat(foe.x, foe.y - foe.r - 66, '贯穿', '#2f7fd6', 1, 1.2);
            shake = Math.max(shake, 9.9);
          } else if (foe.alive) {
            window.__beam = window.__beam || { hit: 0, miss: 0 };
            window.__beam.miss++;
            addFloat(foe.x, foe.y - foe.r - 40, '擦过去了', '#8a94a0', .8, .9);
          }
        });
        break;
      }
      case 'gargoyle': {

        addFloat(u.x, u.y - u.r - 56, '崩地', '#4a4f57', 1, 1.2);
        addRing(u.x, u.y, '#4a4f57', u.r * .7, u.r * 4.4, .7);
        addRing(u.x, u.y, '#9aa2ab', u.r * .5, u.r * 3.2, .55);
        addParts(u.x, u.y, '#7b828a', 26);
        shake = Math.max(shake, 6.6);
        if (dist(u, foe) < u.r * 4.4 + foe.r) {
          hurt(foe, 34, u);
          const ang = Math.atan2(foe.y - u.y, foe.x - u.x);
          foe.x = clamp(foe.x + Math.cos(ang) * 110 * pushMul(foe), foe.r + 6, W - foe.r - 6);
          foe.y = clamp(foe.y + Math.sin(ang) * 110 * pushMul(foe), foe.r + 6, H - foe.r - 6);
          foe.stunT = Math.max(foe.stunT, 0.8);
          addParts(foe.x, foe.y, '#4a4f57', 14);
        }
        // 余震：接下来 1.8 秒里再震三下，范围内减速
        for (let i = 1; i <= 3; i++) {
          later(i * 0.6, () => {
            if (!u.alive || !foe.alive) return;

      case 'spinner': {

      // 砸进水面：水柱往上冲、两侧溅珠、涟漪一层套一层

        addFloat(u.x, u.y - u.r - 16, '灵雨', '#3f7f4f', .9, 1);
