<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生重开模拟器 · 修仙版</title>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#33405e transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f3b57;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#42527a;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 620px at 50% -8%,#1b2440 0%,#0b0f1a 55%),#0b0f1a;color:#e6ecf8;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1{margin:0}
.step.hide{display:none}
.card{background:linear-gradient(180deg,rgba(24,32,50,.96),rgba(17,23,36,.96));border:1px solid #26314b;border-radius:16px;
  padding:16px 20px;margin-bottom:16px;box-shadow:0 16px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.03)}
.row{display:flex;align-items:center;gap:14px;min-height:48px;padding:9px 0;font-size:13.8px;border-bottom:1px dashed rgba(46,58,86,.6)}
.row:last-child{border-bottom:none}
.nm{min-width:80px;color:#b6c4de;letter-spacing:.5px}
.q{flex:1;color:#7f8ead;font-size:12.5px;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 14px;
  background:linear-gradient(180deg,#232e46,#1a2336);border:1px solid #33405e;color:#d7e3f9;border-radius:10px;
  cursor:pointer;font-size:13px;line-height:1;transition:all .14s ease;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.btn:hover{background:linear-gradient(180deg,#2b3852,#212b41);border-color:#42527a;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn[disabled],.primary[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.25);transform:none;box-shadow:none}
.btn[disabled]:hover,.primary[disabled]:hover{transform:none;filter:grayscale(.25)}
.btn.on,.primary{height:34px;border-radius:999px;padding:0 22px;background:linear-gradient(135deg,#4a7df0,#8a5ae0);border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:600;
  box-shadow:0 8px 20px rgba(88,110,220,.35)}
.btn.on:hover,.primary:hover{filter:brightness(1.06)}
.pts{color:#8fd0a0;font-size:13px}
.num{width:46px;text-align:center;font-variant-numeric:tabular-nums;color:#e6ecf8;font-size:15px}
.row .btn{width:32px;padding:0}
.hud{color:#93a2c0;font-size:12.5px;line-height:2;margin:2px 0 12px;padding:0 2px}
.log{max-height:calc(100vh - 250px);min-height:280px;overflow-y:auto;font-size:13.5px;line-height:1.95;padding-right:10px}
.log .y{color:#6f9bdd;margin-right:8px;font-variant-numeric:tabular-nums}
.log .hl{color:#ffd479}
.log .fight-win{color:#8fd0a0}
.log .fight-crit{color:#ffb35c;font-weight:600}
.log .fight-lose{color:#ff8a8a}
.log .sys{color:#9c8cff}
.invbar{margin:0 0 12px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;background:#1e2740;
  border:1px solid #33405e;margin:3px 6px 3px 0;cursor:pointer;color:#c3d3ef;transition:all .12s ease}
.chip:hover{background:#27334f;border-color:#47597f;transform:translateY(-1px)}
.pill{border-color:#4c7358;color:#a6e6b8;background:#16241d}
.art{border-color:#5f4d84;color:#cdb5ff;background:#1d1830}
.ctrl{color:#93a2c0;border-color:#3a4a6e}
.choice{position:sticky;bottom:10px;display:inline-block;max-width:min(1180px,94vw);background:linear-gradient(180deg,#1b2540,#161e33);
  border:1px solid #3f5280;border-radius:14px;padding:11px 14px 12px;margin:10px 0 6px;
  box-shadow:0 18px 40px rgba(0,0,0,.5)}
.choice-q{font-size:13.5px;margin-bottom:9px;color:#dbe7ff;line-height:1.6;max-width:min(1100px,90vw)}
.choice-opts{display:flex;flex-wrap:wrap;gap:9px}
.choice-btn{background:linear-gradient(180deg,#26334f,#1c2740);border:1px solid #3f5280;color:#e6ecf8;border-radius:11px;
  padding:9px 14px;cursor:pointer;font-size:13px;transition:all .12s ease}
.choice-btn:hover{background:linear-gradient(180deg,#31456a,#243252);border-color:#5a76ad;transform:translateY(-1px)}
.talents{margin:4px 0}
.tcard{display:inline-block;width:47.4%;margin:7px 7px 7px 0;padding:13px 15px;border:1px solid #33405e;border-radius:13px;
  cursor:pointer;background:linear-gradient(180deg,#171f31,#131a29);vertical-align:top;transition:all .14s ease}
.tcard:hover{border-color:#4b5f8c;transform:translateY(-1px)}
.tcard.on,.tcard.sel{border-color:#6f8fd6;background:linear-gradient(180deg,#1c2a48,#172239);box-shadow:0 0 0 1px #6f8fd6 inset,0 8px 22px rgba(80,110,200,.25)}
.tn{font-weight:600;color:#dbe7ff;font-size:13.5px}
.td{color:#8ea3c6;font-size:12px;margin-top:6px;line-height:1.7}
.rank{font-size:68px;font-weight:800;letter-spacing:2px;line-height:1.15;background:linear-gradient(135deg,#ff9ad5,#ffd479);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(255,150,210,.25))}
.score{color:#dbe7ff;font-size:14px;margin-top:6px}
.cmt{color:#93a2c0;font-size:12.5px;margin-top:9px;line-height:1.75}
.ranklist .rk{display:flex;gap:14px;padding:6px 0;border-bottom:1px dashed rgba(46,58,86,.6);font-size:13px;color:#bdcbe6}
.ranklist .rk-empty{color:#7f8ead;font-size:12.5px;padding:6px 0}
.slot-panel{background:linear-gradient(180deg,#1a2236,#151d2e);border:1px solid #33405e;border-radius:13px;padding:12px;margin:12px 0}
.sub{color:#7f8ead;font-size:12.5px}
</style>
</head>
<body>
<script>
/**
 * 人生重开模拟器 · 修仙版（单文件，双击即玩）
 * 纯前端：属性加点 → 天赋三选 → 逐年人生事件 → 结局评级
 */
(() => {
  'use strict'

  // ---------- 数据 ----------
  const ATTRS = [
    { key: 'yan', name: '颜值', desc: '好看能当饭吃，也能招祸' },
    { key: 'zhi', name: '智力', desc: '念书、破局、参悟天道' },
    { key: 'ti', name: '体质', desc: '扛揍、长寿、渡劫本钱' },
    { key: 'jia', name: '家境', desc: '起点、资源、贵人' },
  ]
  const TOTAL_POINTS = 20
  const MAX_ATTR = 10

  const TALENTS = [
    { id: 't1', name: '天生灵体', desc: '修仙资质 +3，引气入体成功率大增', tag: 'cultivate' },
    { id: 't2', name: '过目不忘', desc: '智力 +2，读书事件更容易成功', tag: 'stat', eff: { zhi: 2 } },
    { id: 't3', name: '含着金汤匙', desc: '家境 +3，开局富贵', tag: 'stat', eff: { jia: 3 } },
    { id: 't4', name: '天生神力', desc: '体质 +3，打架不怕', tag: 'stat', eff: { ti: 3 } },
    { id: 't5', name: '貌美如花', desc: '颜值 +3，人缘极佳', tag: 'stat', eff: { yan: 3 } },
    { id: 't6', name: '锦鲤附体', desc: '所有好运事件概率提升', tag: 'luck' },
    { id: 't7', name: '大器晚成', desc: '40 岁后属性增长翻倍', tag: 'late' },
    { id: 't8', name: '钢铁之躯', desc: '寿命 +15 年', tag: 'life', eff: { life: 15 } },
    { id: 't9', name: '仙人转世', desc: '前世记忆：修仙资质 +5，但早年多灾', tag: 'cultivate2' },
    { id: 't10', name: '社交恐怖分子', desc: '人际事件收益翻倍', tag: 'social' },
    { id: 't11', name: '卷王', desc: '智力成长速度翻倍', tag: 'study' },
    { id: 't12', name: '佛系', desc: '心态平和，负面事件伤害减半', tag: 'calm' },
    { id: 't13', name: '路痴', desc: '偶尔迷路，但常常误入奇境', tag: 'lost' },
    { id: 't14', name: '穷开心', desc: '家境 -2，但快乐值极高', tag: 'stat', eff: { jia: -2, happy: 20 } },
    { id: 't15', name: '九世善人', desc: '功德深厚，渡劫成功率 +20%', tag: 'merit' },
  ]

  const IMMORTAL_REALMS = [
    { name: '仙人', upTo: 30000 }, { name: '真仙', upTo: 60000 }, { name: '金仙', upTo: 100000 },
    { name: '大罗金仙', upTo: 200000 }, { name: '仙帝', upTo: Infinity },
  ]

  const REALMS = [
    { name: '炼气期', need: 0, span: 400 },
    { name: '筑基期', need: 400, span: 800 },
    { name: '金丹期', need: 1200, span: 1400 },
    { name: '元婴期', need: 2600, span: 1900 },
    { name: '化神期', need: 4500, span: 2300 },
    { name: '大乘期', need: 6800, span: 1700 },
    { name: '渡劫期', need: 8500, span: 1500 },
    { name: '飞升', need: 10000, span: 1 },
  ]
  // 事件：cond(s) 返回 bool；effect 返回一段描述
  const EVENTS = [
    // ===== 幼年 =====
    { age: [0, 3], w: 6, cond: s => s.jia < 3, text: '出生在普通人家，父母为了奶粉钱发愁。', eff: s => { s.happy -= 4 } },
    { age: [0, 3], w: 6, cond: s => s.jia >= 7, text: '出生时家里已经很有钱，满月酒摆了三十桌。', eff: s => { s.happy += 6 } },
    { age: [1, 4], w: 5, cond: s => s.ti < 3, text: '小时候体弱，三天两头发烧。', eff: s => { s.ti -= 1 } },
    { age: [2, 6], w: 5, cond: s => s.yan >= 7, text: '被邻居夸「这孩子长得真俊」，你妈逢人就笑。', eff: s => { s.happy += 8 } },
    { age: [3, 6], w: 4, text: '在幼儿园抢玩具，被小朋友咬了一口。', eff: s => { s.happy -= 3 } },
    { age: [5, 7], w: 5, text: '小学报到，班主任说你「眼神很亮」。', eff: s => { s.zhi += 1 } },

    // ===== 读书 =====
    { age: [7, 18], w: 9, cond: s => s.zhi >= 12, text: '考试次次第一，全校都认识你。', eff: s => { s.zhi += 2; s.happy += 6 } },
    { age: [7, 18], w: 9, cond: s => s.zhi < 6, text: '成绩垫底，你爸把作业本拍在桌上。', eff: s => { s.happy -= 6 } },
    { age: [8, 18], w: 6, text: '偷偷看闲书，被老师没收了一本。', eff: s => { s.zhi += 1; s.happy -= 2 } },
    { age: [10, 18], w: 5, cond: s => s.yan >= 12, text: '收到一封情书，署名是班花。', eff: s => { s.happy += 8 } },
    { age: [12, 18], w: 5, cond: s => s.ti >= 10, text: '校运会三千米第一，跑完还能再跑一圈。', eff: s => { s.ti += 1; s.happy += 5 } },
    { age: [14, 18], w: 5, cond: s => s.zhi >= 18, text: '提前保送，校长亲自来家里道贺。', eff: s => { s.zhi += 3; s.happy += 10 } },

    // ===== 修仙主线 =====
    { age: [6, 60], w: 3, cond: s => !s.noCult && !s.cultivating && s.linggen > 0 && s.zhi >= 10, text: '山里遇到一位白胡子老头，说你「骨骼清奇」，塞给你一本《引气诀》。', eff: s => { s.cultivating = true; s.qi += 1 } },
    { age: [6, 60], w: 2, cond: s => !s.noCult && !s.cultivating && s.linggen >= 4, text: '雷雨夜你梦见一条白龙，醒来掌心多了个光点——引气入体。', eff: s => { s.cultivating = true; s.qi += 2 } },
    { age: [8, 80], w: 8, cond: s => s.cultivating, text: '闭关打坐，天地灵气缓缓涌入四肢百骸。', eff: s => { s.qi += 1; s.happy += 2 } },
    { age: [8, 80], w: 5, cond: s => s.cultivating && s.zhi >= 15, text: '参悟《道德经》残卷，忽然通了一条经脉。', eff: s => { s.qi += 2 } },
    { age: [8, 80], w: 4, cond: s => s.cultivating && s.qi > 3, text: '走火入魔，气血翻涌差点爆体而亡。', eff: s => { s.qi -= 1; s.ti -= 1; s.happy -= 10 } },
    { age: [10, 90], w: 6, cond: s => s.cultivating, text: '你在云海里打坐，一坐就是三年。', eff: s => { s.qi += 1 } },
    { age: [10, 90], w: 4, cond: s => s.cultivating && s.jia >= 10, text: '家族倾力支持，为你拍下一枚三阶灵石。', eff: s => { s.qi += 3 } },
    { age: [12, 90], w: 3, cond: s => s.cultivating && s.qi >= 10, text: '遭遇魔道修士伏击，你以本命飞剑反杀。', eff: s => { s.qi += 1; s.ti -= 1 } },
    { age: [20, 120], w: 3, cond: s => s.cultivating && s.qi >= 15, text: '结丹之日，天降异象，方圆百里的鸟兽伏地。', eff: s => { s.qi += 2; s.happy += 10 } },

    // ===== 工作/社会 =====
    { age: [18, 60], w: 9, cond: s => s.zhi >= 15 && !s.job, text: '考上好大学，毕业进了大厂。', eff: s => { s.job = '大厂'; s.jia += 3; s.happy += 8 } },
    { age: [18, 60], w: 8, cond: s => s.zhi < 8 && !s.job, text: '学历不高，进了工厂，两班倒。', eff: s => { s.job = '工厂'; s.ti -= 1; s.happy -= 6 } },
    { age: [18, 60], w: 7, cond: s => s.jia >= 15 && !s.job, text: '接手家族生意，第一次开会就被叫「总」。', eff: s => { s.job = '老板'; s.jia += 5; s.happy += 6 } },
    { age: [20, 70], w: 6, cond: s => s.job, text: '加班到凌晨，你在工位上睡着了。', eff: s => { s.ti -= 1; s.happy -= 4 } },
    { age: [22, 65], w: 5, cond: s => s.job, text: '升职加薪，请全组喝了奶茶。', eff: s => { s.jia += 3; s.happy += 8 } },
    { age: [25, 60], w: 5, cond: s => s.job && s.happy < 40, text: '你动了辞职的念头，最后没敢。', eff: s => { s.happy -= 3 } },
    { age: [20, 70], w: 4, cond: s => s.yan >= 14, text: '被星探搭话，你留了个电话，最后也没打过去。', eff: s => { s.happy += 5 } },

    // ===== 情感 =====
    { age: [18, 55], w: 7, cond: s => !s.love && (s.yan + s.zhi) >= 12, text: '恋爱了，对方说你笑起来很好看。', eff: s => { s.love = true; s.happy += 15 } },
    { age: [20, 70], w: 4, cond: s => s.love, text: '和恋人吵了一架，冷战三天。', eff: s => { s.happy -= 6 } },
    { age: [22, 60], w: 5, cond: s => s.love, text: '结婚了，酒席上你妈哭了。', eff: s => { s.married = true; s.happy += 12 } },
    { age: [24, 65], w: 4, cond: s => s.married, text: '孩子出生，半夜被哭声吵醒无数次。', eff: s => { s.child = true; s.happy += 8; s.ti -= 1 } },
    { age: [25, 90], w: 4, cond: s => s.love, text: '和爱人一起散步，聊起年轻时候的事。', eff: s => { s.happy += 6 } },

    // ===== 意外/健康 =====
    { age: [5, 95], w: 7, text: '感冒了一场，吃点药就好了。', eff: s => {} },
    { age: [15, 95], w: 4, cond: s => s.ti < 10, text: '体检报告出现一排箭头，医生让你少熬夜。', eff: s => { s.ti -= 2; s.happy -= 5 } },
    { age: [20, 95], w: 3, text: '路上捡到一百块，心情不错。', eff: s => { s.happy += 4 } },
    { age: [20, 95], w: 3, cond: s => s.happy < 50, text: '被生活按在地上摩擦，你哭了一场。', eff: s => { s.happy -= 8 } },
    { age: [30, 95], w: 3, cond: s => s.jia >= 20, text: '投资赚了一笔，账面数字让你笑出声。', eff: s => { s.jia += 8 } },
    { age: [35, 95], w: 3, text: '半夜想事情睡不着，起来吃了碗泡面。', eff: s => { s.ti -= 1 } },
    { age: [40, 95], w: 4, text: '父母老去，你请了长假回家陪他们。', eff: s => { s.happy += 4 } },

    // ===== 修仙高阶 =====
    { age: [15, 200], w: 3, cond: s => s.cultivating && s.qi >= 20, text: '元婴出窍，第一次「看见」自己的神魂。', eff: s => { s.qi += 2 } },
    { age: [15, 200], w: 2, cond: s => s.cultivating && s.qi >= 25, text: '拜访剑冢，得前辈一剑之恩。', eff: s => { s.qi += 3; s.happy += 8 } },
    { age: [20, 300], w: 2, cond: s => s.cultivating && s.qi >= 30, text: '与旧友重逢，对方已是凡人白发。', eff: s => { s.happy -= 5; s.qi += 1 } },
  ]

  // ---------- 物品 ----------
  const ITEMS = {
    huiyuan: { name: '回元丹', kind: 'pill', desc: '修为 +300' },
    xisui:   { name: '洗髓丹', kind: 'pill', desc: '体质 +3' },
    yanshou: { name: '延寿丹', kind: 'pill', desc: '寿元 +40' },
    zhuji:   { name: '筑基丹', kind: 'pill', desc: '修为 +800' },
    qingfeng:{ name: '青锋剑', kind: 'artifact', desc: '智力 +3（持有）' },
    hulu:    { name: '聚灵葫芦', kind: 'artifact', desc: '每年自动 +80 修为（持有）' },
    jia:     { name: '护身甲', kind: 'artifact', desc: '体质 +4（持有）' },
    lingshi: { name: '灵石', kind: 'pill', desc: '修为 +200' },
    yaodan:  { name: '妖丹', kind: 'pill', desc: '修为 +500' },
    canjuan: { name: '残卷', kind: 'pill', desc: '智力 +2' },
    xiandan: { name: '仙丹', kind: 'pill', desc: '修为 +3000' },
    shengtie:{ name: '玄铁', kind: 'artifact', desc: '体质 +6（持有）' },
  }

  function addItem(s, id, q) {
    const it = ITEMS[id]
    if (!it) return
    q = q || 'fan'
    const R = RARITY[q] || RARITY.fan
    if (!s.inv) s.inv = []
    if (!s.invQ) s.invQ = []
    if (!s.arts) s.arts = []
    if (!s.artQ) s.artQ = {}
    if (it.kind === 'artifact') {
      if (s.arts.includes(id)) return
      s.arts.push(id)
      s.artQ[id] = q
      if (id === 'qingfeng') s.zhi += Math.round(3 * R.mul)
      if (id === 'jia') s.ti += Math.round(4 * R.mul)
      if (id === 'shengtie') s.ti += Math.round(6 * R.mul)
      s.logs.push({ age: s.age, text: `获得法宝【${R.name}·${it.name}】：${it.desc}`, cls: 'hl ' + R.cls })
    } else {
      s.inv.push(id)
      s.invQ.push(q)
      s.logs.push({ age: s.age, text: `获得丹药【${R.name}·${it.name}】：${it.desc}`, cls: 'hl ' + R.cls })
    }
  }

  function useItem(s, idx) {
    const id = s.inv[idx]
    if (!id) return
    const it = ITEMS[id]
    const q = (s.invQ && s.invQ[idx]) || 'fan'
    const R = RARITY[q] || RARITY.fan
    s.inv.splice(idx, 1)
    if (s.invQ) s.invQ.splice(idx, 1)
    if (id === 'huiyuan') s.qi += Math.round(300 * R.mul)
    if (id === 'zhuji') s.qi += Math.round(800 * R.mul)
    if (id === 'lingshi') s.qi += Math.round(200 * R.mul)
    if (id === 'yaodan') s.qi += Math.round(500 * R.mul)
    if (id === 'xiandan') s.qi += Math.round(3000 * R.mul)
    if (id === 'xisui') s.ti += Math.round(3 * R.mul)
    if (id === 'canjuan') s.zhi += Math.round(2 * R.mul)
    if (id === 'yanshou') { s.maxAge += Math.round(40 * R.mul); s.ti += 1 }

  ]
  function housePrice(s, k) {
    const mul = (s.costMul || 1) * (s.houseMul || 1)
    return Math.round(k.base * 10000 * mul)
  }
  function buyHouse(s, k) {
    const price = housePrice(s, k)
    const down = Math.round(price * 0.3)
    const loan = price - down
    if ((s.money || 0) < down) { s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你算了算${k.n}的首付（${(down/10000).toFixed(0)} 万），钱不够，先记着。` }); return }
    s.money -= down
    s.mortgage = (s.mortgage || 0) + loan
    s.house = k.n
    s.houses = (s.houses || []).concat([{ id: k.id, n: k.n, price, buyYear: s.age }])
    s.happy += k.happy
    s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你咬牙买下${k.n}：总价 ${(price/10000).toFixed(0)} 万，首付 ${(down/10000).toFixed(0)} 万，月供 ${(loan * k.rent / 12 / 10000).toFixed(1)} 万。`, cls: 'hl' })
  }
  function maybeBuyHouse(s) {
    if (!s.noCult || s.house || (s.money || 0) < 200000) return false
    const afford = HOUSE_KINDS.filter(k => (s.money || 0) >= Math.round(housePrice(s, k) * 0.3))

    const k = afford[afford.length - 1]
    const others = HOUSE_KINDS.filter(x => x.id !== k.id).slice(0, 2)

      opts: [
        { t: '买了（80 万）', log: '搬家那天你妈一直在擦窗台。', eff: s => { s.parentHouse = true; s.money -= 800000; s.happy += 20; s.jia += 3 } },
        { t: '先给他们装修一下', log: '你换了地板和热水器，他们说过得挺好。', eff: s => { s.money -= 80000; s.happy += 8 } },
      ],
    },
  )

  // ---------- 品质 / 战斗 ----------
  const RARITY = {
    fan:   { name: '凡品', cls: 'r-fan',   mul: 1 },
    liang: { name: '良品', cls: 'r-liang', mul: 1.6 },
    shang: { name: '上品', cls: 'r-shang', mul: 2.4 },
    ji:    { name: '极品', cls: 'r-ji',    mul: 3.6 },
    xian:  { name: '仙品', cls: 'r-xian',  mul: 5.5 },
  }
  const RARITY_ORDER = ['fan', 'liang', 'shang', 'ji', 'xian']
  const LOOT_BY_TIER = {
    human: ['huiyuan', 'xisui', 'yanshou', 'qingfeng', 'jia'],
    xiu:   ['zhuji', 'lingshi', 'yaodan', 'canjuan', 'hulu'],
    imm:   ['xiandan', 'shengtie', 'zhuji', 'lingshi'],
  }
  const ENEMIES = {
    human: [
      { n: '街头混混', pw: 45, qi: 50 },
      { n: '山贼头目', pw: 130, qi: 140 },
      { n: '地方恶霸', pw: 280, qi: 300 },
      { n: '欺行霸市的商人', pw: 90, qi: 90 },
    ],
    xiu: [
      { n: '散修', pw: 700, qi: 900 },
      { n: '邪修', pw: 1900, qi: 2200 },
      { n: '魔道长老', pw: 4600, qi: 4800 },
      { n: '夺宝的同门', pw: 1200, qi: 1500 },
    ],
    imm: [
      { n: '天将', pw: 32000, qi: 9000 },
      { n: '叛仙', pw: 95000, qi: 24000 },
      { n: '古神残念', pw: 260000, qi: 60000 },
    ],
  }

  function myPower(s) {
    let p = s.qi / 12 + s.ti * 8 + s.zhi * 2
    if (s.arts) p += s.arts.length * 60
    if (s.pet && !s.petDead) p += s.pet.lv * 12
    p += (s.power || 0) * 15
    if (s.disciple) p += s.disciple.qi / 80
    return Math.max(1, Math.round(p))
  }

  function rollQuality(margin) {
    // margin 越大（你比敌人强）越好出货
    const w = [
      52 - Math.min(30, margin * 14),
      26 + Math.min(8, margin * 4),
      14 + Math.min(10, margin * 6),
      6 + Math.min(6, margin * 4),
      1 + Math.min(3, margin * 1.2),
    ]
    const total = w.reduce((a, b) => a + b, 0)
    let r = Math.random() * total
    for (let i = 0; i < w.length; i++) {
      r -= w[i]
      if (r <= 0) return RARITY_ORDER[i]
    }
    return 'fan'
  }

  function tierOf(s) {
    if (s.noCult) return 'human'
    if (s.immortal) return 'imm'
    const p = myPower(s)
    if (p >= 9000) return 'imm'
    if (p >= 420) return 'xiu'
    return 'human'
  }

  function loot(s, e, margin, times, bonusQ) {
    const tier = tierOf(s)
    const pool = LOOT_BY_TIER[tier]
    const got = []
    for (let i = 0; i < times; i++) {
      const id = pool[rnd(pool.length)]
      const q = rollQuality(margin + (bonusQ || 0))
      addItem(s, id, q)
      got.push((RARITY[q] || RARITY.fan).name + '·' + (ITEMS[id] ? ITEMS[id].name : id))
    }
    return got
  }

  function fightChoice(e, pw) {
    const base = Math.max(0.05, Math.min(0.95, pw / (pw + e.pw * 1.15)))
    const pct = Math.round(base * 100)
    return {
      q: `【${e.n}】挡住了去路（对方战力 ${e.pw}｜你 ${pw}｜正面胜率约 ${pct}%）`,
      opts: [
        { t: '冲上去，硬刚！', eff: s => resolveFight(s, e, 'front'), log: '' },
        { t: '绕后偷袭，抢个先手', eff: s => resolveFight(s, e, 'ambush'), log: '' },
        { t: '沉住气，看破绽再动', eff: s => resolveFight(s, e, 'steady'), log: '' },
        { t: '不打了，掉头就跑', eff: s => resolveFight(s, e, 'flee'), log: '' },
      ],
    }
  }

  function resolveFight(s, e, mode) {
    const pw = myPower(s)
    const margin = Math.max(0.12, pw / (e.pw + 1))

    if (mode === 'flee') {
      if (Math.random() < 0.8) {
        s.__fmsg = '你转身就跑，跑得比风还快，什么都没丢。'
        s.happy = Math.max(0, s.happy - 2)
        s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你转身就跑，一口气跑了三里地。【${e.n}】没追上。`, cls: 'fight-lose' })
      } else {
        const hurt = 2 + rnd(4)
        s.ti = Math.max(1, s.ti - hurt)
        s.qi = Math.round(s.qi * 0.96)
        s.__fmsg = `被【${e.n}】追上，挨了顿揍（体质 -${hurt}）。`
        s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你没跑掉，被【${e.n}】按在地上一顿揍：体质 -${hurt}。`, cls: 'fight-lose' })
      }
      return s.__fmsg
    }

    let dmgBonus = 0, lootN = 1, qBonus = 0
    if (mode === 'front') { lootN = 2; qBonus = 0.15; dmgBonus = 3 }
    if (mode === 'ambush') { dmgBonus = 6; qBonus = 0.05 }
    if (mode === 'steady') { lootN = 1; qBonus = 0.25; dmgBonus = -2 }

    // ---- 回合制：两边各有一百气力，打到一方趴下 ----
    let myHp = 100, eHp = 100, rounds = 0
    const myDmg = () => Math.max(4, Math.round(7 + 9 * Math.min(2.4, margin)) + dmgBonus + rnd(4))
    const eDmg = () => Math.max(3, Math.round(6 + 10 * Math.min(2, 1 / margin)) + rnd(4))
    if (mode === 'ambush') eHp -= Math.round(myDmg() * 1.4)   // 先手
    const trace = []
    while (myHp > 0 && eHp > 0 && rounds < 9) {
      rounds++
      const d1 = myDmg()
      eHp -= d1
      trace.push(`第${rounds}回合你击中他 ${d1}`)
      if (eHp <= 0) break
      const d2 = eDmg()
      myHp -= d2
      trace.push(`他反击 ${d2}`)
    }
    const win = eHp <= 0
    s.__trace = trace

    if (win) {
      const crit = rounds <= 2
      s.streak = (s.streak || 0) + 1
      const qiGain = s.noCult ? 0 : Math.round(e.qi * (0.6 + Math.min(1.6, margin * 0.5)) * (crit ? 1.5 : 1))
      if (qiGain) s.qi += qiGain
      if (Math.random() < 0.3 || crit) s.power = (s.power || 0) + 1 + rnd(2)
      let got
      if (s.noCult) {
        const cash = (2000 + rnd(8000)) * (crit ? 2 : 1) * (1 + Math.floor(margin))
        s.money = (s.money || 0) + cash
        got = [`${(cash / 10000).toFixed(1)} 万现金`]
      } else {
        got = loot(s, e, margin, crit ? 2 : lootN, qBonus)
      }
      const tag = crit ? `两回合就把他打趴了` : `缠斗 ${rounds} 回合，你剩 ${Math.max(1, myHp)} 气力`
      const gainTxt = qiGain ? `｜修为 +${qiGain}` : ''
      s.__fmsg = `${tag}，赢了【${e.n}】${gainTxt}｜战利品 ${got.join('、')}`
      s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你与【${e.n}】交手：${tag}！${gainTxt ? '修为 +' + qiGain + '，' : ''}掉出 ${got.join('、')}。`, cls: crit ? 'fight-crit' : 'fight-win' })
      if ((s.streak % 3) === 0) {
        s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你已经连赢 ${s.streak} 场，名声传出去了（势力 +3）。`, cls: 'hl' })
        s.power = (s.power || 0) + 3
      }
    } else {
      s.streak = 0
      const deathChance = (e.pw > pw * 1.6 ? 0.3 : 0.18) + (mode === 'ambush' ? 0.05 : 0)
      if (Math.random() < deathChance) {
        s.alive = false
        s.deathReason = `殒于【${e.n}】之手`
        s.__fmsg = `打不过【${e.n}】，没能回来。`
        s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你与【${e.n}】交手 ${rounds} 回合，气力耗尽，终究不敌。这一战没能回来。`, cls: 'fight-crit' })
      } else {
        const hurt = 3 + rnd(6)
        s.ti = Math.max(1, s.ti - hurt)
        s.maxAge = Math.max(30, s.maxAge - (3 + rnd(6)))
        s.qi = Math.round(s.qi * 0.9)
        s.__fmsg = `打输了，被【${e.n}】打成重伤（体质 -${hurt}）。`
        s.logs.push({ age: s.age, day: 1 + rnd(360), text: `你与【${e.n}】交手 ${rounds} 回合落败：体质 -${hurt}，寿元受损。`, cls: 'fight-lose' })
      }
    }
    return s.__fmsg
  }

  function maybeFight(s) {
    if (!s.alive) return
    if (s.noCult) return
    if (s.age < 14) return
    if (myPower(s) < 150) return
    if (s.pendingFight) return
    let p = 0.08
    if (s.cultivating) p += 0.04
    if ((s.power || 0) > 10) p += 0.03
    if (s.immortal) p += 0.02
    if (Math.random() < p) {
      const tier = tierOf(s)
      const pw0 = myPower(s)
      const all = ENEMIES[tier].slice().sort((a, b) => a.pw - b.pw)
      if (all[0].pw > pw0 * 2.4) return
      let list = ENEMIES[tier].filter(x => x.pw <= pw0 * 3.2)
      if (!list.length) list = [all[0]]
      list.sort((a, b) => Math.abs(a.pw - pw0 * 0.85) - Math.abs(b.pw - pw0 * 0.85))
      const e = list[rnd(Math.min(2, list.length))]
      s.pendingFight = { n: e.n, pw: e.pw, qi: e.qi }
      s.logs.push({ age: s.age, text: `【${e.n}】拦住了你的去路。`, cls: 'fight-win' })
    }
  }


  // ---------- 现代生活篇（不修仙） ----------
  const JOBS = [
    { min: 22, name: '普通职员', pay: 120000 },
    { min: 26, name: '小主管', pay: 200000 },
    { min: 32, name: '部门经理', pay: 320000 },
    { min: 40, name: '高管', pay: 480000 },
  ]
  function salaryOf(s) {
    let base = 0
    for (const j of JOBS) if (s.age >= j.min) base = j.pay
    base += s.zhi * 4000 + s.jia * 3000
    if (s.noDegree) base = Math.round(base * 0.7)
    return base
  }
  function moneyWan(v) { return (v / 10000).toFixed(1) + ' 万' }

  function modernYear(s) {
    if (!s.money) s.money = 0
    if (s.age < 18) {
      s.money += 2000 + s.jia * 800
      return
    }
    if (s.age < 60) {
      let pay = Math.round(salaryOf(s) * (s.costMul || 1) * 0.9)
    const lv = s.eduLv || 0
    pay = Math.round(pay * (EDU_PAY[lv] || 0.7))
    if (s.major && MAJORS[s.major]) pay = Math.round(pay * MAJORS[s.major].pay)
    if (s.topSchool) pay = Math.round(pay * 1.25)
      s.money += pay
      const cost = 30000 + s.ti * -200 + (s.married ? 30000 : 0) + (s.child ? 20000 : 0)
      s.money -= Math.max(20000, cost)
      if (s.mortgage) {
        const m = Math.min(120000, s.mortgage)
        s.money -= m
        s.mortgage -= m
        if (s.mortgage <= 0) { s.mortgage = 0; s.logs.push({ age: s.age, day: 1 + rnd(360), text: '房贷终于还清了，你在阳台上站了很久。', cls: 'hl' }) }
      }
    } else {
      s.money += 40000
      s.money -= 30000
    }
    // 随机经济事件
    const r = Math.random()
    if (r < 0.06) {
      s.money = Math.round(s.money * 0.5)
      s.logs.push({ age: s.age, day: 1 + rnd(360), text: '被理财项目坑了，存款腰斩。', cls: 'fight-lose' })
    } else if (r < 0.1) {
      const win = 50000 + rnd(200000)
      s.money += win
      s.logs.push({ age: s.age, day: 1 + rnd(360), text: `年终奖加投资分红，进账 ${moneyWan(win)}。`, cls: 'hl' })
    } else if (r < 0.14 && s.age < 55) {
      s.logs.push({ age: s.age, day: 1 + rnd(360), text: '公司裁员，你被优化了，歇了大半年。', cls: 'fight-lose' })
      s.money -= 40000
    } else if (r < 0.17) {
      s.money += 1000000
      s.logs.push({ age: s.age, day: 1 + rnd(360), text: '老家拆迁，分到一笔钱（+100 万）。', cls: 'hl' })
      s.jia += 3
    }
    if (s.money < 0) {
      s.money = 0
      s.happy = Math.max(0, s.happy - 3)
      s.logs.push({ age: s.age, day: 1 + rnd(360), text: '这个月账单还没还完，你连外卖都点最便宜的。', cls: 'fight-lose' })
    }
  }

  function stepYear(s) {
    const has = s.has || (id => s.talents.includes(id))
    // 自然成长
    s.age += 1
    if (s.age <= 18) {
      if (has('t11')) s.zhi += 1
      if (s.age % 3 === 0) s.ti += 1
    }
    if (s.age >= 40 && has('t7') && s.age % 2 === 0) { s.zhi += 1; s.jia += 1 }
    if (has('t9') && s.age >= 20 && s.cultivating) s.qi += 1

    const cands = eligible(s)
    const n = s.noCult ? 5 + Math.floor(Math.random() * 6) : s.age < 6 ? 1 + Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 4)
    for (let i = 0; i < n; i++) {
      if (!cands.length) break
      const e = pick(cands)
      s.__day = 1 + rnd(360)
      s.seen.add(e.text)
      let text = typeof e.text === 'function' ? e.text(s) : e.text
      if (has('t6') && /捡到|赚|第一|恋爱/.test(e.text)) text += '（锦鲤附体）'
      if (s.age >= 40 && has('t7') && Math.random() < 0.2) text += ''
      s.logs.push({ age: s.age, day: 1 + rnd(360), text })
      try { e.eff(s) } catch (err) { /* 单条事件失败不影响整局 */ }
    }
    // 修为换到 0~10000 的新量级：事件里的 +1/+2 放大 120 倍
    if (s.qi !== qi0) { const d = s.qi - qi0; s.qi = Math.max(0, qi0 + Math.round(Math.abs(d) <= 5 ? d * 120 : d)) }
    // 体修：体质成长直接转修为
    if (s.bodyCult && s.ti > ti0) s.qi += Math.round((s.ti - ti0) * 400)

    // 修仙境界推进
    if (s.cultivating) {
      const realm = s.immortal
      ? (IMMORTAL_REALMS.find(r => s.qi < r.upTo) || IMMORTAL_REALMS[IMMORTAL_REALMS.length - 1])
      : REALMS.reduce((acc, r) => (s.qi >= r.need ? r : acc), REALMS[0])
      s.realm = realm.name
      if (s.qi >= 36 && !s.ascended) {
        s.ascended = true
        s.logs.push({ age: s.age, text: '雷云压顶，你徒手接下九道天雷。' })
        s.logs.push({ age: s.age, text: '天门洞开，你踏空而去——白日飞升。' })
        s.alive = false
        s.deathReason = '飞升'
        return
      }
    }

    // 灵宠成长
    if (s.pet && !s.petDead) {
      s.pet.lv += 0.04
      if (s.pet.lv > 9 && s.pet.evolved !== true) {
        s.pet.evolved = true
        s.logs.push({ age: s.age, text: '你的' + s.pet.kind + '「' + s.pet.name + '」开了灵智，能听懂人话了。', cls: 'hl' })
      }
    }

    // 仙界每年
    if (s.immortal) {
      s.immY = (s.immY || 0) + 1
      s.qi += 600 + rnd(900)
      if (s.immY > 0 && s.immY % 90 === 0) {
        const ok = s.qi > 40000 + s.immY * 400
        if (ok) {
          s.qi += 8000
          s.logs.push({ age: s.age, text: '第九十仙年一次仙劫，你安然渡过，道行再进一层。', cls: 'hl' })
        } else {
          s.ti -= 6
          s.logs.push({ age: s.age, text: '仙劫落下，你硬接不住，神魂受损（体质 -6）。', cls: 'hl' })
          if (s.ti <= -2) {
            s.alive = false
            s.deathReason = '陨于仙劫'
            s.logs.push({ age: s.age, text: '你在第九十仙年的雷海里散了形。' })
            return
          }
        }
      }
      if (s.immY >= 420) {
        s.alive = false
        s.deathReason = '坐化'
        s.logs.push({ age: s.age, text: '你在仙界的第四百年，坐化成了一座山。' })
        return
      }
    }

    // 死亡判定
    const hurt = s.age > 70 ? Math.max(1, Math.floor((s.age - 70) / 12)) : 0

    }
  }

  function summarize(s) {
    const q = clamp(s.qi / 250, 0, 40)
    const score = Math.round(
      (s.age * 1.2) + (s.happy * 0.8) + (s.zhi + s.ti + s.jia + s.yan) * 1.5 + q * 12 +
      (s.ascended ? 300 : 0) + (s.married ? 20 : 0) + (s.child ? 20 : 0)
    )
    let rank = 'D', comment = '平平淡淡，也是一生。'
    if (s.immortal) { rank = 'SSS'; comment = s.deathReason === '坐化' ? '你坐化成山，仙界的云海从此绕着你走。' : '你的名字刻在天庭的碑上，后面还空着一行。' }
    else if (s.ascended) { rank = 'SSS'; comment = '你已不在五行之中，凡人只记得那夜的雷。' }
    else if (q >= 25) { rank = 'SS'; comment = '修真界的传说里有你的名字。' }
    else if (q >= 12) { rank = 'S'; comment = '你已非凡人，却仍念着人间一碗面。' }
    else if (score > 420) { rank = 'A'; comment = '富贵安稳，儿孙绕膝。' }
    else if (score > 320) { rank = 'B'; comment = '普通人的一生，有笑有泪。' }
    else if (score > 220) { rank = 'C'; comment = '日子紧巴，倒也熬过来了。' }
    return { score, rank, comment }
  }

    let mid = ''
    if (s.immPartner) mid = `仙界那间小屋的灯，${s.immPartner}还留着。`
    else if (s.disciple) mid = `身后有弟子${s.disciple.name}替他/她续香火。`
    else if (s.married) mid = '与一个人过完了一辈子。'
    else if ((s.power || 0) >= 120) mid = '曾有一方势力以他/她的名字起誓。'
    else if ((s.secrets || 0) >= 3) mid = `一生进过 ${s.secrets} 座秘境，出来时衣袍上带着星光。`
    else if (s.child) mid = '儿孙把他/她的故事讲得比真的还好。'
    else mid = '没什么人记得他/她，但他/她自己记得。'
    const endMap = { '飞升': '没有骨灰，只留下一道剑痕。', '寿元耗尽': '走的时候很安静。', '身体垮了': '最后一句话是「差不多得了」。', '埋骨秘境': '没能走出来，石门在身后合上。', '陨于仙劫': '最后一道雷落下时，他/她笑了一下。', '坐化': '化成一座山，云从山腰过。' }
    return `${who}。${mid}${endMap[s.deathReason] || '就这样过去了。'}`
  }

    const users = readUsers()
    const uid = localStorage.getItem(UID_KEY)
    const hit = users.find(u => u.id === uid)
    if (hit) return hit
    // 首次进入：把老版本的单人存档迁到新用户名下
    const id = 'u' + Date.now().toString(36)

    writeLS(USERS_KEY, users.concat([u]))
    localStorage.setItem(UID_KEY, id)
    return u
  }

  const remaining = () => totalPoints() - ATTRS.reduce((a, x) => a + attrs[x.key], 0)

  function syncAlloc() {
    ATTRS.forEach(a => { const n = document.getElementById('num-' + a.key); if (n) n.textContent = attrs[a.key] })
    const p = document.getElementById('pts')
    if (p) p.textContent = remaining() > 0 ? `剩余点数：${remaining()}` : '点数分配完成'
    const go = document.getElementById('btn-roll')
    if (go) go.disabled = false
  }

  let rolled = [], chosen = []
  function showTalents() {
    rolled = []
    const used = new Set()
    while (rolled.length < 3) { const t = pick(TALENTS); if (!used.has(t.id)) { used.add(t.id); rolled.push(t) } }
    chosen = []
    const wrap = document.getElementById('step-talent')
    wrap.classList.remove('hide')
    wrap.innerHTML = ''
    const c = el('div', 'card')
    c.appendChild(el('div', 'nm', '选择 2 个天赋'))
    const grid = el('div', 'talents')
    grid.style.marginTop = '10px'
    rolled.forEach(t => {
      const tc = el('div', 'tcard')
      tc.appendChild(el('div', 'tn', t.name))
      tc.appendChild(el('div', 'td', t.desc))
      tc.onclick = () => {
        if (tc.classList.contains('on')) { tc.classList.remove('on'); chosen = chosen.filter(x => x.id !== t.id) }
        else if (chosen.length < 2) { tc.classList.add('on'); chosen.push(t) }
        startBtn.disabled = chosen.length !== 2
      }
      grid.appendChild(tc)
    })
    c.appendChild(grid)
    const bar = el('div', 'row')
    const startBtn = el('button', 'primary', '开始人生')
    startBtn.disabled = true
    startBtn.onclick = () => { startBtn.disabled = true; beginLife(chosen) }
    bar.appendChild(startBtn)
    c.appendChild(bar)
    wrap.appendChild(c)
  }

  function beginLife(talents) {
    document.getElementById('step-alloc').classList.add('hide')
    document.getElementById('step-talent').classList.add('hide')
    document.getElementById('step-life').classList.remove('hide')
    logEl = document.getElementById('log')
    logEl.innerHTML = ''
    rendered = 0

    state = newState({ ...attrs }, talents)
    if (player.mode === 'modern') {
      state.noCult = true
      state.money = 20000 + state.jia * 20000 + rnd(30000)
      state.costMul = state.costMul || 1
    }
    state.nextChoice = 11 + rnd(4)
    addLog(0, `出生在${state.province}。颜值 ${state.yan}｜智力 ${state.zhi}｜体质 ${state.ti}｜家境 ${state.jia}`, 'hl')
    if (state.linggen > 0) addLog(0, `你的灵根：${'★'.repeat(Math.min(5, state.linggen))}（修仙资质 ${state.linggen}）`, 'hl')
    addLog(0, `天赋：${talents.map(t => t.name).join('、')}`, 'sys')
    if (legacyPoints() > 0) addLog(0, `前世继承：额外 ${legacyPoints()} 点属性`, 'sys')
    tickLoop()
  }

  function addLog(age, text, cls) {
    state.logs.push({ age, text, cls })
    renderNew()
  }

  let timer = null
  let paused = false
  function tickLoop() {
    if (timer) { clearTimeout(timer); timer = null }
    const tick = () => {
      if (!state || !state.alive) { return finish() }
      if (paused || userPaused) return
      if (state.noCult) modernYear(state)
      stepYear(state)
      if (state.noCult) state.ti = Math.max(1, state.ti)
      renderNew()
      autoSave()
      if (!state.alive) return finish()
      if (state.noCult && state.age >= 24 && state.age % 3 === 0 && !state.house) { if (maybeBuyHouse(state)) return }
      if (state.noCult && state.age >= 20 && state.affection > 0 && state.age % 4 === 2) { if (giftChoice(state)) return }
      if (state.love && !state.affection) state.affection = 30
      // 高考：到 18 岁必弹
      if (state.noCult && state.age >= 18 && !state.gaokao) {
        const gk = MODERN_CHOICES.find(c => c.q.indexOf('高考') === 0)
        if (gk) { state.nextChoice = state.age + 9; return showChoice(gk) }
      }
      // 遭遇战：优先弹出来
      if (state.pendingFight) {
        const f = state.pendingFight
        state.pendingFight = null
        state.nextChoice = state.age + 3
        return showChoice(fightChoice(f, myPower(state)))
      }
      // 抉择点
      if (state.age >= state.nextChoice) {
        const c = pickChoice()
        if (c) { state.nextChoice = state.age + 9 + rnd(6); return showChoice(c) }
        state.nextChoice = state.age + 9 + rnd(6)
      }
      const base = state.age > 120 ? 90 : state.age > 60 ? 150 : 240
      const delay = Math.round(base / SPEEDS[speedIdx])
      timer = setTimeout(tick, delay)
    }
    tick()
  }

  function pickChoice() {
    const s = state
    const cands = CHOICES.concat(MODERN_CHOICES).filter(c => {
      if (s.age < c.ages[0] || s.age > c.ages[1]) return false
      if (c.cond && !c.cond(s)) return false
      if (!s.pickedChoices) s.pickedChoices = []
      return !s.pickedChoices.includes(c.q)
    })
    return cands.length ? pick(cands) : null
  }

  function showChoice(c) {
    paused = true
    if (!state.pickedChoices) state.pickedChoices = []
    state.pickedChoices.push(c.q)
    const box = el('div', 'choice')
    box.appendChild(el('div', 'choice-q', `【${state.age} 岁】${c.q}`))
    const row = el('div', 'choice-opts')
    c.opts.forEach(o => {
      const b = el('button', 'choice-btn', o.t)
      b.onclick = () => {
        state.logs.push({ age: state.age, text: `〔你的选择〕${o.t}`, cls: 'hl' })
        o.eff(state)
        if (typeof o.log === 'function' && o.log(state)) {
          state.logs.push({ age: state.age, text: o.log(state), cls: 'hl' })
        } else if (typeof o.log === 'string' && o.log) {
          state.logs.push({ age: state.age, text: o.log, cls: 'hl' })
        }
        renderNew()
        box.remove()
        paused = false
        tickLoop()
      }
      row.appendChild(b)
    })
    box.appendChild(row)
    document.getElementById('log').appendChild(box)
    logEl.scrollTop = logEl.scrollHeight
  }

  let rendered = 0
  function renderNew() {
    const all = state.logs
    for (let i = rendered; i < all.length; i++) {
      const l = all[i]
      const line = el('div')
      line.appendChild(el('span', 'y', l.age + ' 岁' + (l.day ? ' · 第 ' + l.day + ' 天' : '')))
      line.appendChild(el('span', l.cls || 'e', l.text))
      logEl.appendChild(line)
    }
    rendered = all.length
    logEl.scrollTop = logEl.scrollHeight
    const hud = document.getElementById('hud-life')
    if (hud) {
      const realm = state.cultivating ? (state.realm || '练气期') : '凡人'
      const path = state.cultivating ? (state.bodyCult ? '体修' : '法修') : '凡人'
      const q = state.immortal ? `${state.qi}（仙界不值一提）` : state.cultivating ? `${state.qi} / 10000` : '—'
      hud.innerHTML = `年龄 <b>${state.age}</b> · ${path} · 境界 <b>${realm}</b> · 修为 <b>${q}</b> · 心情 <b>${clamp(state.happy, 0, 100)}</b><br>颜值 <b>${state.yan}</b> · 智力 <b>${state.zhi}</b> · 体质 <b>${state.ti}</b> · 家境 <b>${state.jia}</b>${!state.noCult && state.sect ? ' · 宗门 <b>' + state.sect + '</b>' : ''}${!state.noCult && state.disciple ? ' · 弟子 <b>' + state.disciple.name + '</b>' : ''}${!state.noCult && (state.power||0) > 0 ? ' · 势力 <b>' + state.power + '</b>' : ''}${!state.noCult && state.pet && !state.petDead ? ' · 灵宠 <b>' + state.pet.name + '</b> Lv' + Math.floor(state.pet.lv) : ''}${!state.noCult && state.petDead ? ' · 灵宠已故' : ''}${!state.noCult && state.enemy ? ' · 仇家 <b>' + state.enemy + '</b>' : ''}${!state.noCult && (state.secrets||0) > 0 ? ' · 秘境 <b>' + state.secrets + '次</b>' : ''}${!state.noCult && state.deity ? ' · 神职 <b>' + state.deity + '</b>' : ''}${state.noCult ? ' · 心动 ' + (state.affection || 0) + (state.house ? ' · ' + state.house : '') + ' · ' + state.province + ' · ' + (state.edu || '未考') + (state.major ? '·' + state.major : '') + (state.car ? ' · ' + state.car : '') + ' · 存款 <b>' + moneyWan(state.money || 0) + '</b>' + (state.house ? ' · <b>' + state.house + '</b>' + (state.mortgage ? '（房贷 ' + moneyWan(state.mortgage) + '）' : '') : ' · 租房') : ''}${state.noCult ? '' : ' · 战力 <b>' + myPower(state) + '</b>'}${!state.noCult && state.immPartner ? ' · 仙侣 <b>' + state.immPartner + '</b>' : ''}`
    }
    renderInv()
  }

  function renderInv() {
    const box = document.getElementById('inv')
    if (!box) return
    box.innerHTML = ''
    const bar = el('div', 'invbar')
    // 丹药
    if (state.inv && state.inv.length && !state.noCult) {
      const shown = state.inv.slice(0, 7)
      shown.forEach((id, i) => {
        const it = ITEMS[id]
        const b = el('button', 'chip pill', `丹 · ${it.name}`)
        b.title = it.desc + '（点击服用）'
        b.onclick = () => { useItem(state, i); renderNew(); box.dataset.dirty = '1' }
        bar.appendChild(b)
      })
      if (state.inv.length > shown.length) {
        const more = el('span', 'chip', `+${state.inv.length - shown.length} 颗`)
        more.title = '点丹药可以服用，用完就腾地方了'
        bar.appendChild(more)
      }
    }
    // 法宝
    if (state.arts && state.arts.length) {
      state.arts.forEach(id => {
        const it = ITEMS[id]
        const c = el('span', 'chip art', `器 · ${it.name}`)
        c.title = it.desc
        bar.appendChild(c)
      })
    }
    // 控制
    const sp = el('span', 'chip ctrl', `速度 ${SPEEDS[speedIdx]}x`)
    sp.onclick = (e) => {
      e.stopPropagation()
      speedIdx = (speedIdx + 1) % SPEEDS.length
      sp.textContent = `速度 ${SPEEDS[speedIdx]}x`
      if (!paused && !userPaused && state && state.alive) tickLoop()
    }
    bar.appendChild(sp)
    const sv = el('span', 'chip ctrl', '存档/读档')
    sv.onclick = openSlots
    bar.appendChild(sv)
    const pp = el('span', 'chip ctrl', userPaused ? '继续' : '暂停')
    pp.onclick = () => {
      userPaused = !userPaused
      renderNew()
      if (!userPaused) tickLoop()
    }
    bar.appendChild(pp)
    box.appendChild(bar)
  }

  // ---------- 存档 / 读档 ----------
  function snapshot() {
    return {
      attrs: Object.assign({}, attrs),
      talents: state.talents,
      state: Object.assign({}, state, { seen: Array.from(state.seen || []), logs: state.logs.slice(-400) }),
      at: Date.now(),
      age: state.age,
      score: summarize(state).score,
    }
  }
  function slotList() {
    const v = readLS(LS.slots, [])
    return [v[0] || null, v[1] || null, v[2] || null]
  }
  function saveSlot(i) {
    const sl = slotList()
    sl[i] = snapshot()
    writeLS(LS.slots, sl)
  }
  function delSlot(i) {
    const sl = slotList()
    sl[i] = null
    writeLS(LS.slots, sl)
  }
  function openSlots() {
    const old = document.getElementById('slot-panel')
    if (old) { old.remove(); return }
    const box = el('div', 'card')
    box.id = 'slot-panel'
    box.style.cssText = 'position:fixed;right:24px;bottom:96px;width:420px;z-index:50;box-shadow:0 18px 50px #000a'
    box.appendChild(el('div', 'nm', '存档 / 读档'))
    const sl = slotList()
    const auto = readLS(LS.save, null)
    const rows = [
      { name: '自动存档', snap: auto, i: -1 },
      { name: '存档位 1', snap: sl[0], i: 0 },
      { name: '存档位 2', snap: sl[1], i: 1 },
      { name: '存档位 3', snap: sl[2], i: 2 },
    ]
    rows.forEach(r => {
      const row = el('div', 'row')
      row.style.cssText = 'border-bottom:1px dashed #26304a;padding:6px 0'
      const info = el('span', 'ds')
      info.innerHTML = `<b style="color:#cfe0ff">${r.name}</b>` + (r.snap
        ? `　${r.snap.age || '?'} 岁 · ${(r.snap.score || 0)} 分 · ${new Date(r.snap.at || Date.now()).toLocaleString()}`
        : '　空')
      row.appendChild(info)
      const btns = el('span', '')
      btns.style.cssText = 'display:flex;gap:6px;margin-left:auto'
      if (r.snap) {
        const lo = el('button', 'btn', '读取')
        lo.style.cssText = 'width:auto;padding:0 10px;'
        lo.onclick = () => {
          if (!confirm('读取这个存档？当前进度会被覆盖。')) return
          box.remove()
          restoreGame(r.snap)
        }
        btns.appendChild(lo)
      }
      if (r.i >= 0) {
        const sv = el('button', 'btn', '保存')
        sv.style.cssText = 'width:auto;padding:0 10px;'
        sv.onclick = () => {
          if (r.snap && !confirm('这个存档位已有存档，要覆盖吗？')) return
          saveSlot(r.i); box.remove(); openSlots()
        }
        btns.appendChild(sv)
        if (r.snap) {
          const de = el('button', 'btn', '删除')
          de.style.cssText = 'width:auto;padding:0 10px;'
          de.onclick = () => { delSlot(r.i); box.remove(); openSlots() }
          btns.appendChild(de)
        }
      }
      row.appendChild(btns)
      box.appendChild(row)
    })
    const tip = el('div', 'ds', '自动存档每年覆盖一次；存档位要自己点保存。')
    tip.style.cssText = 'color:#7f92b0;font-size:12px;margin-top:8px'
    box.appendChild(tip)
    document.body.appendChild(box)
  }

  function autoSave() {
    const snap = {
      attrs, talents: state.talents,
      state: Object.assign({}, state, { seen: Array.from(state.seen || []), logs: state.logs.slice(-400) }),
      score: summarize(state).score,
    }
    writeLS(LS.save, snap)
  }

  function restoreGame(snap) {
    try {
      Object.assign(attrs, snap.attrs || {})
      document.getElementById('step-alloc').classList.add('hide')
      document.getElementById('step-talent').classList.add('hide')
      document.getElementById('step-life').classList.remove('hide')
      logEl = document.getElementById('log')
      logEl.innerHTML = ''
      rendered = 0
      state = snap.state
      state.seen = new Set(snap.state.seen || [])
      if (!state.pickedChoices) state.pickedChoices = []
      renderNew()
      paused = false
      tickLoop()
    } catch (e) {
      alert('存档读不出来了，重新开一局吧。')
    }
  }

  // ---------- 结局 ----------
  function finish() {
    const s = state
    const sum = summarize(s)
    // 排行榜
    const list = readLS(LS.rank, [])
    list.push({ score: sum.score, rank: sum.rank, age: s.age, realm: s.cultivating ? (s.realm || '练气期') : '凡人', at: Date.now() })
    list.sort((a, b) => b.score - a.score)
    writeLS(LS.rank, list.slice(0, 10))
    // 转世继承
    const gain = clamp(Math.floor(sum.score / 160), 0, 5)
    if (gain > 0) writeLS(LS.legacy, 0)  // 前世继承已关闭
    // 清掉存档
    try { localStorage.removeItem(LS.save) } catch (e) {}

    // 收掉其他步骤，只留结局页
    ;['alloc', 'talent', 'life'].forEach(k => {
      const d = document.getElementById('step-' + k)
      if (d) d.classList.add('hide')
    })
    const endBox = document.getElementById('step-end')
    endBox.classList.remove('hide')
    endBox.innerHTML = ''
    try { window.scrollTo({ top: 0, behavior: 'smooth' }) } catch (e) {}
    const c = el('div', 'card')
    const wrap = el('div', 'end')
    wrap.appendChild(el('div', 'rank', sum.rank))
    wrap.appendChild(el('div', 'score', `综合评分 ${sum.score} · 享年 ${s.age} 岁 · ${s.deathReason || '寿终正寝'}`))
    if (s.realm) wrap.appendChild(el('div', 'score', `最终境界：${s.realm}`))
    wrap.appendChild(el('div', 'cmt', sum.comment))

    // 本局关键数据
    const stats = []
    if (!state.noCult && (state.power || 0) > 0) stats.push('势力 ' + state.power)
    if (!state.noCult && (state.secrets || 0) > 0) stats.push('秘境 ' + state.secrets + ' 次')
    if (state.sect) stats.push('宗门 ' + state.sect)
    if (state.deity) stats.push('神职 ' + state.deity)
    if (state.disciple) stats.push('弟子 ' + state.disciple.name)
    if (state.immPartner) stats.push('仙侣 ' + state.immPartner)
    if (!state.noCult && state.pet && !state.petDead) stats.push('灵宠 ' + state.pet.name + ' Lv' + Math.floor(state.pet.lv))
    if (state.petDead) stats.push('灵宠已故')
    if (state.enemy) stats.push('未了结的仇家 ' + state.enemy)
    if (state.child) stats.push('有儿女')
    if (state.noCult) {
      stats.push('籍贯 ' + (state.province || '—'))
      if (state.edu) stats.push('学历 ' + state.edu + (state.major ? '（' + state.major + '）' : ''))
      if (state.car) stats.push(state.car)
      if (state.parentHouse) stats.push('给父母买了房')
      stats.push('存款 ' + moneyWan(state.money || 0))
    }
    if (state.house) stats.push(state.house + (state.mortgage ? '（剩余房贷 ' + moneyWan(state.mortgage) + '）' : '（已还清）'))
    if (state.child) stats.push('有儿女')
    if (state.inv && state.inv.length) stats.push('遗物 丹药 ' + state.inv.length + ' 颗')
    if (state.arts && state.arts.length) stats.push('法宝 ' + state.arts.length + ' 件')
    if (stats.length) {
      const st = el('div', 'cmt', '本局数据：' + stats.join(' · '))
      st.style.cssText = 'color:#7f92b0;font-size:12px;margin-top:6px;max-width:560px;line-height:1.7'
      wrap.appendChild(st)
    }
    const ep = el('div', 'cmt', '墓志铭：' + makeEpitaph(state))
    ep.style.cssText = 'color:#8fa6c8;font-size:12.5px;margin-top:8px;max-width:520px;line-height:1.7;opacity:.92'
    wrap.appendChild(ep)
    const row = el('div', '')
    row.style.cssText = 'display:flex;gap:12px;justify-content:center;flex-wrap:wrap'
    const again = el('button', 'primary', '再活一次')
    again.onclick = () => location.reload()
    row.appendChild(again)
    wrap.appendChild(row)
    c.appendChild(wrap)
    endBox.appendChild(c)
  }

  function buildShell() {
    const app = el('div', 'app')
    app.style.cssText = 'width:100%;max-width:1680px;margin:0 auto;padding:16px clamp(18px,4vw,64px) 72px'
    const h = el('h1', '', '人生重开模拟器')
    h.style.cssText = 'font-size:26px;margin:4px 0 2px;background:linear-gradient(90deg,#7fb2ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent'
    const sub = el('div', '', '属性加点 → 天赋三选 → 逐年人生 · 带修仙支线')
    sub.style.cssText = 'color:#7d8cab;font-size:12.5px;margin-bottom:14px'
    app.appendChild(h)
    app.appendChild(sub)
    ;['alloc', 'talent', 'life', 'end'].forEach(k => {
      const d = el('div', 'step')
      d.id = 'step-' + k
      if (k !== 'alloc') d.classList.add('hide')
      if (k === 'life') {
        const hud = el('div', 'hud'); hud.id = 'hud-life'
        const inv = el('div', 'invbar'); inv.id = 'inv'
        const log = el('div', 'log'); log.id = 'log'
        d.appendChild(hud); d.appendChild(inv); d.appendChild(log)
      }
      if (k === 'end') d.style.cssText = "text-align:center;padding:18px 12px 28px"
      app.appendChild(d)
    })
    document.body.appendChild(app)
  }


  buildShell()
  renderAlloc()
})()
</script>
</body>
</html>
