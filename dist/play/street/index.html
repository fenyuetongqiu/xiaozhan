function freePoint(x,y,r){
  var rects=[TABLE,COUNTER];
  for (var i=0;i<rects.length;i++){
    var q=rects[i];
    if (x>q.x-r && x<q.x+q.w+r && y>q.y-r && y<q.y+q.h+r){
      var dl=Math.abs(x-q.x), dr=Math.abs(q.x+q.w-x), up=Math.abs(y-q.y), dn=Math.abs(q.y+q.h-y);
      var m=Math.min(dl,dr,up,dn);
      if (m===dl) x=q.x-r-1; else if (m===dr) x=q.x+q.w+r+1; else if (m===up) y=q.y-r-1; else y=q.y+q.h+r+1;
    }
  }
  return { x:clamp(x,STALL.x+r+2,STALL.x+STALL.w-r-2), y:clamp(y,STALL.y+r+2,STALL.y+STALL.h-r-2) };
}

function updatePlay(dt){
  INV.full=Math.max(0, INV.full-dt*0.5);
  trySpawnNpc(dt); updateNpcs(dt); helperStep(dt);
  var weak=INV.full<25;
  var p=GP.player, sp=(INV.energy<15?108:172)*(weak?0.82:1);
  var safe=freePoint(p.tx,p.ty,p.r+2);
  if (safe.x!==p.tx || safe.y!==p.ty){ p.tx=safe.x; p.ty=safe.y; }
  var dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy), moving=d>4;
  if (moving){ var mv=Math.min(sp*dt,d); p.x+=(dx/d)*mv; p.y+=(dy/d)*mv; }
  var pkx = ((KEY['d'] || KEY['arrowright']) ? 1 : 0) - ((KEY['a'] || KEY['arrowleft']) ? 1 : 0);
  var pky = ((KEY['s'] || KEY['arrowdown']) ? 1 : 0) - ((KEY['w'] || KEY['arrowup']) ? 1 : 0);
  if (pkx || pky){
    var pn = Math.sqrt(pkx*pkx + pky*pky) || 1;
    p.x += pkx / pn * sp * dt; p.y += pky / pn * sp * dt;
    p.tx = p.x; p.ty = p.y;
  }
  p.x=clamp(p.x, STALL.x+p.r, STALL.x+STALL.w-p.r);
  p.y=clamp(p.y, STALL.y+p.r, STALL.y+STALL.h-p.r);
  pushOut(p,TABLE); pushOut(p,COUNTER);

  var nearTable=nearRect(p,TABLE,44), nearCounter=nearRect(p,COUNTER,42);
  var rec=curRecipe(), key=curRecipeKey();

  if (GP.preparing && rec && key){
    var have=INV.mats[rec.matKey]||0;
    var needPrep=rec.prep*(weak?1.7:1);
    if (GP.items[key]>=4){ GP.prepAcc=0; }
    else if (have<=0){ flash('没有'+rec.matName+'了，去商城买'); GP.preparing=false; }
    else if (INV.full<=0.5){ flash('饿得没力气了，先吃点东西'); GP.preparing=false; }
    else if (INV.energy<=0.5){ flash('太累了，回家睡一觉'); GP.preparing=false; }
    else {
      GP.prepAcc+=dt;
      if (GP.prepAcc>=needPrep){
        GP.prepAcc=0; GP.items[key]+=1;
        INV.mats[rec.matKey]=have-1; INV.cash-=rec.matCost; GP.matCost+=rec.matCost;
        INV.energy=Math.max(0, INV.energy-1.2); INV.full=Math.max(0, INV.full-1.1);
      }
    }
  } else GP.prepAcc=0;

  if (GP.serveAsk>0){
    var front=GP.queue[0];
    if (front && front.st==='queue'){
      if (front.want==='seat'){
        GP.serveAsk=0;
        if ((GP.sits||[]).length < (INV.seats||0)){
          var sidx=(GP.sits||[]).length;
          var hrs = rnd(1.5, 3.0);
          GP.sits.push({ t:hrs * 40, fee:Math.round(5 * hrs) + (Math.random() < 0.3 ? 2 : 0), i:sidx });
          INV.rep=Math.min(100,INV.rep+0.35);
          front.st='leave'; front.ok=true; retarget();
          flash('开机了 · 记钟点');
        } else flash('机位满了，等有人下机');
      } else if (GP.items[front.want]>0){
        GP.items[front.want]-=1;
        var earn=priceOf(front.want);
        INV.cash+=earn; GP.revenue+=earn;
        INV.rep=Math.min(100, INV.rep+0.6); GP.served+=1; INV.totalServed=(INV.totalServed||0)+1;
        GP.serveAsk=0; front.st='leave'; front.ok=true; retarget();
      } else { flash('还没做'+RECIPES[front.want].name); GP.serveAsk=0; }
    } else GP.serveAsk=0;
  }

  for (var sq=(GP.sits||[]).length-1; sq>=0; sq--){
    var stt=GP.sits[sq]; stt.t-=dt;
    if (stt.t<=0){
      INV.cash+=stt.fee; GP.revenue+=stt.fee;
      GP.served+=1; INV.totalServed=(INV.totalServed||0)+1; INV.rep=Math.min(100,INV.rep+0.5);
      GP.sits.splice(sq,1);
      flash('下机 · +¥'+stt.fee);
    }
  }

  GP.spawnT-=dt;
  var list=shelfRecipes(), ramp=1+0.04*(INV.day-1), calm=1.15-INV.rep/340;
  if (GP.spawnT<=0 && GP.queue.length<5 && list.length){
    var want=(biz().seat && Math.random()<0.55) ? 'seat' : list[Math.floor(Math.random()*list.length)];
    GP.queue.push({ x:DOORX, y:STALL.y-10, st:'walk', pat:rnd(52,72)*phaseInfo().wait, want:want });
    GP.spawnT=rnd(10,16)/(ramp*calm*phaseInfo().cust);
  }
  for (var i=GP.queue.length-1;i>=0;i--){
    var c=GP.queue[i], tx, ty;
    if (c.st==='leave'){ tx=DOORX; ty=STALL.y-30; } else { tx=330+i*62; ty=214; }
    var ddx=tx-c.x, ddy=ty-c.y, dd=Math.hypot(ddx,ddy);
    if (dd>3){ var mvv=104*dt; c.x+=(ddx/dd)*Math.min(mvv,dd); c.y+=(ddy/dd)*Math.min(mvv,dd); }
    else if (c.st==='walk') c.st='queue';
    if (c.st==='queue'){
      c.pat-=dt;
      if (c.pat<=0){ c.st='leave'; c.ok=false; GP.lost+=1; INV.rep=Math.max(0,INV.rep-2); retarget(); flash('有人等太久走了'); }
    }
    if (c.st==='leave' && c.y<STALL.y-4) GP.queue.splice(i,1);
  }

  GP.t+=dt;
  if (GP.t>=DAY_LEN) closeStall();
}

function updateWorld(dt){
  var pl = S.player;
  if (!pl) return;
  var kx = ((KEY['d'] || KEY['arrowright']) ? 1 : 0) - ((KEY['a'] || KEY['arrowleft']) ? 1 : 0);
  var ky = ((KEY['s'] || KEY['arrowdown']) ? 1 : 0) - ((KEY['w'] || KEY['arrowup']) ? 1 : 0);
  if (kx || ky){
    var nn = Math.sqrt(kx*kx + ky*ky) || 1;
    pl.x = Math.max(40, Math.min(W - 40, pl.x + kx / nn * 250 * dt));
    pl.y = Math.max(140, Math.min(H - 64, pl.y + ky / nn * 250 * dt));
    pl.tx = pl.x; pl.ty = pl.y; pl.moving = 1; S.walkId = null;
  }
  if (S.walkAt === undefined) S.walkAt = null;
  if (S.npcs){
    for (var ni=0; ni<S.npcs.length; ni++){
      var np = S.npcs[ni];
      np.x += np.v * dt;
      if (np.x < 60){ np.x = 60; np.v = Math.abs(np.v); }
      if (np.x > W - 60){ np.x = W - 60; np.v = -Math.abs(np.v); }
    }
  }
  var dx = (pl.tx - pl.x), dy = (pl.ty - pl.y);
  var d = Math.sqrt(dx*dx + dy*dy);
  if (d > 3){
    var sp = 210 * dt;
    if (sp > d) sp = d;
    pl.x += dx / d * sp; pl.y += dy / d * sp;
    pl.moving = 1;
  } else {
    pl.moving = 0;
    if (S.walkId && S.walkId !== S.worldSel){
      S.worldSel = S.walkId;
      var st = spotState(S.walkId);
      if (st && st.biz !== 'labor') useBiz(st.biz);
    }
    S.walkId = null;
  }
  if (!S.walkId && !(kx || ky)){
    var dn0 = null;
    for (var dq=0; dq<DISTRICTS.length; dq++) if (DISTRICTS[dq].id === S.district) dn0 = DISTRICTS[dq];
    if (dn0){
      var best2 = null, bd2 = 132;
      for (var ii=0; ii<dn0.spots.length; ii++){
        var rr2 = cardRect(ii);
        var cx2 = rr2.x + rr2.w/2, cy2 = rr2.y + rr2.h + 16;
        var dd2 = Math.sqrt((pl.x-cx2)*(pl.x-cx2) + (pl.y-cy2)*(pl.y-cy2));
        if (dd2 < bd2){ bd2 = dd2; best2 = dn0.spots[ii]; }
      }
      S.worldSel = best2;
    }
  }
}

    sky.addColorStop(0, ph1.sky1); sky.addColorStop(1, ph1.sky2);
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
    if (GP && GP.t / DAY_LEN < 0.66){
      ctx.fillStyle = 'rgba(255,206,138,0.42)';
      ctx.beginPath(); ctx.arc(838, 96, 46 - (GP.t / DAY_LEN) * 20, 0, Math.PI*2); ctx.fill();
    } else if (GP){
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(838, 96, 28, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,196,130,0.22)';
      for (var st=0; st<14; st++){ ctx.beginPath(); ctx.arc(50+st*66, 34+((st*41)%64), 2, 0, Math.PI*2); ctx.fill(); }
    }
  } else { ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H); }
  if (S.scene==='title') drawTitle();
  else if (S.scene==='choose') drawChoose();
  else if (S.scene==='tuto') drawTuto();
  else if (S.scene==='help') drawHelp();
  else if (S.scene==='play') drawPlay();
  else if (S.scene==='settle') drawSettle();
  else if (S.scene==='mall') drawMall();
  else if (S.scene==='home') drawHome();
  else if (S.scene==='estate') drawEstate();
  else if (S.scene==='slots') drawSlots();
  else if (S.scene==='over') drawOver();
  else if (S.scene==='world') drawWorld();
  else if (S.scene==='job') drawJob();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__dbg=function(){
  return { scene:S.scene, day:INV?INV.day:0, cash:INV?Math.round(INV.cash):0, energy:INV?Math.round(INV.energy):0,
    comfort:INV?comfortOf(INV):0, rep:INV?Math.round(INV.rep):0,
    shelf:INV?INV.shelf.filter(Boolean).join(','):'', placed:INV?INV.placed.length:0,
    queue:GP?GP.queue.length:0, items:GP?JSON.stringify(GP.items):'', served:GP?GP.served:0,
    t:GP?Math.round(GP.t):0, err:window.__lastErr };
};
window.__newGame=function(b){ INV=newInv(b); S.slot=1; newDay(); S.scene='play'; };
window.__skip=function(s){ if (GP) GP.t=Math.min(DAY_LEN-0.3, GP.t+s); };
window.__walk=function(x,y){ if (GP){ GP.player.tx=x; GP.player.ty=y; } };
window.__prep=function(on){ if (GP) GP.preparing=!!on; };
window.__serve=function(){ if (GP) GP.serveAsk+=1; };
window.__cash=function(n){ if (INV) INV.cash+=n; };
window.__giveItems=function(n){ if (GP){ var k=curRecipeKey(); if (k) GP.items[k]+=n; } };
window.__setScene=function(s){ S.scene=s; };
window.__wipe=function(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} };
window.__inv=function(){ return INV; };
window.__world=function(){ return INV.world; };
window.__dist=function(id){ S.district=id; S.worldSel=null; };
window.__rent=function(id){ rentSpot(id); };
window.__work=function(id,kind){ startWork(id,kind||'stall'); };
window.__job=function(){ return S.job; };

</script>
